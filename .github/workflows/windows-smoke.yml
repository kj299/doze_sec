          Write-Host "hosts_check OK ($n self-test cases)"
          exit 0

      - name: Section 16 Event 7045 pipeline prints the record (wevtutil /f:text vocabulary, the bat's own findstr line)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # A field report said '[OK] No recent service install events (7045)
          # found.' while Section 18 listed 26 of them from the same log. The
          # findstr tokens (TimeCreated, ServiceName, ImagePath, AccountName)
          # were XML element names; wevtutil /f:text prints 'Date:',
          # 'Service Name:', 'Service File Name:', 'Service Account:'. Nothing
          # could ever match, so the line was a permanent false all-clear.
          # This lifts the findstr line FROM doze_sec.bat and runs it against
          # a record planted now, so the bat's text is what is tested.
          & sc.exe create dzsmoke_7045probe binPath= 'C:\Windows\System32\cmd.exe /c rem dz_selftest_7045' start= demand | Out-Null
          try {
            $bat = [string[]](Get-Content .\doze_sec.bat)
            $w = [array]::FindIndex($bat, [Predicate[string]]{ param($l) $l -match '^wevtutil qe System .*EventID=7045.*dz_pipe\.tmp' })
            if ($w -lt 0) { throw 'the Section 16 wevtutil 7045 line was not found in doze_sec.bat' }
            $fs = $null
            for ($k = $w + 1; $k -lt $w + 8; $k++) { if ($bat[$k] -match '^\s*findstr .*dz_pipe\.tmp') { $fs = $bat[$k]; break } }
            if (-not $fs) { throw 'no findstr line follows the wevtutil 7045 line' }
            $tmp = Join-Path $env:TEMP 'dz_ci_7045.txt'
            # The Service Control Manager writes 7045 asynchronously: the first
            # run of this step queried the log 300 ms after sc create and the
            # newest record was 40 s old. Wait for the record before grading,
            # and fail on its ABSENCE with its own message, so a plumbing
            # timeout is never read as a verdict about the bat's line.
            $seen = $false
            for ($try = 0; $try -lt 30; $try++) {
              & cmd.exe /c ('wevtutil qe System /q:"*[System[(EventID=7045)]]" /c:20 /rd:true /f:text > "' + $tmp + '"')
              if ((Get-Content -LiteralPath $tmp -Raw -EA SilentlyContinue) -match 'dzsmoke_7045probe') { $seen = $true; break }
              Start-Sleep -Seconds 2
            }
            if (-not $seen) { throw 'the 7045 record for the planted service never appeared in the System log within 60 s -- the pipeline could not be tested (plumbing, not a verdict about the bat)' }
            $cmdline = ($fs.Trim() -replace '>>\s*"%REPORT%"\s*$', '').Replace('"%TEMP%\dz_pipe.tmp"', '"' + $tmp + '"')
            Write-Host "running the bat's line: $cmdline"
            $out = (& cmd.exe /c $cmdline) -join "`n"
            Write-Host $out
            if ($out -notmatch 'Service Name:\s+dzsmoke_7045probe') { throw "the bat's findstr line did not print the planted 7045 record -- Section 16 would report no service was installed" }
            if ($out -notmatch 'Service File Name:\s+.*dz_selftest_7045') { throw 'the image path of the planted record was not printed' }
            # The tokens that shipped must print NOTHING against the same file,
            # so this step is known to fail on the defect, not only pass on the fix.
            $old = (& cmd.exe /c ('findstr /c:"TimeCreated" /c:"ServiceName" /c:"ImagePath" /c:"AccountName" "' + $tmp + '"')) -join "`n"
            if ($old.Trim()) { throw 'the old XML-vocabulary tokens matched /f:text output -- this step no longer distinguishes the defect' }
            Write-Host 'Section 16 7045 pipeline OK: the planted record prints through the bat''s own findstr line; the old tokens print nothing'
          } finally {
            & sc.exe delete dzsmoke_7045probe 2>&1 | Out-Null
            Remove-Item $tmp -Force -EA SilentlyContinue
          }
          exit 0

      - name: threat_list_seed.ps1 -SelfTest + live (a runtime IOC copy behind the release is replaced; an old generated CTI launch gets -NonInteractive)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $st = (.\tools\threat_list_seed.ps1 -SelfTest) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Host $st; throw 'threat_list_seed.ps1 -SelfTest failed' }
          $nst = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($nst -lt 25) { throw "threat_list_seed self-test ran only $nst case(s)" }
          Write-Host "threat_list_seed -SelfTest OK ($nst cases)"
          # Live: the SHIPPED lists against a runtime copy of ioc_registry.txt that
          # lacks the BadValue column -- the exact file the field run read.
          $rt = Join-Path $env:TEMP ('dz_ci_seed_' + $PID)
          New-Item -ItemType Directory -Path $rt -Force | Out-Null
          Set-Content (Join-Path $rt 'ioc_registry.txt') -Value @('# Last verified by doze_sec: 2026-05-01 09:00:00', 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System|EnableLUA') -Encoding ASCII
          # And the CTI checks an earlier -updateTTP wrote, before the generator
          # added -NonInteractive: the launch line must get the flag, every other
          # byte must stay, and the report must say so.
          $gen = Join-Path $rt 'ttp_generated_checks.bat'
          # A non-ASCII byte (0xE9) and an LF-only line: a text-mode rewrite
          # would change one of them, so the check below is byte-exact.
          $L1 = [Text.Encoding]::GetEncoding(28591)
          $genOld = ":: --- CTI block Caf" + [char]0xE9 + " ---`r`necho Get-Date > `"%PSRUN%`"`n`"%PWSH%`" -NoProfile -ExecutionPolicy Bypass -File `"%PSRUN%`">> `"%REPORT%`" 2>&1`r`n"
          [IO.File]::WriteAllBytes($gen, $L1.GetBytes($genOld))
          $out = (.\tools\threat_list_seed.ps1 -ShippedDir .\ThreatLists -RuntimeDir $rt) -join "`n"
          Write-Host $out
          if ($out -notmatch 'ioc_registry\.txt: runtime copy replaced by the release baseline') { throw 'the stale registry list was not replaced' }
          if (-not (Select-String -Path (Join-Path $rt 'ioc_registry.txt') -Pattern 'EnableLUA\|0' -Quiet)) { throw 'the replaced file does not carry the release BadValue column' }
          if ($out -notmatch '9 seeded, 1 replaced') { throw "expected the nine other lists seeded and one replaced: $out" }
          if ($out -notmatch 'ttp_generated_checks\.bat: 1 PowerShell launch line\(s\) written by an earlier -updateTTP now run -NonInteractive') { throw "the old generated CTI launch was not reported as given the flag: $out" }
          $genWant = [Convert]::ToBase64String($L1.GetBytes(($genOld -creplace '-NoProfile -ExecutionPolicy', '-NoProfile -NonInteractive -ExecutionPolicy')))
          $genGot = [Convert]::ToBase64String([IO.File]::ReadAllBytes($gen))
          if ($genGot -cne $genWant) { throw ("the generated CTI file changed beyond the inserted flag: {0}" -f $L1.GetString([IO.File]::ReadAllBytes($gen))) }
          Remove-Item $rt -Recurse -Force -EA SilentlyContinue
          exit 0

      - name: module_inspect.ps1 -SelfTest (virtualized module paths are not injections)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # A runner has no Office, so the real Click-to-Run case cannot be
          # planted here. These are the mapping and classification rules the
          # fourteen WINWORD warnings got wrong, with the filesystem probe
          # injected -- the only part CI can prove.
          $out = (.\tools\module_inspect.ps1 -SelfTest) -join "`n"
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw 'module_inspect self-test failed' }
          # Non-vacuity: a self-test that asserted nothing would exit 0 too.
          $n = @($out -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($n -lt 31) { throw "module_inspect self-test ran only $n case(s) -- it is not asserting what it claims" }
          # The lsass denial is graded by TOKEN: a standard user can never open
          # lsass, so with LSA Protection off it is DEFERRED there and a raised
          # WARNING only elevated. A lost case here is a lost deferral guard.
          foreach ($must in 'lsass denied, standard-user token, LSA Protection off: DEFERRED', 'lsass denied, ELEVATED, LSA Protection off: a raised gap (WARNING), never a deferral', 'LSA Protection state UNKNOWN, elevated: WARNING naming the unknown state, never OK') {
            if ($out -notmatch [regex]::Escape($must)) { throw ("module_inspect self-test no longer covers: {0}" -f $must) }
          }
          # The staging-path rule pins the Adobe native addon a field run reported
          # as CRITICAL; a lost case here is a lost false-positive guard.
          if ($out -notmatch '\[OK\]   a Node native addon under node_modules') { throw 'the Adobe node_modules\public\ must-not-raise case did not run' }
          if ($out -notmatch '\[OK\]   C:\\Users\\Public\\ IS a staging path') { throw 'the Users\Public must-raise case did not run' }
          Write-Host "module_inspect -SelfTest OK ($n cases)"
          exit 0

      - name: module_inspect.ps1 (injection detection; staged DLL must be caught)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $md = Join-Path $env:TEMP ("dz_mi_ci_{0}" -f $PID)
          New-Item -ItemType Directory -Path $md -Force | Out-Null
          $staged = "C:\Users\Public\dz_ci_probe_mod.dll"
          $unsigned = 'C:\dz_ci_mod\dz_ci_unsigned_mod.dll'
          $sig = '[DllImport("kernel32", CharSet=CharSet.Unicode)] public static extern IntPtr LoadLibraryW(string p); [DllImport("kernel32")] public static extern bool FreeLibrary(IntPtr h);'
          Add-Type -Name DzK -Namespace DzCi -MemberDefinition $sig | Out-Null
          $h = [IntPtr]::Zero
          $h2 = [IntPtr]::Zero
          try {
            # Clean runner first: a healthy box loads everything from signed
            # system locations, so any CRITICAL here is a false positive.
            $out = (.\tools\module_inspect.ps1 -MarkerDir $md) -join "`n"
            Write-Host ($out -split "`n" | Select-Object -First 15)
            if ($out -match '\[CRITICAL\]') { throw "module_inspect reported CRITICAL on a clean runner (false positive)" }
            # A runner has no Office, which is the COMMON machine shape and was
            # the one the virtualization work never exercised: Get-VfsRoots
            # returned $null for an empty result and every caller threw a
            # null-method error into the report, twice per process.
            if ($out -match 'null-valued expression|InvalidOperation|CommandNotFoundException') {
              throw "module_inspect wrote PowerShell errors into its own output on a machine with no Office"
            }
            # Load a REAL signed Microsoft DLL from a staging path into THIS
            # process, then inspect. Severity must come from the staging path,
            # not the signature -- that is the injection shape being modelled.
            Copy-Item "$env:SystemRoot\System32\version.dll" $staged -Force
            $h = [DzCi.DzK]::LoadLibraryW($staged)
            if ($h -eq [IntPtr]::Zero) { throw 'could not load the staged probe DLL' }
            # Corpus [module-unsigned-other]: an UNSIGNED module in an ordinary
            # (non-core) process from an ordinary path is counted, never raised.
            # The rule was a field promise; this plants it beside the staging
            # plant so both halves are asserted from one run. The copy has 16
            # bytes appended, so its hash matches no catalog and it reads as
            # unsigned; the PE loader ignores trailing bytes. Touches:
            # file:C:\dz_ci_mod\dz_ci_unsigned_mod.dll (root folder: not a staging
            # path, not AppData), removed in finally.
            New-Item -ItemType Directory -Path 'C:\dz_ci_mod' -Force | Out-Null
            [IO.File]::Copy("$env:SystemRoot\System32\version.dll", $unsigned, $true)
            $fs = [IO.File]::Open($unsigned, 'Append'); $fs.Write((New-Object byte[] 16), 0, 16); $fs.Close()
            $us = Get-AuthenticodeSignature -LiteralPath $unsigned
            Write-Host ("unsigned plant reads {0}" -f $us.Status)
            if ($us.Status -eq 'Valid') { throw 'appending bytes did not invalidate the signature -- the unsigned plant is not unsigned' }
            $h2 = [DzCi.DzK]::LoadLibraryW($unsigned)
            if ($h2 -eq [IntPtr]::Zero) { throw 'could not load the unsigned probe DLL' }
            $md2 = Join-Path $md 'staged'
            New-Item -ItemType Directory -Path $md2 -Force | Out-Null
            $out2 = (.\tools\module_inspect.ps1 -MarkerDir $md2) -join "`n"
            Write-Host ($out2 -split "`n" | Where-Object { $_ -match 'dz_ci_probe_mod|dz_ci_unsigned_mod|unsigned module\(s\) loaded outside' })
            if ($out2 -notmatch 'dz_ci_probe_mod\.dll') { throw 'staged module not reported' }
            if ($out2 -notmatch 'staging path') { throw 'staged module not attributed to the staging path' }
            $m = Join-Path $md2 'dz_module.txt'
            if (-not (Test-Path $m)) { throw 'staged module wrote no marker' }
            if ((Get-Content $m).Trim() -ne 'CRITICAL') { throw ("expected CRITICAL, got {0}" -f (Get-Content $m)) }
            if ($out2 -notmatch '(?m)^\[INFO\] \d+ unique unsigned module\(s\) loaded outside the core security processes') { throw 'the unsigned-outside-core count line is missing (corpus: module-unsigned-other)' }
            foreach ($l in ($out2 -split "`n" | Where-Object { $_ -match '^\[(WARNING|CRITICAL)\]|^  ' })) { if ($l -match 'dz_ci_unsigned_mod') { throw ("an unsigned module in an ordinary process was raised or itemised as a finding: " + $l) } }
          } finally {
            if ($h -ne [IntPtr]::Zero) { [void][DzCi.DzK]::FreeLibrary($h) }
            if ($h2 -ne [IntPtr]::Zero) { [void][DzCi.DzK]::FreeLibrary($h2) }
            Remove-Item $staged -Force -EA SilentlyContinue
            Remove-Item 'C:\dz_ci_mod' -Recurse -Force -EA SilentlyContinue
            Remove-Item $md -Recurse -Force -EA SilentlyContinue
          }
          Write-Host "module_inspect.ps1 OK"
          exit 0

      - name: module_inspect / emulation_coverage regression guards (batch 4)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # An UNBACKED module -- mapped into a process with no file on disk --
          # is the classic in-memory injection signal. It used to be folded into
          # the $unsignedOther tally and then explained away as "common for
          # legitimate third-party software", so the one thing this check exists
          # to surface was counted as benign.
          $mi = Get-Content .\tools\module_inspect.ps1 -Raw
          if ($mi -notmatch "elseif \(\`$v\.Why -match 'not found on disk'\)") { throw 'unbacked modules are no longer separated from the benign unsigned tally' }
          if ($mi -notmatch 'reflective or unbacked load') { throw 'the unbacked-load finding text is gone' }
          # ...but "not on disk" must be resolved through application
          # virtualization BEFORE it is called an injection. Without this, the
          # first audit run with Word open reports fourteen Office DLLs as
          # in-memory injection on a clean machine.
          if ($mi -notmatch 'Resolve-VfsPath') { throw 'the Click-to-Run/MSIX virtual-path resolution is gone; Office modules will be reported as injected again' }
          if ($mi -notmatch 'Get-HostVfsRoot') { throw 'package-root discovery from the loading process image is gone; resolution would depend on the Click-to-Run registry key alone' }
          if ($mi -notmatch 'Get-UnbackedVerdict') { throw 'the unbacked-module classifier is gone; every unresolved path asserts T1055 again' }

          # The same "absence is not evidence" rule, in the two checks that
          # learned it from the same field report.
          $cc = Get-Content .\tools\com_clsid_check.ps1 -Raw
          if ($cc -notmatch "Bucket = 'stale'") { throw 'the dangling-registration bucket is gone; a stale updater CLSID is a WARNING again' }
          if ($cc -notmatch '\$bad\) \{ return @\{ Bucket = .flagged') { throw 'a dangling registration in a staging path is no longer flagged' }
          $hc = Get-Content .\tools\hosts_check.ps1 -Raw
          if ($hc -notmatch 'SecurityDomains') { throw 'the blackhole domain list is gone; blackholing Windows Update is invisible again' }
          if ($hc -notmatch 'LocalOnlyRx') { throw 'the local-only-name rule is gone; Docker Desktop entries are a finding again' }
          # Staged paths must be inspected BEFORE the cap can discard them.
          if ($mi -notmatch '\$ordered = ') { throw 'staged-path-first ordering was removed; the cap can again drop exactly what the check looks for' }

          # An Invert case plants a BENIGN state and asserts the detection does
          # NOT fire. Counting its Attack tag let a CORE technique's "must stay
          # emulated" invariant be satisfied by a test proving the detection
          # stays silent. Prove the parser now skips Invert cases AND still
          # finds every CORE plant (a too-strict parser would fail -Strict on a
          # corpus that is actually correct).
          $out = (.\tools\emulation_coverage.ps1 -SourceDir . -Strict) -join "`n"
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw 'emulation_coverage -Strict failed after the Invert-case fix -- a CORE plant was lost' }
          $ec = Get-Content .\tools\emulation_coverage.ps1 -Raw
          if ($ec -notmatch 'Invert[^\r\n]*continue') { throw 'the Invert-case exclusion is gone' }
          $m = [regex]::Match($out, 'Emulated by a plant\s+:\s+(\d+)')
          if (-not $m.Success -or [int]$m.Groups[1].Value -lt 20) { throw "per-case parser found only $($m.Groups[1].Value) emulated techniques -- it is dropping cases" }
          Write-Host "batch 4 regression guards OK"
          exit 0

      - name: stalkerware_check.ps1 (covert monitoring; consent inventory must not accuse)
        shell: powershell
        run: |
          . .\.github\ci\stalkerware_check.ps1
          exit $LASTEXITCODE

      - name: attack_matrix.ps1 (coverage matrix derived from code; completeness enforced)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # -Strict makes the tool exit non-zero if any technique referenced in
          # the audit is missing a ttp_manifest mapping. This is the guarantee
          # that the coverage matrix cannot silently drift from what the code
          # actually detects: add a detection with a new technique id and forget
          # to describe it, and THIS job fails until the mapping is added.
          $out = (.\tools\attack_matrix.ps1 -SourceDir . -Strict) -join "`n"
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "attack_matrix -Strict found technique ids referenced by the audit but not mapped in ttp_manifest.txt (see WARNING lines above)" }
          if ($out -notmatch 'ATT&CK COVERAGE MATRIX') { throw 'matrix header missing' }
          if ($out -notmatch 'coverage matrix is complete') { throw 'completeness line missing -- unexpected unmapped techniques' }
          # Sanity: the audit's heaviest tactic must show real coverage, or the
          # source scan silently found nothing (e.g. a path/regex regression).
          if ($out -notmatch '(?m)^Persistence\s+\((\d+)\)') { throw 'Persistence tactic group missing from the matrix' }
          # Prove the gate is not vacuous. Point it at a directory with no audit
          # sources: the completeness check ("every referenced technique is
          # mapped") is trivially satisfied by an empty reference set, so a
          # scan that finds nothing must FAIL under -Strict rather than report
          # a complete matrix. A gate that passes when it checked nothing is
          # not a gate.
          $empty = Join-Path $env:TEMP ("dz_empty_src_{0}" -f $PID)
          New-Item -ItemType Directory -Path $empty -Force | Out-Null
          Copy-Item ThreatLists\ttp_manifest.txt (Join-Path $empty 'ttp_manifest.txt') -Force
          $vac = (.\tools\attack_matrix.ps1 -SourceDir $empty -Manifest (Join-Path $empty 'ttp_manifest.txt') -Strict) -join "`n"
          if ($LASTEXITCODE -eq 0) { Write-Host $vac; throw 'attack_matrix -Strict PASSED on a source tree with no techniques -- the gate can pass vacuously' }
          Remove-Item $empty -Recurse -Force -EA SilentlyContinue
          Write-Host "attack_matrix.ps1 OK (incl. empty-scan guard)"
          exit 0

      - name: assert_printed_findings_raised.ps1 -SelfTest (a printed finding must reach the ledger under its own technique)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = (.\tests\assert_printed_findings_raised.ps1 -SelfTest) -join "`n"
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw 'assert_printed_findings_raised self-test failed' }
          $n = @($out -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($n -lt 8) { throw "assert_printed_findings_raised self-test ran only $n case(s) -- it is not asserting what it claims" }
          # It must FAIL on a report that prints the finding with no matching
          # ledger row -- that is the bug it exists for, and a guard that cannot
          # fail is not a guard.
          $rep = Join-Path $env:TEMP ("dz_pfr_rep_{0}.txt" -f $PID)
          $led = [System.IO.Path]::ChangeExtension($rep, '.ledger')
          '[WARNING] Sticky Keys shortcut ENABLED (Shift x5 activates at login screen)' | Set-Content -LiteralPath $rep -Encoding ASCII
          'WARNING|13|T1486|System drive not encrypted with BitLocker' | Set-Content -LiteralPath $led -Encoding ASCII
          .\tests\assert_printed_findings_raised.ps1 -Report $rep | Write-Host
          if ($LASTEXITCODE -eq 0) { throw 'a printed finding with no matching ledger row did NOT fail the assertion' }
          # ...and pass once the row is there.
          @('WARNING|13|T1486|x','WARNING|13|T1546.008|Sticky Keys shortcut enabled') | Set-Content -LiteralPath $led -Encoding ASCII
          .\tests\assert_printed_findings_raised.ps1 -Report $rep | Write-Host
          if ($LASTEXITCODE -ne 0) { throw 'a correctly raised finding was reported as unraised' }
          # A missing ledger is a failure, not a silent pass.
          Remove-Item $led -Force
          .\tests\assert_printed_findings_raised.ps1 -Report $rep | Write-Host
          if ($LASTEXITCODE -eq 0) { throw 'a missing ledger passed -- nothing could be checked, which is not the same as nothing being wrong' }
          Remove-Item $rep -Force -EA SilentlyContinue
          Write-Host "assert_printed_findings_raised.ps1 OK ($n self-test cases + 3 real-file cases)"
          exit 0

      - name: block_sev.ps1 (severity read-back that :dz_ps_scan depends on)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # :dz_ps_scan decides whether a block raises a finding purely from
          # what this script returns. If it under-reads, a detection goes
          # silent again -- exactly the failure the mechanism exists to fix --
          # so every parsing rule is asserted here on real 5.1.
          $f = Join-Path $env:TEMP ("dz_blocksev_ci_{0}.txt" -f $PID)
          function Sev($lines) { $lines | Set-Content -LiteralPath $f -Encoding UTF8; (.\tools\block_sev.ps1 -Path $f).Trim() }

          if ((Sev @('[OK] nothing to see', '[INFO] context', '[SKIPPED] not run')) -ne 'OK') { throw 'clean block did not read OK' }
          if ((Sev @('[OK] fine', '[WARNING] Non-default WMI EventFilters found:')) -ne 'WARNING') { throw 'WARNING not detected' }
          if ((Sev @('[WARNING] a', '[CRITICAL] Known malware staging files found:')) -ne 'CRITICAL') { throw 'CRITICAL must win over WARNING' }
          if ((Sev @('  [CRITICAL] indented finding')) -ne 'CRITICAL') { throw 'indented finding missed' }
          if ((Sev @('[WARNING][T1574.001] Unsigned DLLs in system paths:')) -ne 'WARNING') { throw 'tag+technique form missed' }
          if ((Sev @('Word 16.0: [WARNING] blockcontentexecutionfrominternet=0')) -ne 'WARNING') { throw 'mid-line form missed' }
          # Prose must never inflate a block: these are the shapes that would
          # turn a clean machine into a false positive.
          if ((Sev @('[OK] No AMSI bypass patterns in recent PowerShell logs')) -ne 'OK') { throw '[OK] line inflated severity' }
          if ((Sev @('[INFO] Review [WARNING] and [CRITICAL] entries above')) -ne 'OK') { throw '[INFO] prose inflated severity' }
          if ((Sev @('[SKIPPED] WMI subscription query failed -- check NOT performed.')) -ne 'OK') { throw '[SKIPPED] inflated severity' }
          # SHORT SPELLINGS. A field report printed '[WARN] Sticky Keys shortcut
          # ENABLED' into Section 13; this grader matched only the long form, so
          # the block read OK and the finding reached neither the ledger,
          # FINDINGS COUNTED nor the exit code -- while the dashboard showed it
          # as a WARNING and the elevated remediation script carried a fix for
          # it. lint_report_echo now bans the short forms on the report path;
          # grading them is the backstop, so a reintroduced one is never silent.
          if ((Sev @('[OK] fine', '[WARN] Sticky Keys shortcut ENABLED')) -ne 'WARNING') { throw '[WARN] short form must grade as WARNING, not OK' }
          if ((Sev @('[CRIT] staging binary present')) -ne 'CRITICAL') { throw '[CRIT] short form must grade as CRITICAL' }
          if ((Sev @('[WARN] a', '[CRITICAL] b')) -ne 'CRITICAL') { throw 'CRITICAL must still win over a short WARNING' }
          if ((Sev @('Word 16.0: [WARN] macro policy weak')) -ne 'WARNING') { throw 'mid-line short form missed' }
          # ...and the short spellings must not inflate a non-finding line either.
          if ((Sev @('[OK] No [WARN] patterns in recent logs')) -ne 'OK') { throw '[OK] line inflated on a short tag' }
          if ((Sev @('[INFO] Review [WARN] entries above')) -ne 'OK') { throw '[INFO] prose inflated on a short tag' }
          if ((Sev @('[SKIP] not run')) -ne 'OK') { throw '[SKIP] inflated severity' }
          # An unreadable input must not invent a finding -- but it must not
          # claim CLEANLINESS either. Reporting OK there shipped: three ASR
          # warnings reached a user's report while Section 9 read CLEAN and the
          # finding never entered the ledger. UNREADABLE makes the caller raise
          # AUDITGAP instead, so the gap is declared rather than silent.
          if (((.\tools\block_sev.ps1 -Path (Join-Path $env:TEMP 'dz_no_such_file.txt')).Trim()) -ne 'UNREADABLE') { throw 'missing file must read UNREADABLE, not OK -- a read failure is a degradation, not a clean result' }
          # An empty block is genuinely clean, not unreadable.
          '' | Set-Content -LiteralPath $f -Encoding UTF8
          if (((.\tools\block_sev.ps1 -Path $f).Trim()) -ne 'OK') { throw 'an empty block must read OK' }
          Remove-Item $f -Force -EA SilentlyContinue
          Write-Host "block_sev.ps1 OK (18 parsing cases)"
          exit 0

      - name: verdict_audit.ps1 (a printed finding must have been raised)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The pure rules on 5.1, including the INVERSE: a ledger record whose
          # section printed neither a finding line nor a [SKIPPED] line.
          $st = (.\tools\verdict_audit.ps1 -SelfTest) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Host $st; throw 'verdict_audit.ps1 -SelfTest failed' }
          $nst = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($nst -lt 9) { throw "verdict_audit self-test ran only $nst case(s)" }
          if ($st -notmatch 'raised with NOTHING printed') { throw 'verdict_audit self-test no longer covers the inverse rule' }
          Write-Host "verdict_audit -SelfTest OK ($nst cases)"
          # This is the check a REAL run never had. The harness asserted the
          # invariant; a user's own audit did not, so a live miss went unseen.
          $r = Join-Path $env:TEMP ("dz_va_{0}.txt" -f $PID)
          $m = Join-Path $env:TEMP ("dz_va_m_{0}.txt" -f $PID)
          $bad = @(' [9/18] DEFENDER', '[WARNING] Key ASR rule not in Block mode: x', ' [SECTION 9/18 RESULT: CLEAN -- no issues detected]')
          $good = @(' [9/18] DEFENDER', '[WARNING] Key ASR rule not in Block mode: x', ' [SECTION 9/18 RESULT: ISSUES FOUND -- review]')
          $init = @('[WARNING] Could not create RunOnce key', ' [1/18] SYSTEM', '[OK] fine', ' [SECTION 1/18 RESULT: CLEAN -- no issues detected]')

          $bad | Set-Content -LiteralPath $r -Encoding UTF8
          Remove-Item $m -Force -EA SilentlyContinue
          $o = (.\tools\verdict_audit.ps1 -Report $r -MarkerFile $m) -join "`n"
          if ($o -notmatch 'never reached the findings ledger') { throw "a printed-but-unraised finding was NOT detected: $o" }
          if (-not (Test-Path $m)) { throw 'no marker written on a real mismatch, so the audit could not raise' }

          $good | Set-Content -LiteralPath $r -Encoding UTF8
          Remove-Item $m -Force -EA SilentlyContinue
          $o = (.\tools\verdict_audit.ps1 -Report $r -MarkerFile $m) -join "`n"
          if ($o -notmatch '^\[OK\]') { throw "a correctly raised finding was flagged: $o" }
          if (Test-Path $m) { throw 'marker written when there was no mismatch' }

          # THE INVERSE, on files: a ledger record whose section shows nothing.
          $l = Join-Path $env:TEMP ("dz_va_l_{0}.txt" -f $PID)
          @(' [17/18] NATION-STATE', '[INFO] 1 service(s) registered but not enumerable', ' [SECTION 17/18 RESULT: ISSUES FOUND -- review]') | Set-Content -LiteralPath $r -Encoding UTF8
          @('WARNING|17|T1014|Cross-API disagreement or hidden task - rootkit indicator') | Set-Content -LiteralPath $l -Encoding UTF8
          Remove-Item $m -Force -EA SilentlyContinue
          $o = (.\tools\verdict_audit.ps1 -Report $r -Ledger $l -MarkerFile $m) -join "`n"
          if ($o -notmatch 'never shows') { throw "a ledger record with nothing printed was NOT detected: $o" }
          if (-not (Test-Path $m)) { throw 'no marker written for the inverse defect' }
          Remove-Item $l, $m -Force -EA SilentlyContinue

          # Anything before the first section banner is outside every section.
          $init | Set-Content -LiteralPath $r -Encoding UTF8
          $o = (.\tools\verdict_audit.ps1 -Report $r) -join "`n"
          if ($o -notmatch '^\[OK\]') { throw "an INIT-path line was counted against a section: $o" }

          Remove-Item $r, $m -Force -EA SilentlyContinue
          Write-Host 'verdict_audit.ps1 OK (detects a miss, passes a raise, ignores INIT)'
          exit 0

