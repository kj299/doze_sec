      - name: lsass_copy_events.ps1 -SelfTest + a real Event 4688 pair (cmd.exe started by cmd.exe) read by the same code
        shell: powershell
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          $st = (.\tools\lsass_copy_events.ps1 -SelfTest) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Host $st; throw 'lsass_copy_events.ps1 -SelfTest failed' }
          $nst = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($nst -lt 14) { throw "lsass_copy_events self-test ran only $nst case(s)" }
          Write-Host "lsass_copy_events -SelfTest OK ($nst cases)"
          # The audit's own query, on the runner's real Security log: no copy of
          # LSASS, or the declared SKIPPED when the log holds no 4688 at all.
          $md = Join-Path $env:TEMP 'dz_ci_lsacopy'
          Remove-Item $md -Recurse -Force -EA SilentlyContinue
          New-Item -ItemType Directory -Path $md | Out-Null
          $out = (.\tools\lsass_copy_events.ps1 -MarkerDir $md) -join "`n"
          Write-Host $out
          if ($out -match 'Exception|is not recognized|CategoryInfo') { throw "PowerShell error text in the output: $out" }
          if (Test-Path (Join-Path $md 'dz_lsacopy.txt')) { throw "the runner's Security log was reported as holding a copy of LSASS: $out" }
          if (Test-Path (Join-Path $md 'dz_lsacopy_gap.txt')) { throw "an administrator could not read the runner's Security log: $out" }
          if ($out -notmatch '\[OK\] No copy of lsass\.exe in the Security log|\[SKIPPED\] Copies of lsass\.exe in the Security log NOT checked') { throw 'neither the OK line nor the declared SKIPPED' }
          # A REAL record of the same shape, made without copying anything:
          # cmd.exe started by cmd.exe gives Event 4688 with New Process Name and
          # Creator Process Name both cmd.exe. That proves the field reading
          # (NewProcessName field 5, ParentProcessName field 13, compared without
          # regard to case) on a real event, not only on synthetic records.
          # Touches: the audit-policy subcategory Process Creation, by GUID (the
          # name is localized), turned on for this step and restored in finally.
          $guid = '{0CCE922B-69AE-11D9-BED3-505054503030}'
          # Located by the GUID, as audit_policy_check does: auditpol prints a
          # blank first line and a localized header.
          $row = @(auditpol /get /subcategory:$guid /r) | Where-Object { $_ -match '0CCE922B' } | Select-Object -First 1
          $global:LASTEXITCODE = 0
          $prior = $null
          if ($row) { $f = $row -split ','; for ($i = 0; $i -lt $f.Count - 1; $i++) { if ($f[$i] -match '0CCE922B') { $prior = $f[$i + 1].Trim(); break } } }
          Write-Host "Process Creation auditing before this step: '$prior'"
          $known = @('No Auditing', 'Success', 'Failure', 'Success and Failure')
          # Never change a policy this step cannot put back exactly -- and a proof
          # that can quietly not run is a promise, so that fails the step.
          if ($known -notcontains $prior) { throw "the prior Process Creation setting could not be read exactly ('$prior'); the policy is left untouched and the real-record proof did not run" }
          $md2 = Join-Path $env:TEMP 'dz_ci_lsacopy_cmd'
          try {
            auditpol /set /subcategory:$guid /success:enable | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'auditpol could not enable Process Creation on this runner; the real-record proof did not run' }
            & cmd.exe /c "cmd.exe /c exit 0"
            $global:LASTEXITCODE = 0
            # The record can take a moment to be readable: poll, up to 30 s.
            $out2 = ''
            for ($try = 0; $try -lt 15; $try++) {
              Start-Sleep -Seconds 2
              Remove-Item $md2 -Recurse -Force -EA SilentlyContinue
              New-Item -ItemType Directory -Path $md2 | Out-Null
              $out2 = (.\tools\lsass_copy_events.ps1 -MarkerDir $md2 -Image (Join-Path $env:SystemRoot 'System32\cmd.exe') -MaxRecords 5000) -join "`n"
              if ($out2 -match '\[CRITICAL\] cmd\.exe was copied at ') { break }
            }
            Write-Host (($out2 -split "`n" | Select-Object -First 6) -join "`n")
            if ($out2 -notmatch '(?m)^\[CRITICAL\] cmd\.exe was copied at .*: Event 4688 records cmd\.exe \(PID \d+\) created by cmd\.exe \(PID \d+\) itself') { throw "the real 4688 record of cmd.exe created by cmd.exe was not read as that pair: $out2" }
            if ($out2 -match 'LSASS') { throw 'the cmd.exe run used the LSASS wording' }
            if ((Get-Content (Join-Path $md2 'dz_lsacopy.txt')).Trim() -ne 'CRITICAL') { throw 'no CRITICAL marker for the real pair' }
            Write-Host 'lsass_copy_events live OK: the real cmd.exe-from-cmd.exe record was read by the same code that looks for an LSASS copy'
          } finally {
            $sv = 'disable'; $fv = 'disable'
            if ($prior -match 'Success') { $sv = 'enable' }
            if ($prior -match 'Failure') { $fv = 'enable' }
            auditpol /set /subcategory:$guid /success:$sv /failure:$fv | Out-Null
            $global:LASTEXITCODE = 0
            Remove-Item $md2 -Recurse -Force -EA SilentlyContinue
          }
          # The restore is checked, not assumed.
          $row2 = @(auditpol /get /subcategory:$guid /r) | Where-Object { $_ -match '0CCE922B' } | Select-Object -First 1
          $global:LASTEXITCODE = 0
          $after = $null
          if ($row2) { $f2 = $row2 -split ','; for ($i = 0; $i -lt $f2.Count - 1; $i++) { if ($f2[$i] -match '0CCE922B') { $after = $f2[$i + 1].Trim(); break } } }
          if ($after -ne $prior) { throw "the Process Creation audit setting was not restored: before '$prior', after '$after'" }
          Write-Host "Process Creation auditing restored: '$after'"
          Remove-Item $md -Recurse -Force -EA SilentlyContinue
          exit 0

      - name: asr_lsass_events.ps1 -SelfTest + live (an empty log is SKIPPED while the rule is off, never cleared)
        shell: powershell
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          $st = (.\tools\asr_lsass_events.ps1 -SelfTest) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Host $st; throw 'asr_lsass_events.ps1 -SelfTest failed' }
          $nst = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($nst -lt 42) { throw "asr_lsass_events self-test ran only $nst case(s)" }
          Write-Host "asr_lsass_events -SelfTest OK ($nst cases)"
          # The runner's real Defender log. The rule's mode decides what an
          # empty log means, so each mode is asserted for the right line: no
          # record may ever read as an all-clear while nothing is being written.
          $md = Join-Path $env:TEMP 'dz_ci_asr'
          foreach ($mode in @('off', 'notconfigured', 'ungraded')) {
            Remove-Item $md -Recurse -Force -EA SilentlyContinue
            New-Item -ItemType Directory -Path $md | Out-Null
            $out = (.\tools\asr_lsass_events.ps1 -MarkerDir $md -RuleMode $mode) -join "`n"
            if ($out -match 'Exception|is not recognized|CategoryInfo') { throw "PowerShell error text with mode ${mode}: $out" }
            if ($out -notmatch '\[SKIPPED\] .* records NOT checked') { throw "mode ${mode} did not print the SKIPPED line: $out" }
            if ($out -match '(?m)^\[OK\]') { throw "mode ${mode} printed an all-clear while nothing is being recorded: $out" }
            if (Test-Path (Join-Path $md 'dz_asrlsass.txt')) { throw "mode ${mode} raised a finding from a log that records nothing: $out" }
          }
          Remove-Item $md -Recurse -Force -EA SilentlyContinue
          New-Item -ItemType Directory -Path $md | Out-Null
          $out = (.\tools\asr_lsass_events.ps1 -MarkerDir $md -RuleMode 'block') -join "`n"
          Write-Host $out
          if (Test-Path (Join-Path $md 'dz_asrlsass.txt')) { throw "the runner was reported as having a program read LSASS memory: $out" }
          # Whether a runner's Defender channel is readable at all is what this
          # measures: either the OK line or the declared gap, never silence.
          if ($out -notmatch '\[OK\] No program tried to read LSASS memory' -and $out -notmatch 'NOT checked.*the Defender Operational log could not be read' -and $out -notmatch 'DEFERRED - ADMIN REQUIRED.*Defender Operational log') { throw "neither the OK line nor the declared gap: $out" }
          Write-Host ('asr_lsass_events live OK: ' + (($out -split "`n" | Where-Object { $_ -match '^\[' }) -join ' | '))
          Remove-Item $md -Recurse -Force -EA SilentlyContinue
          exit 0

      - name: lsass_dump_config.ps1 -SelfTest + a planted dump-on-exit setting (on a test image, never the runner's LSASS)
        shell: powershell
