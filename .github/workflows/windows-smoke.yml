      - name: persistence_extra.ps1 -SelfTest (BITS destination grading, pure)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The rule above is now graded by a PURE Get-BitsVerdict, so the whole
          # of it is reachable without a bitsadmin job. The cases quote the real
          # remote from SecurityReport_20260919_181422 verbatim: a test written
          # from the shape of the RULE rather than the shape of the DATA is what
          # let the plain-HTTP branch pass CI while being wrong.
          #
          # lint.yml runs the same self-test on pwsh for fast feedback. This
          # step is the one that matters -- Windows PowerShell 5.1 is the only
          # engine this tool ever ships to, and a 5.1-only divergence has
          # already cost this repo a silent false negative.
          $out = (.\tools\persistence_extra.ps1 -SelfTest) -join "`n"
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw 'persistence_extra -SelfTest failed' }
          $ok = @($out -split "`n" | Where-Object { $_ -match '^\[OK\]' }).Count
          if ($ok -lt 25) { throw "only $ok [OK] line(s) from the BITS self-test; cases have gone missing" }
          # By NAME, so a case cannot be quietly deleted and still pass a count.
          foreach ($needle in @(
              'the real Edge Component Updater remote is context, not a finding',
              'no line anywhere says plain HTTP',
              'a bare public IP destination raises',
              'a bare private LAN address is context: http://192.168.1.10/wsus/x.cab',
              '172.32.x is outside the private block and raises',
              'a write into an autostart folder raises',
              'a download into the temp folder is what a downloader does',
              'an unreadable file list is NOT cleared',
              'an encoded-command notify payload escalates to CRITICAL')) {
            if ($out -notmatch ('\[OK\]\s+' + [regex]::Escape($needle))) {
              throw "the BITS self-test no longer covers: $needle"
            }
          }
          Write-Host 'persistence_extra -SelfTest OK on Windows PowerShell 5.1'

      - name: audit_policy_check.ps1 -SelfTest + live (auditing visibility; locale-independent cmdline signal)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The pure verdicts on real Windows PowerShell 5.1 (the engine this ships to).
          $st = (.\tools\audit_policy_check.ps1 -SelfTest) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Host $st; throw 'audit_policy_check.ps1 -SelfTest failed' }
          $nst = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($nst -lt 29) { throw "audit_policy_check self-test ran only $nst case(s)" }
          Write-Host "audit_policy_check -SelfTest OK ($nst cases)"
          $md = Join-Path $env:TEMP ("dz_ap_ci_{0}" -f $PID)
          New-Item -ItemType Directory -Path $md -Force | Out-Null
          try {
            $out = (.\tools\audit_policy_check.ps1 -MarkerDir $md) -join "`n"
            Write-Host $out
            # The runner's real cmdline-logging key state must match what the
            # tool prints -- proves the definitive signal is read correctly.
            $k = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit'
            $on = ((Get-ItemProperty -Path $k -Name 'ProcessCreationIncludeCmdLine_Enabled' -EA SilentlyContinue).ProcessCreationIncludeCmdLine_Enabled -eq 1)
            if ($on -and $out -notmatch 'command-line logging is ENABLED') { throw 'cmdline key ON but tool did not report ENABLED' }
            if (-not $on -and $out -notmatch 'command-line logging is DISABLED') { throw 'cmdline key OFF but tool did not report DISABLED' }

            # Ask WINDOWS what each configured GUID actually is, rather than
            # trusting the constant in the source. A retrospective found this
            # row querying {0CCE9217} (Audit_Logon_AccountLockout) while
            # reporting on "Audit Policy Change (4719)" -- so disabling 4719,
            # the exact T1562.002 action the row exists to catch, still printed
            # "auditing is ON". Three of the four GUIDs were right, which is
            # precisely why nobody noticed. auditpol /list resolves GUID -> name
            # on the real OS; the runner is English so the names are stable.
            $expect = @{
              '{0CCE922B-69AE-11D9-BED3-505054503030}' = 'Process Creation'
              '{0CCE9215-69AE-11D9-BED3-505054503030}' = 'Logon'
              '{0CCE9235-69AE-11D9-BED3-505054503030}' = 'User Account Management'
              '{0CCE922F-69AE-11D9-BED3-505054503030}' = 'Audit Policy Change'
              # Context row (named, never graded): the subcategory that makes
              # the SACL Windows ships on LSASS record read attempts. Verified
              # here for the same reason as the others -- a GUID labelled from
              # memory once reported the wrong subcategory as ON.
              '{0CCE921F-69AE-11D9-BED3-505054503030}' = 'Kernel Object'
            }
            # NB: /list /subcategory: takes a CATEGORY name or *, never a GUID
            # (passing one returns 0x57 ERROR_INVALID_PARAMETER). Enumerate all
            # subcategories once with /v, which prints "<name>  <guid>", and
            # build the mapping from that. The native command writes to stderr,
            # so relax EAP around it or PowerShell turns that into a
            # terminating NativeCommandError.
            $eap = $ErrorActionPreference; $ErrorActionPreference = 'Continue'
            $list = & auditpol /list /subcategory:* /v 2>&1
            $ErrorActionPreference = $eap
            $map = @{}
            foreach ($ln in $list) {
              $m = [regex]::Match([string]$ln, '^\s*(\S.*?)\s+(\{[0-9A-Fa-f]{8}-[0-9A-Fa-f-]+\})\s*$')
              if ($m.Success) { $map[$m.Groups[2].Value.ToUpper()] = $m.Groups[1].Value.Trim() }
            }
            # Guard the guard: an empty or tiny map would make every comparison
            # below vacuously true.
            if ($map.Count -lt 10) { throw "auditpol /list returned only $($map.Count) subcategory mappings -- the GUID check cannot verify anything" }
            $src = Get-Content .\tools\audit_policy_check.ps1 -Raw
            foreach ($g in $expect.Keys) {
              if ($src -notmatch [regex]::Escape($g)) { throw "audit_policy_check.ps1 no longer queries $g ($($expect[$g]))" }
              $actual = $map[$g.ToUpper()]
              if (-not $actual) { throw "auditpol does not report a subcategory with GUID $g" }
              if ($actual -ne $expect[$g]) { throw "GUID $g is '$actual' on this OS, but audit_policy_check.ps1 labels it '$($expect[$g])'" }
              Write-Host ("  {0} -> {1}  (confirmed by auditpol)" -f $g, $actual)
            }
          } finally { Remove-Item $md -Recurse -Force -EA SilentlyContinue }
          Write-Host "audit_policy_check.ps1 OK (incl. GUID-to-subcategory verification against the live OS)"
          exit 0

      # tools\make_usb_stick.ps1 puts the tool on a USB stick (copy only -- it
      # never formats) and checks a returned stick against the manifest kept on
      # the laptop. On Linux its stream cases skip; here they must run: Mark of
      # the Web on a source file must not reach the copy, and a stream added to
      # the copy on a visited machine must be reported.
      - name: make_usb_stick.ps1 -SelfTest on 5.1 (USB-only target rule, no formatting, harness left off, MOTW does not travel, a planted stream is reported, text files CRLF, a re-identified stick matched by content, the drive picker never writes unconfirmed)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = (.\tools\make_usb_stick.ps1 -SelfTest) -join "`n"
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw 'make_usb_stick self-test failed' }
          foreach ($must in 'Mark of the Web does not travel onto the copy', 'an alternate data stream added on a visited machine is reported',
                            'the script calls no formatting, partitioning or boot command', 'a copy of this repo holds the audit, no harness and not this script',
                            'a OneDrive cloud placeholder', 'a link in place of doze_sec is reported, and nothing behind it is read',
                            'refresh refuses a copy holding files it did not write', 'refresh refuses a tampered copy',
                            'an LF-only .ps1, .txt and .md land with CRLF', 'a text file holding a NUL byte (UTF-16) is copied byte for byte',
                            'a stick whose volume ID changed (another USB port) is matched by content',
                            'a CHANGED copy whose ID changed is never matched',
                            'a refused drive is listed with its reason and has no number', 'confirming with a different letter cancels',
                            'a window that cannot ask chooses nothing and names the -Drive form',
                            'a rolled-back copy (the old files and the old manifest copy, put back) is never matched under a new ID',
                            'a rewritten manifest copy on the stick is a difference',
                            'IMAPI2 builds a real image here, with no boot record',
                            'the image keeps the doze_sec folder and its long and dot-prefixed names (Joliet/UDF)',
                            'the ISO code names no boot image and no IMAPI2 boot option',
                            'an El Torito boot record (a type-0 descriptor) is found',
                            'IMAPI2 reports every staged file in the image') {
            if ($out -notmatch [regex]::Escape($must)) { throw ("make_usb_stick case missing on Windows: {0}" -f $must) }
          }
          if ($out -match '\[SKIP\] (Mark of the Web|links on the stick|IMAPI2)') { throw 'the stream or link cases skipped on Windows -- they must run here (the runner is elevated, so symbolic links can be created)' }
          $n = @($out -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($n -lt 126) { throw "make_usb_stick self-test ran only $n case(s)" }
          Write-Host "make_usb_stick -SelfTest OK ($n cases)"
          # Live, on real Storage cmdlets. -ListCandidates must refuse this
          # runner's Windows drive and say why. With no drive named the script
          # asks which stick to use; in a window that cannot ask it must stop
          # at once and write nothing -- never wait for an answer. (The runner
          # has no USB stick, so the picker most likely stops before it asks;
          # either way it must exit 1 promptly with one of its two messages.)
          $lc = (& powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\make_usb_stick.ps1 -ListCandidates 2>&1 | ForEach-Object { "$_" }) -join "`n"
          Write-Host $lc
          if ($LASTEXITCODE -ne 0) { throw '-ListCandidates failed' }
          $sd = $env:SystemDrive.TrimEnd(':')
          if ($lc -notmatch ("(?m)^\s+" + $sd + ":\s+refused")) { throw ("-ListCandidates did not refuse the Windows drive {0}:" -f $sd) }
          $job = Start-Job { param($d) & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $d 'tools\make_usb_stick.ps1') 2>&1 | ForEach-Object { "$_" }; "EXIT=$LASTEXITCODE" } -ArgumentList (Get-Location).Path
          if (-not (Wait-Job $job -Timeout 120)) { Stop-Job $job; throw 'the drive picker waited for an answer in a window that cannot ask -- it must stop instead' }
          $pk = (Receive-Job $job) -join "`n"
          Write-Host $pk
          if ($pk -notmatch 'EXIT=1') { throw 'the drive picker did not exit 1 when nothing was chosen' }
          if ($pk -notmatch 'No drive this script can put the tool on was found|This window cannot ask') { throw 'the drive picker printed neither of its two stop messages' }
          if ($pk -match 'Copying ') { throw 'the drive picker copied something with no drive confirmed' }

      - name: exec_probe.ps1 -SelfTest + live (Windows PowerShell 5.1 writes ok|FullLanguage and a Mark of the Web verdict of ok)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = @(& powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\exec_probe.ps1 -SelfTest 2>&1 | ForEach-Object { "$_" })
          $rc = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($rc -ne 0) { throw 'exec_probe self-test failed' }
          # The live stream cases run only where NTFS streams exist; on 5.1 a
          # [SKIP] there means the Mark of the Web reading was never tested.
          if ($out -match '^\[SKIP\]') { throw 'exec_probe self-test skipped its live Mark of the Web cases on Windows' }
          $okN = @($out | Where-Object { $_ -match '^\[OK\]' }).Count
          if ($okN -lt 40) { throw "exec_probe self-test: only $okN cases passed, expected >= 40" }
          $sf = Join-Path $env:TEMP ("dz_exec_ci_{0}.txt" -f $PID)
          $mf = Join-Path $env:TEMP ("dz_exec_ci_motw_{0}.txt" -f $PID)
          $lf = Join-Path $env:TEMP ("dz_exec_ci_motw_lines_{0}.txt" -f $PID)
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\exec_probe.ps1 -StateFile $sf -MotwFile $mf -MotwLinesFile $lf
          $st = (Get-Content -LiteralPath $sf -TotalCount 1)
          $vd = (Get-Content -LiteralPath $mf -TotalCount 1)
          $ln = (Get-Content -LiteralPath $lf -Raw)
          Remove-Item -LiteralPath $sf, $mf, $lf -Force -EA SilentlyContinue
          if ($st -ne 'ok|FullLanguage') { throw "exec_probe on an unrestricted runner wrote '$st', expected ok|FullLanguage -- the bats would refuse to run" }
          if ($vd -ne 'ok') { throw "exec_probe's Mark of the Web verdict on an unmarked checkout with no Group Policy is '$vd', expected ok -- the bats would refuse to run" }
          if ($ln -match 'AUDIT NOT PERFORMED') { throw "exec_probe wrote a banner on a healthy runner: $ln" }
          Write-Host "exec_probe OK ($st, Mark of the Web verdict $vd)"

      # The bats start every PowerShell with -NonInteractive, so a question
      # fails at once instead of waiting where nobody sees it (every helper's
      # output goes to the report, >nul, the console-log tee or a pipe).
      # Measured here, each in its own console as a person's run would be:
      # Read-Host without the flag waits; with it before -File it fails at
      # once; with it AFTER -File it still waits, because PowerShell hands it
      # to the script (the order tools\lint_noninteractive.ps1 enforces); and a
      # cmdlet's confirmation (Remove-Item on a folder that holds a file, no
      # -Recurse) waits without it, and with it fails at once and leaves the
      # folder. Each refusal must carry PowerShell's NonInteractive-mode error,
      # so a fast exit for some other reason cannot pass.
      # Touches: a folder under RUNNER_TEMP only, removed at the end.
      - name: "-NonInteractive: a question fails at once, the flag after -File protects nothing, a confirmation refuses rather than proceeds"
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $d = Join-Path $env:RUNNER_TEMP 'dz_noni'
          $keep = Join-Path $d 'keep'
          New-Item -ItemType Directory -Path $keep -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $keep 'child.txt') -Value 'x' -Encoding ASCII
          # Each script records the error that ended it, so a fast exit is
          # proven to be the refusal, not some other failure.
          $askErr = Join-Path $d 'ask_err.txt'
          $rmErr = Join-Path $d 'rm_err.txt'
          $ask = Join-Path $d 'ask.ps1'
          Set-Content -LiteralPath $ask -Value ("try {{ `$null = Read-Host 'dz question' }} catch {{ Set-Content -LiteralPath '{0}' -Value `$_.Exception.Message }}" -f $askErr) -Encoding ASCII
          $rm = Join-Path $d 'rm.ps1'
          Set-Content -LiteralPath $rm -Value ("try {{ Remove-Item -LiteralPath '{0}' -ErrorAction Stop }} catch {{ Set-Content -LiteralPath '{1}' -Value `$_.Exception.Message }}" -f $keep, $rmErr) -Encoding ASCII
          function Read-Err([string]$Path) { if (Test-Path -LiteralPath $Path) { return [string](Get-Content -LiteralPath $Path -Raw) } return '' }
          # taskkill /T writes to stderr when part of the tree is already gone,
          # and under Stop on 5.1 a native stderr line throws: Continue here.
          function Stop-Tree([int]$Id) {
            $ErrorActionPreference = 'Continue'
            $null = @(& taskkill /PID $Id /T /F 2>&1)
            $global:LASTEXITCODE = 0
          }
          function Test-Waits([string]$ArgLine) {
            # Its own console, so a question waits on real console input.
            $p = Start-Process -FilePath 'powershell.exe' -ArgumentList $ArgLine -WindowStyle Hidden -PassThru
            $null = $p.Handle
            $waits = -not $p.WaitForExit(15000)
            if ($waits) { Stop-Tree $p.Id }
            return $waits
          }
          try {
            $w1 = Test-Waits ('-NoProfile -ExecutionPolicy Bypass -File "{0}"' -f $ask)
            $w2 = Test-Waits ('-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"' -f $ask)
            $e2 = Read-Err $askErr
            Remove-Item -LiteralPath $askErr -Force -EA SilentlyContinue
            $w3 = Test-Waits ('-NoProfile -ExecutionPolicy Bypass -File "{0}" -NonInteractive' -f $ask)
            $w4 = Test-Waits ('-NoProfile -ExecutionPolicy Bypass -File "{0}"' -f $rm)
            $kept4 = Test-Path -LiteralPath (Join-Path $keep 'child.txt')
            $w5 = Test-Waits ('-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"' -f $rm)
            $e5 = Read-Err $rmErr
            $kept5 = Test-Path -LiteralPath (Join-Path $keep 'child.txt')
            function Say([bool]$Waited) { if ($Waited) { 'still waiting after 15 s (killed)' } else { 'ended' } }
            Write-Host ("Read-Host, no flag: {0}" -f (Say $w1))
            Write-Host ("Read-Host, -NonInteractive before -File: {0}; its error: {1}" -f (Say $w2), $e2.Trim())
            Write-Host ("Read-Host, -NonInteractive after -File: {0}" -f (Say $w3))
            Write-Host ("Remove-Item on a folder holding a file, no flag: {0}; the folder {1}" -f (Say $w4), $(if ($kept4) { 'is still there' } else { 'was REMOVED' }))
            Write-Host ("Remove-Item on a folder holding a file, -NonInteractive: {0}; the folder {1}; its error: {2}" -f (Say $w5), $(if ($kept5) { 'is still there' } else { 'was REMOVED' }), $e5.Trim())
            if (-not $w1) { throw 'Read-Host without -NonInteractive did not wait in its own console -- this runner cannot show a question waiting, so nothing here proves the flag matters' }
            if ($w2) { throw 'Read-Host with -NonInteractive before -File still waited after 15 s' }
            if ($e2 -notmatch 'NonInteractive') { throw ("Read-Host with -NonInteractive ended, but not with PowerShell's NonInteractive-mode error: '{0}'" -f $e2.Trim()) }
            if (-not $w3) { throw 'with -NonInteractive AFTER -File, Read-Host did not wait -- then the order lint_noninteractive enforces would not matter' }
            if (-not $w4 -or -not $kept4) { throw 'Remove-Item on a folder holding a file, without -NonInteractive, did not stop to ask -- the confirmation case below would prove nothing' }
            if ($w5) { throw 'Remove-Item on a folder holding a file, with -NonInteractive, still waited after 15 s' }
            if (-not $kept5) { throw 'with -NonInteractive the confirmation was answered yes: the folder was removed -- the flag would make a helper proceed where it used to ask' }
            if ($e5 -notmatch 'NonInteractive') { throw ("Remove-Item with -NonInteractive ended, but not with PowerShell's NonInteractive-mode error: '{0}'" -f $e5.Trim()) }
            Write-Host 'a question fails at once under -NonInteractive placed before -File, and a confirmation refuses rather than proceeds'
          } finally {
            Remove-Item -LiteralPath $d -Recurse -Force -EA SilentlyContinue
          }
          exit 0

      - name: driver_audit.ps1 (BYOVD by hash + unsigned catch-all; renamed cannot evade)
        shell: powershell
        run: |
          . .\.github\ci\driver_audit.ps1
          exit $LASTEXITCODE

      - name: report_seal.ps1 (tamper-evidence digest) + persistence timestamps
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # ---- Seal ------------------------------------------------------
          # The report is written to the machine under suspicion. Without a
          # digest, whoever compromised that machine can edit the report --
          # delete the finding naming their implant -- and nothing in the file
          # would show it.
          $rp = Join-Path $env:TEMP ("dz_seal_ci_{0}.txt" -f $PID)
          $hp = Join-Path $env:TEMP ("dz_seal_ci_{0}.html" -f $PID)
          Set-Content -LiteralPath $rp -Value @('[CRITICAL] example finding','more text') -Encoding UTF8
          Set-Content -LiteralPath $hp -Value '<html>x</html>' -Encoding UTF8
          try {
            $out = (.\tools\report_seal.ps1 -Report $rp -HtmlReport $hp) -join "`n"
            Write-Host $out
            $seal = "$rp.sha256"
            if (-not (Test-Path $seal)) { throw 'no digest sidecar written' }
            $real = (Get-FileHash -LiteralPath $rp -Algorithm SHA256).Hash.ToUpper()
            if ((Get-Content $seal -Raw) -notmatch [regex]::Escape($real)) { throw 'sidecar digest does not match the file' }
            if ($out -notmatch [regex]::Escape($real)) { throw 'digest was not printed to the console' }
            # The honest limit must be stated, not implied.
            if ((Get-Content $seal -Raw) -notmatch 'does not prove the audit itself') { throw 'seal omits the "this is not attestation" limit' }
            # A one-byte edit must break it -- otherwise the seal proves nothing.
            Add-Content -LiteralPath $rp -Value 'tampered'
            $after = (Get-FileHash -LiteralPath $rp -Algorithm SHA256).Hash.ToUpper()
            if ($after -eq $real) { throw 'digest did not change after the file was edited' }
            if ((Get-Content $seal -Raw) -match [regex]::Escape($after)) { throw 'sidecar somehow matches the tampered file' }
          } finally { Remove-Item $rp, $hp, "$rp.sha256" -Force -EA SilentlyContinue }

          # ---- Persistence timestamps ------------------------------------
          # A finding says WHAT was found; until now it never said WHEN it
          # appeared -- the question that decides whether an implant predates a
          # relationship, a job, or a break-in.
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $probe  = 'dz_ci_when_probe'
          if (-not (Test-Path $runKey)) { New-Item -Path $runKey -Force | Out-Null }
          # Point the autorun at a REAL FILE in a staging path, so the file half
          # of the "when:" line is exercised too and the assertion does not
          # depend solely on the registry P/Invoke succeeding. (PowerShell's
          # registry provider does not expose a key's LastWriteTime, so that
          # half comes from RegQueryInfoKey and degrades to omitted, never to a
          # made-up date.)
          $probeFile = 'C:\Users\Public\dz_ci_when_probe.exe'
          Set-Content -LiteralPath $probeFile -Value 'MZ not a real binary' -Encoding ASCII
          Set-ItemProperty -Path $runKey -Name $probe -Value "$probeFile -w hidden" -Force
          try {
            $pe = (.\tools\persistence_eval.ps1) -join "`n"
            Write-Host (($pe -split "`n" | Where-Object { $_ -match "$probe|when:|note:" }) -join "`n")
            $lines = $pe -split "`r?`n"
            $ix = -1
            for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match [regex]::Escape($probe)) { $ix = $i; break } }
            if ($ix -lt 0) { throw 'planted autorun was not reported at all' }
            $window = ($lines[$ix..([Math]::Min($ix + 4, $lines.Count - 1))]) -join "`n"
            if ($window -notmatch '(?m)^\s+when:.*\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}') { throw "finding carries no timestamped 'when:' line: $window" }
            # The caveat is what keeps the timestamp from being read as proof.
            if ($pe -notmatch 'timestomping') { throw 'timestamp caveat (per-key / timestomping) is missing' }
            # The continuation line must NOT open with a tag -- block_sev.ps1,
            # report_safety.ps1 and the findings lint all key on the leading
            # tag, so a tagged continuation would inflate every severity count.
            foreach ($l in $lines) {
              if ($l -match '^\s*\[(CRITICAL|WARNING)\].*when:') { throw "a 'when:' line opened with a severity tag: $l" }
            }
            # Both halves must be reachable: the file time always, and the
            # registry time whenever RegQueryInfoKey works on this host.
            if ($window -notmatch 'file written') { throw "the file half of the when: line is missing: $window" }
            if ($window -notmatch 'registry key last modified') { Write-Host '  NOTE: registry key time unavailable on this host -- file half only (degradation is by design)' }
          } finally {
            Remove-ItemProperty -Path $runKey -Name $probe -EA SilentlyContinue
            Remove-Item -LiteralPath $probeFile -Force -EA SilentlyContinue
          }
          Write-Host "report_seal + persistence timestamps OK"
          exit 0

      - name: log_gap_check.ps1 (records missing with no clear event)
        shell: powershell
        run: |
          # The pure grading, on the engine this tool ships to. lint.yml runs
          # the same suite on pwsh for fast feedback; a 5.1-only divergence has
          # already cost this repo a silent false negative, so this is the
          # authoritative run. The live planted cases below are not replaced
          # by it -- they cover the registry and UEFI reads it cannot.
          $stOut = (.\tools\log_gap_check.ps1 -SelfTest) -join "`n"
          Write-Host $stOut
          if ($LASTEXITCODE -ne 0) { throw 'log_gap_check.ps1 -SelfTest failed' }
          $stOk = @($stOut -split "`n" | Where-Object { $_ -match '^\[OK\]' }).Count
          if ($stOk -lt 23) { throw "only $stOk [OK] line(s) from the log_gap_check.ps1 self-test; cases have gone missing" }
          foreach ($needle in @(
              'retention: 20 MB on Security -- the Windows default',
              'retention: 0 MB on Unreadable -- size unreadable is not a small log',
              'rollover: full log rolled for the ordinary reason',
              'rollover: oldest record predates the boot',
              'unlistable: Security as a standard user is DEFERRED',
              'unlistable: Security while ELEVATED is a raised gap')) {
            if ($stOut -notmatch ('\[OK\]\s+' + [regex]::Escape($needle))) { throw "the log_gap_check.ps1 self-test no longer covers: $needle" }
          }

          $ErrorActionPreference = 'Stop'
          # THE ARITHMETIC, PROVEN. Selective record deletion cannot be planted
          # safely on a runner, so the decision lives in a pure function and
          # -SelfTest runs it over fixed inputs. Without this the live run below
          # would only prove the script executes, not that it can tell a rolled
          # log from a gutted one -- and those two cases are the whole point.
          $st = (.\tools\log_gap_check.ps1 -SelfTest) -join "`n"
          Write-Host $st
          if ($LASTEXITCODE -ne 0) { throw 'log_gap_check -SelfTest failed: the gap arithmetic is wrong' }
          if ($st -notmatch 'records removed from the middle') { throw 'self-test no longer covers the middle-removal case' }
          if ($st -notmatch 'rolled over') { throw 'self-test no longer covers normal rollover -- the false-positive guard is unproven' }
          $cases = ([regex]::Matches($st, '(?m)^\[OK\]')).Count
          if ($cases -lt 7) { throw "self-test ran only $cases case(s) -- it is not exercising the decision function" }
          if ($st -notmatch 'was a false positive') { throw 'the rolled-log regression case was removed -- the CI false positive can return' }

          # LIVE RUN. A healthy runner must not raise: normal circular rollover
          # keeps the numbering consistent, so a finding here would be a false
          # positive of exactly the kind this project keeps fixing.
          $md = Join-Path $env:TEMP ("dz_lg_ci_{0}" -f $PID)
          New-Item -ItemType Directory -Path $md -Force | Out-Null
          try {
            $out = (.\tools\log_gap_check.ps1 -MarkerDir $md) -join "`n"
            Write-Host $out
            $seen = ([regex]::Matches($out, "Event log '")).Count
            if ($seen -lt 3) { throw "only $seen log(s) were inspected -- the check verified almost nothing" }
            if ($out -notmatch 'event log\(s\) inspected') { throw 'no inspection tally emitted' }
            $m = Join-Path $md 'dz_loggap.txt'
            if (Test-Path $m) {
              $sev = (Get-Content $m).Trim()
              # A WARNING is acceptable on a runner (the Security log is often
              # capped small, and PowerShell/Operational may be absent); a
              # CRITICAL would mean it thinks records were deleted, which on a
              # fresh CI VM is a false positive worth failing on.
              if ($sev -eq 'CRITICAL') { throw "log_gap_check reported CRITICAL on a clean runner (false positive): $out" }
              Write-Host "  (marker $sev on the runner -- acceptable; CRITICAL would not be)"
            }
            # The honest framing must survive: this reports an accounting
            # inconsistency, not proven deletion.
            $src = Get-Content .\tools\log_gap_check.ps1 -Raw
            if ($src -notmatch 'not proof of deletion') { throw 'the "inconsistency, not proof" framing was removed' }
          } finally { Remove-Item $md -Recurse -Force -EA SilentlyContinue }
          # A GAP IS ITS OWN ROW: a log that does not exist, on an ELEVATED token,
          # is a raised gap -- dz_loggap_gap.txt, NO finding marker -- so the
          # ledger row reads "gap check NOT performed", never "records missing".
          $mdN = Join-Path $env:TEMP ("dz_lg_gap_{0}" -f $PID)
          New-Item -ItemType Directory -Path $mdN -Force | Out-Null
          try {
            $outN = (.\tools\log_gap_check.ps1 -MarkerDir $mdN -LogNames @('DzNoSuchLog')) -join "`n"
            Write-Host $outN
            if ($outN -notmatch "\[WARNING\] Log 'DzNoSuchLog' could not be read -- gap check NOT performed") { throw 'a log that does not exist was not declared as a raised gap on the elevated token' }
            if (-not (Test-Path (Join-Path $mdN 'dz_loggap_gap.txt'))) { throw 'the unreadable-log gap wrote no gap marker -- it would vanish from the ledger' }
            if (Test-Path (Join-Path $mdN 'dz_loggap.txt')) { throw 'the unreadable-log gap wrote the FINDING marker -- its ledger row would claim records missing' }
          } finally { Remove-Item $mdN -Recurse -Force -EA SilentlyContinue }
          Write-Host "log_gap_check.ps1 OK"
          exit 0

      - name: "MEASURE: why the runner's real CBS logs read slower than a synthetic one (read-only, before any other CBS read)"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # PR #264 measured 64.3 MB of REAL CBS log in 12.4 s while a fresh
          # 150 MB synthetic log took 2.3 s on the same runner. Disk (a cold
          # first read), per-file cost, NTFS compression or content shape each
          # need a different fix, so this step measures instead of guessing.
          # It runs BEFORE the cbs step below so the first touch is cold.
          # Read-only: every file is opened for Read with ReadWrite sharing.
          $dir = Join-Path $env:SystemRoot 'Logs\CBS'
          $files = @(Get-ChildItem -LiteralPath $dir -Filter '*.log' -File -EA SilentlyContinue | Sort-Object LastWriteTimeUtc -Descending)
          $buf = New-Object byte[] 1048576
          function RawRead([string]$p) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $fs = [IO.File]::Open($p, 'Open', 'Read', 'ReadWrite')
            try { while ($fs.Read($buf, 0, $buf.Length) -gt 0) { } } finally { $fs.Dispose() }
            return $sw.Elapsed.TotalSeconds
          }
          $tot = @{ Bytes = [long]0; Cold = 0.0; Warm = 0.0; Tool = 0.0 }
          Write-Host ("{0} CBS log file(s) under {1}" -f $files.Count, $dir)
          foreach ($f in $files) {
            $comp = [bool]($f.Attributes -band [IO.FileAttributes]::Compressed)
            $cold = RawRead $f.FullName
            $warm = RawRead $f.FullName
            $md = Join-Path $env:TEMP ("dz_cbs_meas_{0}" -f $PID)
            New-Item -ItemType Directory -Path $md -Force | Out-Null
            try { $o = (.\tools\cbs_integrity_check.ps1 -Path $f.FullName -MarkerDir $md -BudgetSeconds 600) -join "`n" } finally { Remove-Item $md -Recurse -Force -EA SilentlyContinue }
            $t = [regex]::Match($o, 'Scanned [\d.,]+ MB of CBS log in ([\d.,]+) s')
            $tool = if ($t.Success) { [double]::Parse($t.Groups[1].Value.Replace(',', '.'), [Globalization.CultureInfo]::InvariantCulture) } else { -1 }
            $hits = ([regex]::Matches($o, '(?im)corrupt|repaired|cannot repair')).Count
            $mb = $f.Length / 1MB
            Write-Host ("  {0,-40} {1,8:N1} MB  compressed={2,-5}  cold {3,6:N2} s ({4,7:N1} MB/s)  warm {5,6:N2} s ({6,7:N1} MB/s)  tool(warm) {7,6:N2} s  finding-words-in-output {8}" -f $f.Name, $mb, $comp, $cold, ($mb / [math]::Max($cold, 0.001)), $warm, ($mb / [math]::Max($warm, 0.001)), $tool, $hits)
            $tot.Bytes += $f.Length; $tot.Cold += $cold; $tot.Warm += $warm; if ($tool -ge 0) { $tot.Tool += $tool }
          }
          $mbT = $tot.Bytes / 1MB
          Write-Host ("TOTAL {0:N1} MB in {1} file(s): cold raw {2:N2} s, warm raw {3:N2} s, tool on warm files {4:N2} s" -f $mbT, $files.Count, $tot.Cold, $tot.Warm, $tot.Tool)
          # The disk's share is what a cold read costs over a warm one; the
          # scan's share is the tool's time on files already in the cache.
          $disk = [math]::Max($tot.Cold - $tot.Warm, 0)
          $verdict = if ($disk -ge 0.7 * ($disk + $tot.Tool)) { 'I/O-bound (the cold disk read is most of the time)' } elseif ($tot.Tool -ge 0.7 * ($disk + $tot.Tool)) { 'CPU-bound (the scan, not the disk)' } else { 'mixed' }
          Write-Host ("disk share {0:N2} s, scan share {1:N2} s" -f $disk, $tot.Tool)
          Write-Host ("MEASURED VERDICT: {0}" -f $verdict)
          exit 0

      - name: cbs_integrity_check.ps1 (Windows' own record of corrupt system binaries)
        shell: powershell
        run: |
          . .\.github\ci\cbs_integrity_check.ps1
          exit $LASTEXITCODE

      - name: section_coverage.ps1 (a CLEAN verdict must not cover checks that never ran)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $rp = Join-Path $env:TEMP ("dz_sc_ci_{0}.txt" -f $PID)
          # Section 9 skipped two checks; section 10 skipped none but MENTIONS
          # the word in prose; section 11 skipped one but found issues, so its
          # verdict must be left alone.
          Set-Content -LiteralPath $rp -Encoding UTF8 -Value @(
            '===================================================================='
            ' [9/18] DEFENDER AND AV STATUS'
            '===================================================================='
            '[SKIPPED] Get-MpPreference failed -- path-exclusion check NOT performed.'
            '[OK] something fine'
            '[SKIPPED] Get-MpComputerStatus failed -- core status NOT evaluated.'
            ' [SECTION 9/18 RESULT: CLEAN -- no issues detected]'
            '===================================================================='
            ' [10/18] SMB, RDP, REMOTE ACCESS'
            '===================================================================='
            '[OK] everything ran'
            '[INFO] this line mentions [SKIPPED] in prose but is not one'
            ' [SECTION 10/18 RESULT: CLEAN -- no issues detected]'
            '===================================================================='
            ' [11/18] POWERSHELL'
            '===================================================================='
            '[SKIPPED] provider unavailable'
            ' [SECTION 11/18 RESULT: ISSUES FOUND -- review [WARNING] entries above]'
          )
          try {
            $out = (.\tools\section_coverage.ps1 -Report $rp) -join "`n"
            Write-Host $out
            $m = [regex]::Match($out, 'Calibrated (\d+) section verdict')
            if (-not $m.Success) { throw 'no calibration tally emitted' }
            if ([int]$m.Groups[1].Value -ne 1) { throw "expected exactly 1 calibrated verdict, got $($m.Groups[1].Value)" }
            $txt = Get-Content -LiteralPath $rp -Raw
            # Section 9: calibrated, and CLEAN is still the FIRST token after
            # RESULT: -- detection_selftest's section-sync assertion reads that
            # token, and every other consumer keys on 'ISSUES FOUND'.
            if ($txt -notmatch '\[SECTION 9/18 RESULT: CLEAN -- no issues detected, but 2 checks in this section could NOT run') { throw 'section 9 verdict was not calibrated' }
            # Section 10: prose mention must NOT count.
            if ($txt -notmatch '\[SECTION 10/18 RESULT: CLEAN -- no issues detected\]') { throw 'section 10 was calibrated from a prose mention of [SKIPPED]' }
            # Section 11: ISSUES FOUND is never touched.
            if ($txt -notmatch '\[SECTION 11/18 RESULT: ISSUES FOUND') { throw 'an ISSUES FOUND verdict was rewritten' }
            # No denominator invented: the tool cannot know how many checks ran.
            if ($txt -match 'of \d+ checks') { throw 'a checks-attempted ratio was invented' }
            # Idempotent: running twice must not double-append.
            $out2 = (.\tools\section_coverage.ps1 -Report $rp) -join "`n"
            $m2 = [regex]::Match($out2, 'Calibrated (\d+) section verdict')
            if ([int]$m2.Groups[1].Value -ne 0) { throw 'second run re-calibrated an already-calibrated verdict' }
          } finally { Remove-Item $rp -Force -EA SilentlyContinue }
          Write-Host "section_coverage.ps1 OK"
          exit 0

      - name: edr_presence.ps1 (telemetry inventory; a stopped agent is the finding)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $md = Join-Path $env:TEMP ("dz_edr_ci_{0}" -f $PID)
          # Deliberately NOT pre-created: Write-Marker must create the marker
          # directory itself. A field test lost a real WARNING to exactly this
          # -- the write failed silently into a missing directory.
          try {
            # CLEAN RUNNER: no third-party EDR, no Sysmon. That is the NORM on
            # a consumer machine, so it must be [INFO] and must NOT write a
            # marker -- raising it would fire on nearly every home PC and teach
            # the reader to skip Section 9, the exact false-positive pattern
            # fixed for ADFS, Azure AD Connect and the default screensaver.
            $out = (.\tools\edr_presence.ps1 -MarkerDir $md) -join "`n"
            Write-Host $out
            if (Test-Path (Join-Path $md 'dz_edr.txt')) {
              throw ("edr_presence raised on a clean runner (false positive): " + (Get-Content (Join-Path $md 'dz_edr.txt')))
            }
            if ($out -notmatch 'Sysmon is not installed') { throw 'no Sysmon verdict emitted' }
            if ($out -notmatch 'inspected') { throw 'no inspection tally emitted' }
            # Guard the guard: a run that enumerated nothing must not look clean.
            $m = [regex]::Match($out, '(\d+) security product/agent\(s\) inspected')
            if (-not $m.Success) { throw 'inspection tally not parseable' }
            # The honest framing must survive: absence is context, not a fault.
            if ($out -notmatch 'Not a fault') { throw 'the "absence is not a fault" framing was removed' }

            # THE ONE BRANCH THAT PRODUCES A FINDING must be proven, not
            # assumed: plant a STOPPED service using an EDR name the tool
            # knows, and require a WARNING plus a marker.
            #
            # The SERVICE NAME must stay a real product name -- edr_presence
            # matches by service name, so a test-scoped name would exercise
            # nothing. What is test-scoped is the BINARY PATH: it carries
            # 'dz_selftest', which is what Section 18's Event 7045 check
            # excludes. Six 7045 records for 'SentinelAgent' with a cmd.exe
            # image path outlived a manual run of this block on a real machine
            # and were reported as suspicious service installs on every later
            # audit -- correctly, since that is exactly an attacker's shape.
            # Excluding the NAME would let an attacker hide a service by
            # calling it SentinelAgent; excluding the harness marker in the
            # image path costs no coverage.
            & sc.exe create SentinelAgent binPath= 'C:\Windows\System32\cmd.exe /c rem dz_selftest_ci_probe' start= demand | Out-Null
            $md2 = Join-Path $env:TEMP ("dz_edr_ci2_{0}" -f $PID)
            try {
              $out2 = (.\tools\edr_presence.ps1 -MarkerDir $md2) -join "`n"
              Write-Host (($out2 -split "`n" | Where-Object { $_ -match 'SentinelOne|NOT RUNNING' }) -join "`n")
              if ($out2 -notmatch 'INSTALLED BUT NOT RUNNING') { throw 'a stopped EDR service was not reported' }
              $m2 = Join-Path $md2 'dz_edr.txt'
              if (-not (Test-Path $m2)) { throw 'stopped EDR service wrote no marker -- the finding never reaches the ledger' }
              if ((Get-Content $m2).Trim() -ne 'WARNING') { throw ("expected WARNING, got " + (Get-Content $m2)) }
              # The summary must not contradict the finding above it: a stopped
              # agent was DETECTED, so the report may not also claim none was.
              if ($out2 -match 'No third-party EDR agent was detected') { throw 'summary claims no third-party EDR while warning about a stopped one' }
            } finally {
              & sc.exe delete SentinelAgent 2>&1 | Out-Null
              Remove-Item $md2 -Recurse -Force -EA SilentlyContinue
            }

            # A machine never onboarded to Defender for Endpoint ships the
            # 'Sense' service stopped. That is the NORM on consumer PCs and
            # must be [INFO] with no marker -- a field test on a real home PC
            # hit this exact false positive. Only plant if the runner has no
            # real Sense service of its own.
            $senseExists = $true
            try { Get-Service -Name Sense -EA Stop | Out-Null } catch { $senseExists = $false }
            if (-not $senseExists) {
              & sc.exe create Sense binPath= 'C:\Windows\System32\cmd.exe /c rem dz_selftest_ci_probe' start= demand | Out-Null
              $md3 = Join-Path $env:TEMP ("dz_edr_ci3_{0}" -f $PID)
              try {
                $out3 = (.\tools\edr_presence.ps1 -MarkerDir $md3) -join "`n"
                if ($out3 -match "INSTALLED BUT NOT RUNNING \(service 'Sense'") { throw 'a never-onboarded Sense service was flagged as a stopped EDR (false positive)' }
                if ($out3 -notmatch 'never been onboarded') { throw 'no onboarding-state explanation emitted for the inert Sense service' }
                if (Test-Path (Join-Path $md3 'dz_edr.txt')) { throw 'inert Sense service raised a marker (false positive)' }
              } finally {
                & sc.exe delete Sense 2>&1 | Out-Null
                Remove-Item $md3 -Recurse -Force -EA SilentlyContinue
              }
            } else {
              Write-Host 'Sense exists on this runner; skipping the never-onboarded plant.'
            }
          } finally { Remove-Item $md -Recurse -Force -EA SilentlyContinue }
          Write-Host "edr_presence.ps1 OK"
          exit 0

      # Section 9's Defender core block, extracted from the bats. The passive-mode
      # judgement (AMRunningMode not 'Normal' => another antivirus owns protection,
      # so Defender's own real-time flags are INFO, not CRITICAL) was the last
      # benign twin in the corpus with no test: a second antivirus cannot be
      # installed on a runner. The self-test drives the pure report function
      # with injected status objects; the live run grades this runner's real
      # state, which ships with real-time protection OFF (every full-run report
      # since the image was built shows the CRITICAL).
      - name: guest_account_check.ps1 -SelfTest + live (two sources; accounts that could not be read are a raised gap, never an all-clear)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $st = (.\tools\guest_account_check.ps1 -SelfTest) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Host $st; throw 'guest_account_check -SelfTest failed' }
          $n = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($n -lt 10) { throw "guest_account_check self-test ran only $n case(s)" }
          function RunG([hashtable]$Extra) {
            $md = Join-Path $env:TEMP ("dz_ci_guest_{0}_{1}" -f $PID, [guid]::NewGuid().ToString('N').Substring(0, 6)); New-Item -ItemType Directory -Path $md -Force | Out-Null
            try {
              $o = (& .\tools\guest_account_check.ps1 -MarkerDir $md @Extra) -join "`n"; Write-Host $o
              if ($o -match 'is not recognized|CategoryInfo') { throw "PowerShell error text: $o" }
              return @{ Out = $o; State = (Get-Content (Join-Path $md 'dz_guest_state.txt') -Raw).Trim(); Gap = (Test-Path (Join-Path $md 'dz_guest_gap.txt')); Hit = (Test-Path (Join-Path $md 'dz_guest_hit.txt')) }
            } finally { Remove-Item $md -Recurse -Force -EA SilentlyContinue }
          }
          # LIVE: both sources read the runner; the built-in Guest is disabled
          # on a clean image (a claim to pin), and each source alone agrees.
          $both = RunG @{}
          if ($both.State -ne 'guest=disabled' -or $both.Gap -or $both.Hit) { throw "a clean runner did not read guest=disabled: $($both.Out)" }
          $c = RunG @{ Sources = 'cim' }; $l = RunG @{ Sources = 'localuser' }
          if ($c.State -ne $both.State -or $l.State -ne $both.State) { throw "the two sources disagree: cim=$($c.State) localuser=$($l.State)" }
          if ($c.Out -notmatch 'read by CIM Win32_UserAccount' -or $l.Out -notmatch 'read by Get-LocalUser') { throw 'a line does not name the source that answered' }
          Write-Host "MEASURED: the runner's Guest state is $($both.State) (CIM and Get-LocalUser agree)"
          # THE READ THAT FAILS, through the real readers: a CIM class that
          # does not exist, alone, is a raised gap; beside Get-LocalUser, the
          # fallback answers.
          $g = RunG @{ Sources = 'cim'; CimClass = 'Win32_DzCiNoSuchClass' }
          if ($g.State -ne 'guest=gap' -or -not $g.Gap -or $g.Hit) { throw "a CIM query that failed was not a raised gap: $($g.Out)" }
          if ($g.Out -match '(?m)^\[OK\]') { throw 'a CIM query that failed printed an all-clear' }
          $f = RunG @{ CimClass = 'Win32_DzCiNoSuchClass' }
          if ($f.State -ne $both.State -or $f.Gap -or $f.Out -notmatch 'read by Get-LocalUser') { throw "Get-LocalUser did not answer when CIM failed: $($f.Out)" }
          Write-Host 'guest account: both sources agree; a failed CIM read falls back to Get-LocalUser, and both failing is a raised gap'
          exit 0

      - name: firewall_state_check.ps1 + smb1_check.ps1 -SelfTest + live (the effective state from every source; a state that could not be read is a raised gap; SMBv1 planted)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($t in 'firewall_state_check', 'smb1_check') {
            $st = (& ".\tools\$t.ps1" -SelfTest) -join "`n"
            if ($LASTEXITCODE -ne 0) { Write-Host $st; throw "$t -SelfTest failed" }
            $n = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
            if ($n -lt 16) { throw "$t self-test ran only $n case(s)" }
          }
          function RunT([string]$Tool, [string]$Name, [hashtable]$Extra) {
            $md = Join-Path $env:TEMP ("dz_ci_{0}_{1}_{2}" -f $Name, $PID, [guid]::NewGuid().ToString('N').Substring(0, 6)); New-Item -ItemType Directory -Path $md -Force | Out-Null
            try {
              $o = (& ".\tools\$Tool.ps1" -MarkerDir $md @Extra) -join "`n"; Write-Host $o
              if ($o -match 'is not recognized|CategoryInfo') { throw "PowerShell error text: $o" }
              $sf = Join-Path $md ("dz_{0}_state.txt" -f $Name)
              return @{ Out = $o; State = $(if (Test-Path $sf) { (Get-Content $sf -Raw).Trim() } else { '' }); Gap = (Test-Path (Join-Path $md "dz_${Name}_gap.txt")); Hit = (Test-Path (Join-Path $md "dz_${Name}_hit.txt")) }
            } finally { Remove-Item $md -Recurse -Force -EA SilentlyContinue }
          }
          # FIREWALL, LIVE: every source reads the runner's effective state;
          # each profile source alone must agree with the other.
          $all = RunT 'firewall_state_check' 'fw' @{}
          if ($all.State -notmatch '^fw=(on|off),' -or $all.Gap) { throw "the runner's firewall state was not read: $($all.Out)" }
          $ns = RunT 'firewall_state_check' 'fw' @{ Sources = 'netsecurity' }
          $co = RunT 'firewall_state_check' 'fw' @{ Sources = 'com' }
          if ($ns.State -ne $co.State) { throw "the two profile sources disagree on this runner: netsecurity=$($ns.State) com=$($co.State)" }
          if ($ns.Out -notmatch 'Get-NetFirewallProfile \(ActiveStore\)' -or $co.Out -notmatch 'HNetCfg\.FwPolicy2') { throw 'a line does not name the source that answered' }
          Write-Host "MEASURED: the runner's firewall reads $($all.State) (ActiveStore and FwPolicy2 agree: $($ns.State))"
          # THE READS THAT FAIL, through the real readers: a service that does
          # not exist is said and does not move the profile verdict; asking no
          # profile source at all is a raised gap, never an all-clear.
          $sv = RunT 'firewall_state_check' 'fw' @{ ServiceName = 'dz_ci_nosuchsvc' }
          if ($sv.State -ne $ns.State -or $sv.Out -notmatch 'firewall service could not be queried') { throw "a failed service query moved or hid the verdict: $($sv.Out)" }
          $g = RunT 'firewall_state_check' 'fw' @{ Sources = 'service' }
          if ($g.State -ne 'fw=gap,profiles=-' -or -not $g.Gap -or $g.Hit -or $g.Out -match '(?m)^\[OK\]') { throw "no profile source was not a raised gap: $($g.Out)" }
          # SMBv1, LIVE: a clean runner has no SMBv1 server -- a claim to pin.
          $s = RunT 'smb1_check' 'smb1' @{}
          if ($s.State -notmatch '^smb1=(disabled|absent)$' -or $s.Gap -or $s.Hit) { throw "a clean runner did not read SMBv1 disabled or absent: $($s.Out)" }
          $sm = RunT 'smb1_check' 'smb1' @{ Sources = 'smb' }; $ci = RunT 'smb1_check' 'smb1' @{ Sources = 'cim' }
          Write-Host "MEASURED: SMBv1 reads $($s.State); Get-SmbServerConfiguration alone $($sm.State), Win32_OptionalFeature alone $($ci.State)"
          if ($sm.Gap -or $ci.Gap) { throw 'a single SMBv1 source could not be read on an elevated runner' }
          $g = RunT 'smb1_check' 'smb1' @{ Sources = 'cim'; CimClass = 'Win32_DzCiNoSuchClass' }
          if ($g.State -ne 'smb1=gap' -or -not $g.Gap -or $g.Hit -or $g.Out -match '(?m)^\[OK\]') { throw "a CIM query that failed was not a raised gap: $($g.Out)" }
          # SMBv1 PLANT (runner only; restored in finally): the server's own
          # configuration says SMBv1 is on. If this image refuses the setting,
          # say so -- the self-test still pins the judgement.
          $prev = (Get-SmbServerConfiguration).EnableSMB1Protocol
          $planted = $false; $refused = ''
          try {
            try { Set-SmbServerConfiguration -EnableSMB1Protocol $true -Force -Confirm:$false -ErrorAction Stop; $planted = ((Get-SmbServerConfiguration).EnableSMB1Protocol -eq $true) }
            catch { $refused = $_.Exception.Message }
            if ($planted) {
              $p = RunT 'smb1_check' 'smb1' @{}
              if ($p.State -ne 'smb1=enabled' -or -not $p.Hit -or $p.Out -notmatch '(?m)^\[CRITICAL\] SMBv1 ENABLED \(EternalBlue CVE-2017-0144\)$') { throw "a planted SMBv1 server was not CRITICAL: $($p.Out)" }
              Write-Host 'smb1 plant: the enabled server configuration is the CRITICAL finding'
            } elseif ($refused) { Write-Host ("[ SKIP ] SMBv1 plant not run: this image refuses Set-SmbServerConfiguration -EnableSMB1Protocol ({0}); the self-test pins the judgement" -f $refused) }
            else { Write-Host '[ SKIP ] SMBv1 plant not run: the setting did not take on this image; the self-test pins the judgement' }
          } finally {
            Set-SmbServerConfiguration -EnableSMB1Protocol ([bool]$prev) -Force -Confirm:$false -EA SilentlyContinue
          }
          Write-Host 'firewall and SMBv1: every source agrees on the runner, a failed read is a raised gap, never an all-clear'
          exit 0

      - name: winrm_check.ps1 -SelfTest + live (a WinRM service that could not be queried is a raised gap; a name that does not exist is "not present" by the service manager's own answer)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $st = (.\tools\winrm_check.ps1 -SelfTest) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Host $st; throw 'winrm_check -SelfTest failed' }
          $n = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($n -lt 13) { throw "winrm_check self-test ran only $n case(s)" }
          function RunW([hashtable]$Extra) {
            $md = Join-Path $env:TEMP ("dz_ci_winrm_{0}_{1}" -f $PID, [guid]::NewGuid().ToString('N').Substring(0, 6)); New-Item -ItemType Directory -Path $md -Force | Out-Null
            try {
              $o = (& .\tools\winrm_check.ps1 -MarkerDir $md @Extra) -join "`n"; Write-Host $o
              if ($o -match 'is not recognized|CategoryInfo') { throw "PowerShell error text: $o" }
              $sf = Join-Path $md 'dz_winrm_state.txt'
              return @{ Out = $o; State = $(if (Test-Path $sf) { (Get-Content $sf -Raw).Trim() } else { '' }); Gap = (Test-Path (Join-Path $md 'dz_winrm_gap.txt')); Hit = (Test-Path (Join-Path $md 'dz_winrm_hit.txt')) }
            } finally { Remove-Item $md -Recurse -Force -EA SilentlyContinue }
          }
          # LIVE: the runner's own WinRM, graded by Get-Service; the ports said.
          $live = RunW @{}
          if ($live.State -notmatch '^winrm=(running|stopped)$' -or $live.Gap) { throw "the runner's WinRM service was not read: $($live.Out)" }
          if ($live.Out -notmatch '\[INFO\] (Listening on TCP|Nothing is listening on TCP|The WinRM listening ports)') { throw 'the listening ports were not stated' }
          # Server images run WinRM with an HTTP listener on 5985: a running
          # service must not be told "nothing is listening" (the per-port
          # not-found error once discarded the 5985 rows).
          if ($live.State -eq 'winrm=running' -and $live.Out -match 'Nothing is listening on TCP 5985') { Write-Host 'MEASURED: WinRM runs with no listener on this image' }
          Write-Host "MEASURED: the runner's WinRM reads $($live.State)"
          # THE READ THAT FAILS, through the real readers: Get-Service cannot
          # find the name, and the service manager's own exit code (1060)
          # says it does not exist -- not present, no gap, never a guess.
          $ab = RunW @{ ServiceName = 'dz_ci_nosuchsvc' }
          if ($ab.State -ne 'winrm=absent' -or $ab.Gap -or $ab.Hit -or $ab.Out -notmatch 'sc\.exe query exit 1060') { throw "a service that does not exist was not read as not present by the SCM: $($ab.Out)" }
          Write-Host 'winrm: the runner is read by Get-Service; a missing service is "not present" by the service manager''s own exit code'
          exit 0

      - name: cred_settings_check.ps1 -SelfTest + every state through the real registry reader (absent is the default; a key that cannot be read is a raised gap)
        shell: powershell
        run: |
          # The body lives in .github/ci/ -- this file is at GitHub's size limit.
          & .\.github\ci\cred_settings_states.ps1
          exit $LASTEXITCODE

      - name: reg_policy_check.ps1 -SelfTest + every state through the real registry reader (Winlogon/AppInit, Script Block Logging, UAC; a key that cannot be read is a raised gap)
        shell: powershell
        run: |
          # The body lives in .github/ci/ -- this file is at GitHub's size limit.
          & .\.github\ci\reg_policy_states.ps1
          exit $LASTEXITCODE

      - name: file_walk_check.ps1 -SelfTest + every state through the real walker (TEMP streams, large HTML, Outlook items; a folder that cannot be read is a raised gap)
        shell: powershell
        run: |
          & .\.github\ci\file_walk_states.ps1
          exit $LASTEXITCODE

      - name: named_pipe_check.ps1 -SelfTest + live (a C2 pipe list that could not be read is a raised gap, never an all-clear)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $st = (.\tools\named_pipe_check.ps1 -SelfTest) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Host $st; throw 'named_pipe_check -SelfTest failed' }
          $n = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($n -lt 8) { throw "named_pipe_check self-test ran only $n case(s)" }
          # LIVE on the runner: both sets list \\.\pipe\ cleanly and find no
          # default C2 pipe (a clean runner's state is a claim to pin).
          foreach ($c in @(@{ Set = 'CobaltStrike'; Key = 'cs' }, @{ Set = 'NextGenC2'; Key = 'c2' })) {
            $md = Join-Path $env:TEMP ("dz_ci_pipes_{0}_{1}" -f $c.Key, $PID); New-Item -ItemType Directory -Path $md -Force | Out-Null
            try {
              $o = (.\tools\named_pipe_check.ps1 -Set $c.Set -MarkerDir $md) -join "`n"; Write-Host $o
              if ($o -match 'Exception|is not recognized|CategoryInfo') { throw "PowerShell error text: $o" }
              $state = (Get-Content (Join-Path $md ("dz_pipes_{0}_state.txt" -f $c.Key)) -Raw).Trim()
              if ($state -ne ($c.Key + '=0')) { throw "a clean runner did not read $($c.Key)=0 (state $state): $o" }
              $ln = [regex]::Match($o, '(?m)^\[INFO\] Listed (\d+) named pipe\(s\)\.$')
              if (-not $ln.Success -or [int]$ln.Groups[1].Value -lt 5) { throw "the runner's pipe list came back nearly empty -- the reader read nothing: $o" }
              Write-Host "MEASURED: the runner's $($c.Set) pipe state is $state"
            } finally { Remove-Item $md -Recurse -Force -EA SilentlyContinue }
          }
          # A REAL HIT, through the real reader: open a pipe named like Cobalt
          # Strike's default (postex_) and it must be named, raised as a hit and
          # counted in the state. Only a test-scoped pipe, closed in finally.
          $srv = New-Object System.IO.Pipes.NamedPipeServerStream(("postex_dzci_{0}" -f $PID), [System.IO.Pipes.PipeDirection]::InOut, 1)
          $md = Join-Path $env:TEMP ("dz_ci_pipes_hit_{0}" -f $PID); New-Item -ItemType Directory -Path $md -Force | Out-Null
          try {
            $o = (.\tools\named_pipe_check.ps1 -Set CobaltStrike -MarkerDir $md) -join "`n"; Write-Host $o
            if ($o -notmatch ("(?m)^postex_dzci_{0}$" -f $PID)) { throw 'the planted postex_ pipe was not named' }
            if ($o -notmatch '(?m)^\[WARNING\] Possible Cobalt Strike pipes detected\.$') { throw 'the planted postex_ pipe was not raised' }
            if (-not (Test-Path (Join-Path $md 'dz_pipes_cs_hit.txt'))) { throw 'the hit wrote no hit marker -- it would never reach the ledger' }
            if ((Get-Content (Join-Path $md 'dz_pipes_cs_state.txt') -Raw).Trim() -ne 'cs=1') { throw 'the state does not count the planted pipe' }
          } finally { $srv.Dispose(); Remove-Item $md -Recurse -Force -EA SilentlyContinue }
          # THE LISTING THAT FAILS, through the real reader: a pipe directory
          # that does not exist must be a raised gap, never "[OK] No ... pipes".
          $md = Join-Path $env:TEMP ("dz_ci_pipes_gap_{0}" -f $PID); New-Item -ItemType Directory -Path $md -Force | Out-Null
          try {
            $o = (.\tools\named_pipe_check.ps1 -Set CobaltStrike -MarkerDir $md -PipeDir (Join-Path $env:TEMP ("dz_no_such_pipe_dir_{0}" -f $PID))) -join "`n"; Write-Host $o
            if ($o -notmatch '(?m)^\[WARNING\] Cobalt Strike named-pipe check NOT performed') { throw 'a pipe list that could not be read was not declared a NOT-performed gap' }
            if ($o -match '(?m)^\[(OK|SKIPPED)\]') { throw 'a failed pipe listing printed [OK] or an unraised [SKIPPED]' }
            if (-not (Test-Path (Join-Path $md 'dz_pipes_cs_gap.txt'))) { throw 'the gap wrote no gap marker' }
            if (Test-Path (Join-Path $md 'dz_pipes_cs_hit.txt')) { throw 'the gap wrote the hit marker -- its row would claim a Cobalt Strike pipe' }
            if ((Get-Content (Join-Path $md 'dz_pipes_cs_state.txt') -Raw).Trim() -ne 'cs=gap') { throw 'the state does not say gap' }
          } finally { Remove-Item $md -Recurse -Force -EA SilentlyContinue }
          Write-Host 'named pipes: clean on the runner; a failed listing is a raised gap through the real reader'
          exit 0

      - name: account_events_check.ps1 + wmi_subscription_check.ps1 -SelfTest + live (a read that failed is a raised gap, never an all-clear)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($t in @(@{ N = 'account_events_check'; Min = 7 }, @{ N = 'wmi_subscription_check'; Min = 8 })) {
            $st = (& ".\tools\$($t.N).ps1" -SelfTest) -join "`n"
            if ($LASTEXITCODE -ne 0) { Write-Host $st; throw "$($t.N) -SelfTest failed" }
            $n = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
            if ($n -lt $t.Min) { throw "$($t.N) self-test ran only $n case(s)" }
            Write-Host "$($t.N) -SelfTest OK ($n cases)"
          }
          # LIVE, read-only, on the elevated runner: both read cleanly, so no
          # gap marker and a valid state line. The counts are the runner's own.
          $md = Join-Path $env:TEMP ("dz_ci_acct_{0}" -f $PID); New-Item -ItemType Directory -Path $md -Force | Out-Null
          try {
            $o = (.\tools\account_events_check.ps1 -MarkerDir $md) -join "`n"; Write-Host $o
            if ($o -match 'Exception|is not recognized|CategoryInfo') { throw "PowerShell error text: $o" }
            if ((Test-Path (Join-Path $md 'dz_acctev4720_gap.txt')) -or (Test-Path (Join-Path $md 'dz_acctev4732_gap.txt'))) { throw "an administrator could not read the runner's Security log: $o" }
            $st = (Get-Content (Join-Path $md 'dz_acctev_state.txt') -Raw).Trim()
            if ($st -notmatch '^e4720=\d+,e4732=\d+$') { throw "unexpected state: $st" }
            Write-Host "MEASURED: the runner's account-event state is $st"
          } finally { Remove-Item $md -Recurse -Force -EA SilentlyContinue }
          $md = Join-Path $env:TEMP ("dz_ci_wmi_{0}" -f $PID); New-Item -ItemType Directory -Path $md -Force | Out-Null
          try {
            $o = (.\tools\wmi_subscription_check.ps1 -MarkerDir $md) -join "`n"; Write-Host $o
            if ($o -match 'Exception|is not recognized|CategoryInfo') { throw "PowerShell error text: $o" }
            if (Test-Path (Join-Path $md 'dz_wmisub_gap.txt')) { throw "an administrator could not query root\subscription on the runner: $o" }
            $st = (Get-Content (Join-Path $md 'dz_wmisub_state.txt') -Raw).Trim()
            if ($st -notmatch '^filter=\d+,cmd=\d+,script=\d+$') { throw "unexpected state: $st" }
            if ($st -ne 'filter=0,cmd=0,script=0') { throw "a clean runner reported a WMI subscription (false positive): $o" }
            Write-Host "MEASURED: the runner's WMI subscription state is $st"
          } finally { Remove-Item $md -Recurse -Force -EA SilentlyContinue }
          # THE READ THAT FAILS, through the real readers: a log and a namespace
          # that do not exist. Each must be a raised gap -- the gap marker, no
          # hit marker, no [OK] -- and the state must say gap, not 0.
          $md = Join-Path $env:TEMP ("dz_ci_acct_gap_{0}" -f $PID); New-Item -ItemType Directory -Path $md -Force | Out-Null
          try {
            $o = (.\tools\account_events_check.ps1 -MarkerDir $md -LogName 'dz-ci-no-such-log' -Elevated 1) -join "`n"; Write-Host $o
            if ($o -notmatch '(?m)^\[WARNING\] New-account check \(Event 4720\) NOT performed') { throw 'an unreadable log was not declared a NOT-performed gap' }
            if ($o -match '(?m)^\[OK\]') { throw 'an unreadable log printed an all-clear' }
            if (-not ((Test-Path (Join-Path $md 'dz_acctev4720_gap.txt')) -and (Test-Path (Join-Path $md 'dz_acctev4732_gap.txt')))) { throw 'the gap wrote no gap marker for each check' }
            if ((Test-Path (Join-Path $md 'dz_ev4720_hit.txt')) -or (Test-Path (Join-Path $md 'dz_ev4732_hit.txt'))) { throw 'the gap wrote a hit marker -- its row would claim an account was created' }
            if ((Get-Content (Join-Path $md 'dz_acctev_state.txt') -Raw).Trim() -ne 'e4720=gap,e4732=gap') { throw 'the state does not say gap' }
          } finally { Remove-Item $md -Recurse -Force -EA SilentlyContinue }
          $md = Join-Path $env:TEMP ("dz_ci_wmi_gap_{0}" -f $PID); New-Item -ItemType Directory -Path $md -Force | Out-Null
          try {
            $o = (.\tools\wmi_subscription_check.ps1 -MarkerDir $md -Namespace 'root\dz_ci_no_such_namespace' -Elevated 1) -join "`n"; Write-Host $o
            if ($o -notmatch '(?m)^\[WARNING\] WMI EventFilter check NOT performed') { throw 'a namespace that could not be queried was not declared a NOT-performed gap' }
            if ($o -match '(?m)^\[(OK|SKIPPED)\]') { throw 'a failed WMI query printed [OK] or an unraised [SKIPPED]' }
            if (-not (Test-Path (Join-Path $md 'dz_wmisub_gap.txt'))) { throw 'the gap wrote no gap marker' }
            if (Test-Path (Join-Path $md 'dz_wmi_filter_hit.txt')) { throw 'the gap wrote a hit marker -- its row would claim a subscription' }
            if ((Get-Content (Join-Path $md 'dz_wmisub_state.txt') -Raw).Trim() -ne 'filter=gap,cmd=gap,script=gap') { throw 'the state does not say gap' }
          } finally { Remove-Item $md -Recurse -Force -EA SilentlyContinue }
          Write-Host 'account events + WMI subscriptions: clean on the runner; a failed read is a raised gap through the real reader'
          exit 0

