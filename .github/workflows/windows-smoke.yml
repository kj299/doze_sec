name: windows-smoke

# Real-Windows smoke tests. The lint workflow runs on Linux/pwsh and the
# author develops on Linux, so neither can exercise cmd.exe end-to-end,
# Windows PowerShell 5.1 runtime behavior, real WMI/CIM, findstr, or detect
# a runtime HANG. These jobs close that gap by running on a genuine Windows
# runner (Windows Server 2022 + built-in Windows PowerShell 5.1).
#
# Job 1 (helpers-ps51): parses every tools/*.ps1 with the 5.1 language parser
# and executes the read-only ones against real WMI/CIM/scheduled-tasks/
# Authenticode/Get-FileHash -- catching 5.1-only and WMI issues a Linux/pwsh
# box cannot see. Includes a 20,000-char-line select_lines.ps1 case (the
# exact shape that hangs findstr).
#
# Job 2 (full-run): runs doze_sec.bat end-to-end under a hard timeout. A hang
# (e.g. the Section 4 findstr-on-long-lines regression) makes the job exceed
# its timeout and FAIL, instead of silently shipping. -dev bypasses the
# Server-edition OS gate; -sdu/-nosrp skip the network threat-list pull and
# the restore point.
#
# Job 3 (readonly-field-test): tests\field_test.ps1, the script a person runs,
# from a stick-equivalent copy, proving -readonly changes nothing; then the
# managed-machine experiments (Group Policy AllSigned, RemoteSigned and
# Unrestricted with the Mark of the Web, ConstrainedLanguage), each of which
# must stop both bats with AUDIT NOT PERFORMED, never CLEAN. Jobs 4 and 5
# (detection-selftest, detection-selftest-noadmin): the plant harness through
# each bat. Job 6 (noadmin-true-run): doze_sec_noAdmin.bat as a real standard
# user (tests\noadmin_smoke.ps1).

# TRIGGER ECONOMICS: this repository is private, so Actions minutes are
# metered, and these six windows-latest jobs bill at 2x with 20-35 minute
# timeouts. Running them on every PR push exhausted the month's quota
# mid-cycle (2026-08). The first response removed the suite from PRs entirely
# -- which meant a bug fix or feature got only the Linux lint before merge and
# the Windows suite only after landing on main. That is backwards: the diet
# must never cost coverage of a functional change. So the suite runs on any
# PR that touches functional code (the bats, tools/, tests/, threat lists,
# the workflows) and skips only docs-only PRs; the concurrency rule below
# stops a superseded push from billing a second full suite.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'doze_sec.bat'
      - 'doze_sec_noAdmin.bat'
      - 'tools/**'
      - 'tests/**'
      - 'ThreatLists/**'
      - '.github/workflows/**'
      - '.github/ci/**'
  # Manual kick. Without this there is no way to re-run these checks except by
  # pushing a commit -- which is exactly the wrong tool when the checks failed
  # for a reason that has nothing to do with the diff (a runner outage, an
  # expired token, a transient registry fetch). Keep it: the day you need it,
  # adding it requires the push you were trying to avoid.
  workflow_dispatch:

# A superseded run's minutes are pure waste at 2x billing.
concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helpers-ps51:
    name: "tools/*.ps1 on Windows PowerShell 5.1 (real WMI/CIM)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Note: every step ends with `exit 0`. The helpers legitimately return a
      # non-zero exit code (e.g. select_lines.ps1 returns 1 for "no match",
      # mirroring findstr); GitHub's powershell shell would otherwise propagate
      # that leaked $LASTEXITCODE as a step failure. Assertion failures still
      # `exit 1` before reaching the final `exit 0`, and ErrorActionPreference
      # = Stop fails the step on any thrown error.
      - name: Parse every helper with the Windows PowerShell 5.1 parser
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          Get-ChildItem tools\*.ps1, tests\*.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $bad += "$($_.Name): $($errs[0].Message)" }
          }
          if ($bad) { $bad | ForEach-Object { Write-Host "PARSE ERROR  $_" }; exit 1 }
          Write-Host "All tools/*.ps1 + tests/*.ps1 parse clean under Windows PowerShell $($PSVersionTable.PSVersion)"
          exit 0

      - name: scheduled_tasks_full.ps1 (real Get-ScheduledTask + Authenticode)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($m in 'Inventory','Suspicious','System') {
            .\tools\scheduled_tasks_full.ps1 -Mode $m | Out-Null
            if ($LASTEXITCODE -gt 1) { Write-Host "scheduled_tasks_full -Mode $m exit $LASTEXITCODE"; exit 1 }
          }
          Write-Host "scheduled_tasks_full OK (all three modes)"
          exit 0

      # Corpus [appdata-signed-tasks]: per-user updaters (Brave, Chrome, Zoom,
      # Teams) register tasks whose binary lives under %AppData%; validly signed
      # ones are INFO, anything else CRITICAL. The rule was only ever a field
      # promise. Plant both halves: a copy of a signed binary (a catalog
      # signature verifies by hash, so the copy stays Valid; an embedded one
      # travels with the file) and the same copy with bytes appended, whose
      # hash matches no catalog. Touches: task:dz_ci_appdata_signed,
      # task:dz_ci_appdata_unsigned, file:%APPDATA%\dz_ci_updater\ -- all removed
      # in finally. Runner only; a person's machine never runs this step.
      - name: scheduled_tasks_full.ps1 -- a validly-signed per-user updater under AppData is INFO; an unsigned one is CRITICAL
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:APPDATA 'dz_ci_updater'
          $good = Join-Path $dir 'updater.exe'
          $bad  = Join-Path $dir 'updater_broken.exe'
          $marker = Join-Path $env:TEMP 'dz_susptask_crit.txt'
          $tasks = @('dz_ci_appdata_signed', 'dz_ci_appdata_unsigned')
          try {
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            $tried = @()
            $src = $null
            foreach ($cand in @((Join-Path $PSHOME 'powershell.exe'), 'C:\Program Files\PowerShell\7\pwsh.exe', (Join-Path $env:SystemRoot 'System32\notepad.exe'))) {
              if (-not (Test-Path -LiteralPath $cand)) { $tried += ("{0}: absent" -f $cand); continue }
              Copy-Item -LiteralPath $cand -Destination $good -Force
              $s = Get-AuthenticodeSignature -LiteralPath $good
              $tried += ("{0}: {1}/{2}" -f $cand, $s.Status, $s.SignatureType)
              if ($s.Status -eq 'Valid') { $src = $cand; break }
            }
            if (-not $src) { throw ("no candidate stays Valid once copied under AppData -- the plant cannot be built; tried: " + ($tried -join '; ')) }
            Write-Host ("signed twin: {0} (copy of {1})" -f $good, $src)
            [IO.File]::Copy($good, $bad, $true)
            $fs = [IO.File]::Open($bad, 'Append'); $fs.Write((New-Object byte[] 16), 0, 16); $fs.Close()
            $sb = Get-AuthenticodeSignature -LiteralPath $bad
            Write-Host ("unsigned twin: {0} reads {1}" -f $bad, $sb.Status)
            if ($sb.Status -eq 'Valid') { throw 'appending bytes did not invalidate the signature -- the unsigned twin is not unsigned' }
            $trig = New-ScheduledTaskTrigger -Once -At (Get-Date).AddYears(1)
            Register-ScheduledTask -TaskName $tasks[0] -Action (New-ScheduledTaskAction -Execute $good) -Trigger $trig -Force | Out-Null
            Register-ScheduledTask -TaskName $tasks[1] -Action (New-ScheduledTaskAction -Execute $bad)  -Trigger $trig -Force | Out-Null
            Remove-Item $marker -Force -EA SilentlyContinue
            $out = (.\tools\scheduled_tasks_full.ps1 -Mode Suspicious) -join "`n"
            Write-Host ($out -split "`n" | Where-Object { $_ -match 'dz_ci_updater|validly-signed|suspicious locations' })
            $infoLine = ($out -split "`n" | Where-Object { $_ -match '^\[INFO\] \d+ validly-signed task\(s\) under %AppData%' } | Select-Object -First 1)
            if (-not $infoLine) { throw 'the signed per-user updater was not reported as INFO (corpus: appdata-signed-tasks)' }
            # The INFO line names TASK names; the indented line under it names the
            # task path and the signer (the tool prints task identity, not the exe).
            if ($infoLine -notmatch 'dz_ci_appdata_signed') { throw ("the INFO line does not name the signed task: " + $infoLine) }
            $signerLine = ($out -split "`n" | Where-Object { $_ -match '\\dz_ci_appdata_signed\s+\[signer: ' } | Select-Object -First 1)
            if (-not $signerLine) { throw 'the INFO block has no "[signer: ...]" line for the signed task' }
            if ($signerLine -match '\[signer: \]') { throw ("the signer is empty: " + $signerLine) }
            if (-not ($out -match '\[CRITICAL\][^\n]*suspicious locations[^\n]*dz_ci_appdata_unsigned' -and $out -match 'updater_broken\.exe')) { throw 'the unsigned twin under AppData was NOT reported CRITICAL -- the signature gate no longer bites' }
            foreach ($l in ($out -split "`n" | Where-Object { $_ -match '^\[(WARNING|CRITICAL)\]' })) { if ($l -match 'dz_ci_appdata_signed') { throw ("the SIGNED task appears in a finding line: " + $l) } }
            # The marker carries the COUNT of flagged tasks (the bat reads it with
            # set /p as a number), so it must be a positive integer here.
            if (-not (Test-Path $marker)) { throw 'the unsigned twin raised no marker' }
            $mv = (Get-Content $marker).Trim()
            if ($mv -notmatch '^\d+$' -or [int]$mv -lt 1) { throw ("expected the marker to hold a count of at least 1, got '{0}'" -f $mv) }
          } finally {
            foreach ($tn in $tasks) { Unregister-ScheduledTask -TaskName $tn -Confirm:$false -EA SilentlyContinue }
            Remove-Item $dir -Recurse -Force -EA SilentlyContinue
            Remove-Item $marker -Force -EA SilentlyContinue
          }
          Write-Host 'scheduled_tasks_full: signed under AppData is INFO, unsigned under AppData is CRITICAL'
          exit 0

      - name: browser_extensions.ps1 -SelfTest (a store install is graded on provenance)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # A runner has no browser profiles, so the enumeration half proves
          # only that the script does not throw -- the previous step piped its
          # output to Out-Null and asserted NOTHING about the grading, which is
          # how a permission rule that ignored provenance survived.
          $out = (.\tools\browser_extensions.ps1 -SelfTest) -join "`n"
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw 'browser_extensions self-test failed' }
          $n = @($out -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($n -lt 22) { throw "browser_extensions self-test ran only $n case(s) -- it is not asserting what it claims" }
          # And the real enumeration must still run clean on a profile-less host.
          $real = (.\tools\browser_extensions.ps1) -join "`n"
          Write-Host $real
          if ($real -match 'null-valued expression|InvalidOperation') {
            throw 'browser_extensions wrote PowerShell errors into its own output'
          }
          Write-Host "browser_extensions OK ($n self-test cases)"
          exit 0

      - name: select_lines.ps1 incl. a 20,000-char line (findstr would hang); -SelfTest exit codes 0/1/2 on 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $f = Join-Path $env:TEMP 'dz_ci_proc.tmp'
          'brave.exe  1  C:\Users\x\AppData\Local\BraveSoftware\Brave-Browser\Application\brave.exe' | Set-Content $f
          ('giant.exe  2  C:\Windows\giant.exe ' + ('x' * 20000)) | Add-Content $f
          'mshta.exe  3  C:\Windows\System32\mshta.exe' | Add-Content $f
          .\tools\select_lines.ps1 -Path $f "\AppData\" | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "expected AppData match (exit 0), got $LASTEXITCODE"; exit 1 }
          .\tools\select_lines.ps1 -Path $f "ScreenConnect" "AnyDesk" | Out-Null
          if ($LASTEXITCODE -ne 1) { Write-Host "expected no RMM match (exit 1), got $LASTEXITCODE"; exit 1 }
          Write-Host "select_lines OK (matched through a 20KB line, no hang)"
          # Sections 18a, 18f and 18g branch on these exit codes through
          # powershell.exe -File on 5.1: 0 matched, 1 none, 2 nothing to match
          # with (reported as NOT performed, never [OK]).
          $st = (.\tools\select_lines.ps1 -SelfTest) -join "`n"
          Write-Host $st
          if ($LASTEXITCODE -ne 0) { throw 'select_lines -SelfTest failed on Windows PowerShell 5.1' }
          $n = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($n -lt 12) { throw "select_lines self-test ran only $n case(s)" }
          foreach ($must in 'a list holding only comments and blanks is exit 2', 'a missing list is exit 2', 'a hit on a line holding # is kept') {
            if ($st -notmatch [regex]::Escape($must)) { throw ("select_lines case missing: {0}" -f $must) }
          }
          $cg = (.\tools\count_gaps.ps1 -SelfTest) -join "`n"
          Write-Host $cg
          if ($LASTEXITCODE -ne 0) { throw 'count_gaps -SelfTest failed on Windows PowerShell 5.1' }
          exit 0

      - name: top_findings.ps1 + report_format.ps1 on a sample report
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Join-Path $env:TEMP 'dz_ci_report.txt'
          $lines = @(
            '===================================================================='
            ' [6/18] SCHEDULED TASKS'
            '===================================================================='
            '--- CRITICAL: Tasks with Actions in Suspicious Paths ---'
            '[CRITICAL] 1 scheduled task(s) with actions in suspicious locations: EvilTask'
            '===================================================================='
            ' [1/18] SYSTEM IDENTITY AND PATCH LEVEL'
            '===================================================================='
            '[OK] placeholder line'
          )
          $lines | Set-Content -LiteralPath $r -Encoding UTF8
          .\tools\top_findings.ps1 -Report $r
          if (-not (Select-String -LiteralPath $r -Pattern 'TOP FINDINGS' -Quiet)) { Write-Host "top_findings did not prepend its block"; exit 1 }
          # wevtutil /f:text leaves NUL-terminated fields in event text (Event 7045's
          # "Service Account:", Defender 1116's "Level:"); a field report carried 100.
          # report_format strips them and reports the count for the summary line.
          Add-Content -LiteralPath $r -Value ('Service Account:  LocalSystem' + [char]0) -Encoding UTF8
          Add-Content -LiteralPath $r -Value ('  Level: Information' + [char]0 + [char]0) -Encoding UTF8
          $before = @([IO.File]::ReadAllBytes($r) | Where-Object { $_ -eq 0 }).Count
          if ($before -ne 3) { throw "the sample should carry 3 NUL bytes before report_format, has $before" }
          $cf = Join-Path $env:TEMP 'dz_ci_report_nul.txt'
          Remove-Item $cf -Force -EA SilentlyContinue
          .\tools\report_format.ps1 -Report $r -NulCountFile $cf | Out-Null
          if ([IO.File]::ReadAllBytes($r) -contains [byte]0) { throw 'report_format left NUL bytes in the report' }
          if (-not (Test-Path $cf)) { throw 'report_format wrote no NUL count file' }
          $cnt = (Get-Content $cf).Trim()
          if ($cnt -ne '3') { throw "report_format counted '$cnt' NUL bytes, expected 3" }
          if (-not (Select-String -LiteralPath $r -Pattern 'Service Account:  LocalSystem$' -Quiet)) { throw 'the text around the stripped NUL was damaged' }
          Write-Host "top_findings + report_format OK (3 NUL bytes stripped and counted)"
          exit 0

      - name: report_html.ps1 surfaces a Findings Index with section links
        shell: powershell
        run: |
          # Dot-sourced, as GitHub runs an inline body: a preference the body
          # sets (ErrorActionPreference) must stay global, or module cmdlets
          # would keep GitHub's 'stop'. Every moved step below does the same.
          . .\.github\ci\report_html.ps1
          exit $LASTEXITCODE

      - name: ioc_hash_check.ps1 (real Get-FileHash, capped; a list it cannot use is NOT performed)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $gm = Join-Path $env:TEMP 'dz_iochit_18k_gap.txt'
          Remove-Item -LiteralPath $gm -Force -EA SilentlyContinue
          .\tools\ioc_hash_check.ps1 -IocFile ThreatLists\ioc_hashes.txt -MaxFiles 3 | Out-Null
          if (Test-Path -LiteralPath $gm) { throw 'the shipped hash list raised a NOT-performed gap' }
          # A missing list, and one holding no valid SHA256 row, used to print
          # "[INFO] ... skipped": raised nothing, and Section 18's summary did not
          # count it as a gap. Both are now a raised gap with its own marker.
          $cm = Join-Path $env:TEMP 'dz_ci_hashes_comments.txt'
          Set-Content -LiteralPath $cm -Value @('# comments only', 'not-a-hash|x|y') -Encoding ASCII
          foreach ($case in @(@{ F = (Join-Path $env:TEMP 'dz_ci_no_such_hashes.txt'); Why = 'not found' }, @{ F = $cm; Why = 'holds no valid SHA256 rows' })) {
            Remove-Item -LiteralPath $gm -Force -EA SilentlyContinue
            $o = (.\tools\ioc_hash_check.ps1 -IocFile $case.F) -join "`n"
            Write-Host $o
            if ($o -notmatch ('(?m)^\[WARNING\] File hash IOC match NOT performed -- .*' + [regex]::Escape($case.Why))) { throw ("a hash list that {0} did not print the NOT-performed line" -f $case.Why) }
            if (-not (Test-Path -LiteralPath $gm)) { throw ("a hash list that {0} wrote no gap marker -- the gap reaches no ledger row" -f $case.Why) }
          }
          Remove-Item -LiteralPath $gm, $cm -Force -EA SilentlyContinue
          Write-Host "ioc_hash_check OK (shipped list: no gap; missing and comment-only lists: NOT performed + gap marker)"
          exit 0

      # THE [CRITICAL]-LINE CENSUS, AND A PRINTED COMMAND, WITH AN APOSTROPHE.
      # The census was a for /f backtick command beginning with "%PWSH%", the
      # shape cmd /c mangles (it strips the outer quotes), so it never produced
      # a number and the ledger-divergence alarm it feeds could not fire. The
      # census lines are taken from the bat and run by cmd against a report in
      # a folder named with an apostrophe and a space, holding two [CRITICAL]
      # lines; then the OLD form is run the same way on a plain path: measured,
      # not argued. And the printed 18e Command: line, echoed by cmd with an
      # apostrophe in IOCDIR, must parse and run as PowerShell (cmd doubles the
      # apostrophe), where the undoubled form does not parse.
      - name: "Census and a printed Command: line under an apostrophe path (the old census form counts nothing)"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pw = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $dir = "C:\dz ci census o'brien"
          $plain = 'C:\dz_ci_census_plain'
          foreach ($d in $dir, $plain) { New-Item -ItemType Directory -Path $d -Force | Out-Null }
          $sample = @('[CRITICAL] one', '  [CRITICAL] indented, not counted', '[INFO] x', '[CRITICAL] two')
          $rep = Join-Path $dir 'SecurityReport_ci.txt'; Set-Content -LiteralPath $rep -Value $sample -Encoding ASCII
          $rep2 = Join-Path $plain 'SecurityReport_ci.txt'; Set-Content -LiteralPath $rep2 -Value $sample -Encoding ASCII
          $bat = [IO.File]::ReadAllLines((Resolve-Path .\doze_sec.bat))
          $a = [array]::IndexOf($bat, 'set "CRIT_READ=0"')
          $b = [array]::IndexOf($bat, 'if "%CRIT_READ%"=="0" set "CRIT_COUNT=0"')
          if ($a -lt 0 -or $b -lt $a) { throw 'the census lines were not found in doze_sec.bat -- this step no longer looks at the code it was written for' }
          function Invoke-Cmd([string[]]$Lines, [string]$Name) {
            $f = Join-Path $env:TEMP ($Name + '.cmd')
            [IO.File]::WriteAllLines($f, $Lines, [Text.Encoding]::ASCII)
            $ErrorActionPreference = 'Continue'
            $o = (& cmd.exe /d /c ('"' + $f + '"') 2>&1 | ForEach-Object { "$_" }) -join "`n"
            $ErrorActionPreference = 'Stop'
            Remove-Item -LiteralPath $f -Force -EA SilentlyContinue
            return $o
          }
          $head = @('@echo off', 'setlocal enabledelayedexpansion', ('set "PWSH={0}"' -f $pw), 'set "CRIT_COUNT=0"')
          $o1 = Invoke-Cmd ($head + @(('set "REPORT={0}"' -f $rep)) + $bat[$a..$b] + @('echo CC=!CRIT_COUNT! CR=!CRIT_READ!')) 'dz_ci_census_new'
          Write-Host "fixed census, report under an apostrophe and a space: $o1"
          if ($o1 -notmatch 'CC=2 CR=1') { throw 'the fixed census did not count the two [CRITICAL] lines under a path holding an apostrophe' }
          $oldLine = 'for /f "usebackq" %%c in (`"%PWSH%" -NoProfile -Command "@(Select-String -LiteralPath ''%REPORT%'' -Pattern ''\A\[CRITICAL\]'').Count" 2^>nul`) do set "CRIT_COUNT=%%c"'
          $o2 = Invoke-Cmd ($head + @(('set "REPORT={0}"' -f $rep2), $oldLine, 'echo CC=!CRIT_COUNT!')) 'dz_ci_census_old'
          Write-Host "old census form, plain path: $o2"
          if ($o2 -match 'CC=2') { throw 'the OLD census form counted the lines after all -- the claim that it never produced a number is wrong; correct the CHANGELOG and CLAUDE.md' }
          # The printed 18e Command: line, as cmd writes it into the report.
          $line = @($bat | Where-Object { $_ -like "echo  Command: powershell -Command *ioc_scheduled_tasks.txt*" })[0]
          if (-not $line) { throw 'the 18e Command: line was not found' }
          $ioc = Join-Path $dir 'ThreatLists'
          New-Item -ItemType Directory -Path $ioc -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $ioc 'ioc_scheduled_tasks.txt') -Value @('# CI', 'dz_ci_no_such_task_9f3') -Encoding ASCII
          $out = Join-Path $env:TEMP 'dz_ci_cmdline.txt'
          foreach ($case in @(@{ L = $line; Want = 'parses' }, @{ L = $line.Replace("%IOCDIR:'=''%", '%IOCDIR%'); Want = 'fails' })) {
            Remove-Item -LiteralPath $out -Force -EA SilentlyContinue
            [void](Invoke-Cmd @('@echo off', 'setlocal enabledelayedexpansion', ('set "IOCDIR={0}"' -f $ioc), ('set "REPORT={0}"' -f $out), $case.L) 'dz_ci_cmdline')
            $printed = [IO.File]::ReadAllText($out).Trim()
            $pm = [regex]::Match($printed, '^Command:\s*powershell\s+-Command\s+"(.*)"\s*$')
            if (-not $pm.Success) { throw ("cmd did not print a Command: line: {0}" -f $printed) }
            $errs = $null; $toks = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($pm.Groups[1].Value, [ref]$toks, [ref]$errs)
            $parses = (-not $errs -or $errs.Count -eq 0)
            Write-Host ("{0}: {1}" -f $case.Want, $printed)
            if ($case.Want -eq 'parses' -and -not $parses) { throw ("the printed 18e command does not parse with an apostrophe in the path: {0}" -f $errs[0].Message) }
            if ($case.Want -eq 'fails' -and $parses) { throw 'the undoubled form parsed too -- this test cannot tell the fix from the bug' }
            if ($case.Want -eq 'parses') {
              $ErrorActionPreference = 'Continue'
              $r = (& $pw -NoProfile -Command $pm.Groups[1].Value 2>&1 | ForEach-Object { "$_" }) -join "`n"
              $rc = $LASTEXITCODE
              $ErrorActionPreference = 'Stop'
              if ($rc -ne 0 -or $r -match 'Exception|Error|not recognized') { throw ("the printed 18e command parsed but did not run: {0}" -f $r) }
            }
          }
          Remove-Item -LiteralPath $dir, $plain -Recurse -Force -EA SilentlyContinue
          Remove-Item -LiteralPath $out -Force -EA SilentlyContinue
          Write-Host 'census: 2 counted under an apostrophe path, old form counted nothing; the printed 18e command parses and runs, the undoubled one does not parse'
          $global:LASTEXITCODE = 0
          exit 0

      # Sections 18b-18e and 18h are PowerShell the bats echo into a temp file,
      # so their gap branches cannot be reached on a healthy runner by running
      # the audit. tests\section18_gaps.ps1 renders each block as cmd writes it
      # and runs it under Windows PowerShell 5.1: with no list it must say NOT
      # performed and write its gap marker; with the shipped lists no gap may
      # appear (every listing works here). Then a planted named pipe and planted
      # scheduled tasks must be matched -- 18e moved from schtasks' English CSV
      # columns to Get-ScheduledTask, so it is matched by task NAME and by an
      # action argument past the ~261 characters schtasks CSV kept, and a twin
      # task holding no list entry must stay out. CI only. Touches: an
      # in-process named pipe dz_ci_s18_pipe_1; task:\dz_ci_s18_tasknm_A,
      # task:\dz_ci_s18_plain_B, task:\dz_ci_s18_plain_C (removed in finally).
      - name: "Section 18 matchers on 5.1: NOT performed with no list, no gap with the shipped lists, a planted pipe and task are matched"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # -SelfTest here too: this checkout is CRLF, and the mutations are
          # written with LF (the self-test normalises; the Linux job cannot show it).
          foreach ($a in @(@('-SelfTest'), @('-Mode', 'Missing'), @('-Mode', 'Shipped'))) {
            $ErrorActionPreference = 'Continue'
            $o = (powershell -NoProfile -ExecutionPolicy Bypass -File tests\section18_gaps.ps1 @a 2>&1 | ForEach-Object { "$_" }) -join "`n"
            $rc = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            Write-Host $o
            if ($rc -ne 0) { throw "section18_gaps $($a -join ' ') failed on Windows PowerShell 5.1" }
            if ($a[0] -eq '-Mode' -and $o -notmatch 'Windows PowerShell 5\.1') { throw "section18_gaps $($a -join ' ') did not run its blocks under Windows PowerShell 5.1" }
          }
          $lists = Join-Path $env:TEMP ("dz_s18_lists_{0}" -f $PID)
          New-Item -ItemType Directory -Path $lists -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $lists 'ioc_named_pipes.txt') -Value @('# CI list', 'dz_ci_s18_pipe') -Encoding ASCII
          Set-Content -LiteralPath (Join-Path $lists 'ioc_scheduled_tasks.txt') -Value @('# CI list', 'dz_ci_s18_tasknm', 'dz_ci_s18_actarg') -Encoding ASCII
          $names = 'dz_ci_s18_tasknm_A', 'dz_ci_s18_plain_B', 'dz_ci_s18_plain_C'
          $pipe = $null
          try {
            $pipe = New-Object System.IO.Pipes.NamedPipeServerStream('dz_ci_s18_pipe_1')
            $trig = New-ScheduledTaskTrigger -Once -At (Get-Date).AddYears(1)
            Register-ScheduledTask -TaskName $names[0] -Trigger $trig -Action (New-ScheduledTaskAction -Execute 'cmd.exe' -Argument '/c rem nothing') -Force | Out-Null
            Register-ScheduledTask -TaskName $names[1] -Trigger $trig -Action (New-ScheduledTaskAction -Execute 'cmd.exe' -Argument ('/c rem ' + ('x' * 300) + ' dz_ci_s18_actarg')) -Force | Out-Null
            Register-ScheduledTask -TaskName $names[2] -Trigger $trig -Action (New-ScheduledTaskAction -Execute 'cmd.exe' -Argument '/c rem nothing') -Force | Out-Null
            $ErrorActionPreference = 'Continue'
            $o = (powershell -NoProfile -ExecutionPolicy Bypass -File tests\section18_gaps.ps1 -Mode Run -ListDir $lists -Sections '18b,18e' 2>&1 | ForEach-Object { "$_" }) -join "`n"
            $ErrorActionPreference = 'Stop'
            Write-Host $o
            if ($o -notmatch 'S18 18b hit=1 gap=0 done=1') { throw 'the planted named pipe dz_ci_s18_pipe_1 was not matched by 18b (or the block did not reach its verdict)' }
            if ($o -notmatch 'dz_ci_s18_pipe_1') { throw '18b matched but did not print the pipe it matched' }
            if ($o -notmatch 'S18 18e hit=1 gap=0 done=1') { throw 'no planted scheduled task was matched by 18e (or the block did not reach its verdict)' }
            if ($o -notmatch 'dz_ci_s18_tasknm_A') { throw '18e did not match a task by its NAME' }
            if ($o -notmatch 'dz_ci_s18_plain_B') { throw '18e did not match a task by an action argument 300 characters in (schtasks CSV cut it at about 261)' }
            if ($o -match 'dz_ci_s18_plain_C') { throw '18e listed the twin task, whose name and action hold no list entry' }
          } finally {
            if ($pipe) { $pipe.Dispose() }
            foreach ($n in $names) { Unregister-ScheduledTask -TaskName $n -Confirm:$false -EA SilentlyContinue }
            Remove-Item -LiteralPath $lists -Recurse -Force -EA SilentlyContinue
          }
          Write-Host 'Section 18 on 5.1: gaps raised with no list, none with the shipped lists; the planted pipe and tasks matched, the twin not'
          $global:LASTEXITCODE = 0
          exit 0

      - name: startup_eval.ps1 (Startup folder + AppCert DLL evaluation)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $md = Join-Path $env:TEMP ("dz_se_ci_{0}" -f $PID)
          New-Item -ItemType Directory -Path $md -Force | Out-Null
          # Clean runner: must produce no CRITICAL and write no marker.
          # NB: -match/-notmatch on an ARRAY are FILTERS, not booleans. Join to
          # a single string before testing, or `-notmatch` returns every
          # non-matching line (truthy) and the check always fires.
          $out = (.\tools\startup_eval.ps1 -MarkerDir $md) -join "`n"
          Write-Host $out
          if ($out -match '\[CRITICAL\]') { throw "startup_eval flagged CRITICAL on a clean runner (false positive)" }
          if (Test-Path (Join-Path $md 'dz_startup_folder.txt')) {
            throw ("startup marker written on a clean runner: {0}" -f (Get-Content (Join-Path $md 'dz_startup_folder.txt')))
          }
          if (Test-Path (Join-Path $md 'dz_appcert.txt')) {
            throw ("appcert marker written on a clean runner: {0}" -f (Get-Content (Join-Path $md 'dz_appcert.txt')))
          }
          # Plant an AppCert DLL pointing at a missing staging-path file: must
          # be CRITICAL and must write the marker.
          $ac = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\AppCertDlls'
          if (-not (Test-Path $ac)) { New-Item -Path $ac -Force | Out-Null }
          Set-ItemProperty -Path $ac -Name 'dz_ci_probe' -Value 'C:\Windows\Temp\dz_ci_probe.dll' -Force
          try {
            $out2 = (.\tools\startup_eval.ps1 -MarkerDir $md) -join "`n"
            if ($out2 -notmatch 'dz_ci_probe') { throw "planted AppCert DLL not reported" }
            $m = Join-Path $md 'dz_appcert.txt'
            if (-not (Test-Path $m)) { throw "planted AppCert DLL wrote no marker" }
            if ((Get-Content $m).Trim() -ne 'CRITICAL') { throw ("expected CRITICAL marker, got {0}" -f (Get-Content $m)) }
          } finally {
            Remove-ItemProperty -Path $ac -Name 'dz_ci_probe' -EA SilentlyContinue
            Remove-Item $md -Recurse -Force -EA SilentlyContinue
          }
          Write-Host "startup_eval.ps1 OK"
          exit 0

      - name: ledger.ps1 (finding-record append / summarize / section contract)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $L = Join-Path $env:TEMP ("dz_ledger_ci_{0}.txt" -f $PID)
          Remove-Item $L -Force -EA SilentlyContinue
          .\tools\ledger.ps1 -Mode Append -Path $L -Severity WARNING  -Section 9  -Code T1562.001 -Message 'ASR rules not in Block mode'
          .\tools\ledger.ps1 -Mode Append -Path $L -Severity CRITICAL -Section 13 -Message 'IFEO hijack on sethc.exe'
          .\tools\ledger.ps1 -Mode Append -Path $L -Severity WARNING  -Section 9  -Message 'second Section 9 finding'
          $sum = .\tools\ledger.ps1 -Mode Summarize -Path $L
          # NB: loop var must not be $l -- PowerShell variable names are
          # case-insensitive, so $l would clobber the ledger path $L.
          $h = @{}; foreach ($line in $sum) { if ($line -match '^(\w+)=(.+)$') { $h[$Matches[1]] = $Matches[2] } }
          if ($h.TOTAL    -ne '3')        { throw "TOTAL expected 3, got $($h.TOTAL)" }
          if ($h.CRITICAL -ne '1')        { throw "CRITICAL expected 1, got $($h.CRITICAL)" }
          if ($h.WARNING  -ne '2')        { throw "WARNING expected 2, got $($h.WARNING)" }
          if ($h.MAXSEV   -ne 'CRITICAL') { throw "MAXSEV expected CRITICAL, got $($h.MAXSEV)" }
          $s9 = "$(.\tools\ledger.ps1 -Mode Section -Path $L -Section 9)".Trim()
          if ($s9 -ne '2') { throw "Section 9 count expected 2, got $s9" }
          $s99 = "$(.\tools\ledger.ps1 -Mode Section -Path $L -Section 99)".Trim()
          if ($s99 -ne '0') { throw "Section 99 count expected 0, got $s99" }
          # Separator/newline injection in a message must not corrupt the record.
          .\tools\ledger.ps1 -Mode Append -Path $L -Severity WARNING -Section 8 -Message 'pipe|inside|the message'
          $s8 = "$(.\tools\ledger.ps1 -Mode Section -Path $L -Section 8)".Trim()
          if ($s8 -ne '1') { throw "Section 8 count expected 1 after pipe-injection, got $s8" }
          Remove-Item $L -Force -EA SilentlyContinue
          Write-Host "ledger.ps1 OK"
          exit 0

      - name: persistence_extra.ps1 (netsh / print / BITS / profile / time-provider)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $md = Join-Path $env:TEMP ("dz_pe_ci_{0}" -f $PID)
          New-Item -ItemType Directory -Path $md -Force | Out-Null
          $markers = @('dz_netsh.txt','dz_printproc.txt','dz_portmon.txt','dz_bits.txt','dz_bitsupload.txt','dz_bitsupload_gap.txt','dz_psprofile.txt','dz_timeprov.txt')
          # Clean runner: a stock Windows image registers netsh helpers, print
          # processors, port monitors and time providers, and they are all
          # Microsoft-signed -- so any CRITICAL here is a false positive in the
          # signature gate, which is exactly the risk this check exists to catch.
          # NB: -match on an ARRAY is a FILTER, not a boolean -- join first.
          $out = (.\tools\persistence_extra.ps1 -MarkerDir $md) -join "`n"
          Write-Host $out
          if ($out -match '\[CRITICAL\]') { throw "persistence_extra flagged CRITICAL on a clean runner (false positive)" }
          foreach ($m in $markers) {
            if (Test-Path (Join-Path $md $m)) { throw ("{0} written on a clean runner: {1}" -f $m, (Get-Content (Join-Path $md $m))) }
          }
          # The detection harness plants the time-provider and PowerShell-profile
          # vectors end-to-end (proving the bat marker wiring). The three print/
          # netsh vectors are planted HERE instead: a bogus netsh helper makes
          # netsh.exe emit load errors, which would contaminate the firewall and
          # portproxy cases in the full-audit harness. Isolated per-vector plants
          # keep that blast radius inside this step.
          $netsh = 'HKLM:\SOFTWARE\Microsoft\Netsh'
          $mon   = 'HKLM:\SYSTEM\CurrentControlSet\Control\Print\Monitors\dz_ci_probe'
          $pproc = 'HKLM:\SYSTEM\CurrentControlSet\Control\Print\Environments\Windows x64\Print Processors\dz_ci_probe'
          try {
            Set-ItemProperty -Path $netsh -Name 'dz_ci_probe' -Value 'dz_ci_probe_missing.dll' -Force
            New-Item -Path $mon -Force | Out-Null
            Set-ItemProperty -Path $mon -Name 'Driver' -Value 'dz_ci_probe_missing.dll' -Force
            New-Item -Path $pproc -Force | Out-Null
            Set-ItemProperty -Path $pproc -Name 'Driver' -Value 'dz_ci_probe_missing.dll' -Force
            $out2 = (.\tools\persistence_extra.ps1 -MarkerDir $md) -join "`n"
            Write-Host $out2
            foreach ($pair in @(
              @{ Rx = "Netsh helper 'dz_ci_probe'";    Marker = 'dz_netsh.txt' },
              @{ Rx = "Port monitor 'dz_ci_probe'";    Marker = 'dz_portmon.txt' },
              @{ Rx = "Print processor 'dz_ci_probe'"; Marker = 'dz_printproc.txt' }
            )) {
              if ($out2 -notmatch [regex]::Escape($pair.Rx)) { throw ("planted vector not reported: {0}" -f $pair.Rx) }
              $mp = Join-Path $md $pair.Marker
              if (-not (Test-Path $mp)) { throw ("planted vector wrote no marker: {0}" -f $pair.Marker) }
              if ((Get-Content $mp).Trim() -ne 'CRITICAL') { throw ("{0}: expected CRITICAL, got {1}" -f $pair.Marker, (Get-Content $mp)) }
            }

            # A BRACKETED KEY NAME MUST NOT MAKE AN ENTRY DISAPPEAR. The value
            # reads used -Path, which treats the attacker-controlled subkey name
            # as a WILDCARD -- so a port monitor called "Std [TCP] Mon" matched
            # nothing, -EA SilentlyContinue hid the error, the entry was dropped
            # without being counted, and the section still reported every
            # registered monitor as validly Microsoft-signed. spoolsv loads port
            # monitors as SYSTEM at boot, so this is a real evasion.
            $wild = 'HKLM:\SYSTEM\CurrentControlSet\Control\Print\Monitors\dz_ci [TCP] probe'
            New-Item -Path $wild -Force | Out-Null
            Set-ItemProperty -LiteralPath $wild -Name 'Driver' -Value 'dz_ci_probe_missing.dll' -Force
            $md4 = Join-Path $md 'wild'
            New-Item -ItemType Directory -Path $md4 -Force | Out-Null
            $out3 = (.\tools\persistence_extra.ps1 -MarkerDir $md4) -join "`n"
            Write-Host ($out3 -split "`n" | Where-Object { $_ -match 'dz_ci \[TCP\] probe|unreadable driver value|port monitor' })
            if ($out3 -notmatch 'dz_ci \[TCP\] probe') { throw 'a port monitor with brackets in its key name vanished from the scan' }
            $mp4 = Join-Path $md4 'dz_portmon.txt'
            if (-not (Test-Path $mp4)) { throw 'bracketed port monitor wrote no marker -- it was silently skipped' }
            Remove-Item -LiteralPath $wild -Recurse -Force -EA SilentlyContinue
          } finally {
            Remove-Item -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\Print\Monitors\dz_ci [TCP] probe' -Recurse -Force -EA SilentlyContinue
            Remove-ItemProperty -Path $netsh -Name 'dz_ci_probe' -EA SilentlyContinue
            Remove-Item -LiteralPath $mon   -Recurse -Force -EA SilentlyContinue
            Remove-Item -LiteralPath $pproc -Recurse -Force -EA SilentlyContinue
            Remove-Item $md -Recurse -Force -EA SilentlyContinue
          }
          Write-Host "persistence_extra.ps1 OK (incl. bracketed-key-name evasion)"
          exit 0

