      - name: defender_core_check.ps1 -SelfTest + live (passive mode is INFO, not a finding; the runner's real state graded)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $st = (.\tools\defender_core_check.ps1 -SelfTest) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Host $st; throw 'defender_core_check.ps1 -SelfTest failed' }
          $n = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($n -lt 16) { throw "defender_core_check self-test ran only $n case(s)" }
          foreach ($must in 'Passive Mode with real-time OFF: INFO', 'EMPTY mode with real-time OFF is not passive', 'passive mode does not excuse an explicit DisableRealtimeMonitoring') {
            if ($st -notmatch [regex]::Escape($must)) { throw ("defender_core_check self-test no longer covers: {0}" -f $must) }
          }
          Write-Host "defender_core_check -SelfTest OK ($n cases)"
          $md = Join-Path $env:TEMP ("dz_dc_ci_{0}" -f $PID)
          New-Item -ItemType Directory -Path $md -Force | Out-Null
          try {
            $out = (.\tools\defender_core_check.ps1 -MarkerDir $md) -join "`n"
            Write-Host $out
            if (-not $out) { throw 'defender_core_check produced no output -- nothing was graded' }
            if ($out -match 'null-valued expression|InvalidOperation|CommandNotFoundException|ParameterBindingException') { throw 'defender_core_check wrote PowerShell errors into its own output' }
            # The marker must agree with the highest tag printed (a finding that is
            # printed but not raised is the defect class this repo fears most).
            $top = 'OK'
            if ($out -match '(?m)^\[WARNING\]') { $top = 'WARNING' }
            if ($out -match '(?m)^\[CRITICAL\]') { $top = 'CRITICAL' }
            $mk = Join-Path $md 'dz_defcore.txt'
            $mv = if (Test-Path $mk) { (Get-Content $mk).Trim() } else { 'OK' }
            if ($mv -ne $top) { throw ("marker says '{0}' but the highest printed tag is '{1}'" -f $mv, $top) }
            $sf = Join-Path $md 'dz_defcore_state.txt'
            if (-not (Test-Path $sf)) { throw 'no state file for the dashboard tile' }
            $state = (Get-Content $sf).Trim()
            Write-Host ("state line: {0}" -f $state)
            if ($state -notmatch '^[A-Za-z ]+\|[01]\|[01]\|[01]\|-?\d+$') { throw ("state line is not mode|realtime|graded|tamper|sigage: '{0}'" -f $state) }
            $f = $state.Split('|')
            if ($f[2] -ne '1') { throw 'Defender status could not be queried on the runner -- the live half graded nothing' }
            # Consistency between the state line and the printed verdict.
            if ($f[1] -eq '0' -and $f[0] -match 'Normal' -and $out -notmatch '\[CRITICAL\] Defender real-time protection is OFF') { throw 'state says real-time off in Normal mode but no CRITICAL was printed' }
            if ($f[1] -eq '1' -and $out -match '\[CRITICAL\] Defender real-time protection is OFF') { throw 'state says real-time on but the CRITICAL was printed' }
            # The tamper and signature-age tiles now read these two fields too.
            if ($f[3] -eq '0' -and $out -notmatch '\[WARNING\] Tamper Protection is OFF') { throw 'state says tamper protection off but no WARNING was printed' }
            if ($f[3] -eq '1' -and $out -match '\[WARNING\] Tamper Protection is OFF') { throw 'state says tamper protection on but the WARNING was printed' }
            if ([int]$f[4] -gt 7 -and $out -notmatch '\[WARNING\] Defender signatures are \d+ day') { throw 'state says signatures older than 7 days but no WARNING was printed' }
            if ([int]$f[4] -ge 0 -and [int]$f[4] -le 7 -and $out -match '\[WARNING\] Defender signatures are') { throw 'state says signatures current but the age WARNING was printed' }
          } finally { Remove-Item $md -Recurse -Force -EA SilentlyContinue }
          Write-Host 'defender_core_check.ps1 OK'
          exit 0

      # THE EXPERIMENT (owner's request, 2026-09-27). Microsoft documents the
      # ForceDefenderPassiveMode policy value for Server SKUs -- and windows-latest
      # is a Server SKU -- but also states that "Microsoft Defender Antivirus can
      # run in passive mode only when the device is onboarded to Microsoft
      # Defender for Endpoint" (learn.microsoft.com/defender-endpoint/edr-block-
      # mode-faqs). A runner is not onboarded, so the expected outcome is NO flip.
      # The step sets the value, reads AMRunningMode before and after, runs the
      # tool with the value in place, and DECLARES the outcome either way: a
      # flip promotes the corpus entry to a plant (and is asserted here); no
      # flip is a declared [ SKIP ] with the documented reason, never a vacuous
      # pass. WinDefend / MsMpEng are never stopped or modified (Microsoft:
      # "don't disable, stop, or modify associated services"). Touches:
      # registry:HKLM\SOFTWARE\Policies\Microsoft\Windows Advanced Threat
      # Protection\ForceDefenderPassiveMode -- restored or removed in finally.
      - name: ForceDefenderPassiveMode experiment -- does the policy flip AMRunningMode on an un-onboarded Server runner?
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $k = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Advanced Threat Protection'
          $hadKey = Test-Path -LiteralPath $k
          $prior = $null
          if ($hadKey) { $prior = (Get-ItemProperty -LiteralPath $k -Name ForceDefenderPassiveMode -EA SilentlyContinue).ForceDefenderPassiveMode }
          $st0 = $null; try { $st0 = Get-MpComputerStatus -EA Stop } catch {}
          $before = if ($st0) { [string]$st0.AMRunningMode } else { '<Get-MpComputerStatus failed>' }
          $svc0 = if ($st0) { [string]$st0.AMServiceEnabled } else { '?' }
          Write-Host ("before: AMRunningMode='{0}' AMServiceEnabled={1} (policy value present: {2}, prior value: {3})" -f $before, $svc0, ($null -ne $prior), $(if ($null -ne $prior) { [string]$prior } else { '<none>' }))
          $md = Join-Path $env:TEMP ("dz_dcx_ci_{0}" -f $PID)
          New-Item -ItemType Directory -Path $md -Force | Out-Null
          try {
            if (-not $hadKey) { New-Item -Path $k -Force | Out-Null }
            Set-ItemProperty -LiteralPath $k -Name ForceDefenderPassiveMode -Value 1 -Type DWord -Force
            Start-Sleep -Seconds 10
            $st1 = $null; try { $st1 = Get-MpComputerStatus -EA Stop } catch {}
            $after = if ($st1) { [string]$st1.AMRunningMode } else { '<Get-MpComputerStatus failed>' }
            $svc1 = if ($st1) { [string]$st1.AMServiceEnabled } else { '?' }
            Write-Host ("after : AMRunningMode='{0}' AMServiceEnabled={1}" -f $after, $svc1)
            if ($svc0 -ne $svc1) { throw ("AMServiceEnabled changed from {0} to {1} -- the policy value touched more than the mode" -f $svc0, $svc1) }
            $out = (.\tools\defender_core_check.ps1 -MarkerDir $md) -join "`n"
            Write-Host ($out -split "`n" | Where-Object { $_ -match 'another antivirus|real-time protection|\[SKIPPED\]|\[OK\]' })
            $flipped = ($st1 -and $after -ne '' -and $after -notmatch 'Normal')
            if ($flipped) {
              if ($out -notmatch '\[INFO\] Defender is running in .* -- another antivirus product is in control') { throw 'passive mode engaged but the tool did not print the INFO line (corpus: defender-passive-mode)' }
              if ($out -match '\[CRITICAL\] Defender real-time protection is OFF') { throw 'passive mode engaged but the real-time CRITICAL still fired' }
              $mk = Join-Path $md 'dz_defcore.txt'
              if ((Test-Path $mk) -and (Get-Content $mk).Trim() -eq 'CRITICAL') { throw 'passive mode engaged but the marker reads CRITICAL' }
              Write-Host ("PROMOTE: passive mode engaged on this runner (AMRunningMode='{0}') -- move [defender-passive-mode] to a ci: plant proof" -f $after)
            } else {
              Write-Host ("[ SKIP ] passive mode did not engage (before='{0}', after='{1}') -- Microsoft: passive mode requires Defender for Endpoint onboarding; the corpus entry keeps its field: reason and its self-test proof" -f $before, $after)
            }
          } finally {
            if ($hadKey) {
              if ($null -ne $prior) { Set-ItemProperty -LiteralPath $k -Name ForceDefenderPassiveMode -Value $prior -Type DWord -Force } else { Remove-ItemProperty -LiteralPath $k -Name ForceDefenderPassiveMode -EA SilentlyContinue }
            } else { Remove-Item -LiteralPath $k -Recurse -Force -EA SilentlyContinue }
            Remove-Item $md -Recurse -Force -EA SilentlyContinue
          }
          exit 0

      # Section 9's exclusion check, extracted from three inline blocks. The
      # dashboard tile used to call Get-MpPreference AGAIN (a second measurement),
      # printed NOTHING when that query failed, and never showed extension
      # exclusions; it now reads this tool's state line. Both directions on the
      # real cmdlets: the runner's own state first, then a planted path exclusion.
      - name: defender_exclusions_check.ps1 -SelfTest + live (none is OK; a planted exclusion is WARNING and named; the state line carries the counts)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $st = (.\tools\defender_exclusions_check.ps1 -SelfTest) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Host $st; throw 'defender_exclusions_check.ps1 -SelfTest failed' }
          $n = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($n -lt 10) { throw "defender_exclusions_check self-test ran only $n case(s)" }
          foreach ($must in 'one path: WARNING naming T1562.001', 'Get-MpPreference failed: one [SKIPPED], not graded', 'an item that starts with a severity tag never starts a report line with one') {
            if ($st -notmatch [regex]::Escape($must)) { throw ("defender_exclusions_check self-test no longer covers: {0}" -f $must) }
          }
          Write-Host "defender_exclusions_check -SelfTest OK ($n cases)"
          # LIVE, both directions. Touches: defender:ExclusionPath C:\dz_ci_excl_dir
          # (removed in finally). The harness job plants the same kind of exclusion
          # on this image and has never skipped it, so a failed Add-MpPreference is a
          # FAILURE here, not a skip: a plant that might not plant is a step that
          # might pass vacuously.
          $md = Join-Path $env:TEMP ("dz_dx_ci_{0}" -f $PID)
          New-Item -ItemType Directory -Path $md -Force | Out-Null
          $plantDir = 'C:\dz_ci_excl_dir'
          $planted = $false
          $leftover = $false
          $okWord = @{ paths = 'path'; processes = 'process'; extensions = 'extension' }
          function Invoke-Live {
            param([string]$Label)
            Remove-Item (Join-Path $md 'dz_defexcl.txt') -Force -EA SilentlyContinue
            $out = (.\tools\defender_exclusions_check.ps1 -MarkerDir $md) -join "`n"
            Write-Host ("--- {0} ---" -f $Label); Write-Host $out
            if (-not $out) { throw ("{0}: defender_exclusions_check produced no output -- nothing was graded" -f $Label) }
            if ($out -match 'null-valued expression|InvalidOperation|CommandNotFoundException|ParameterBindingException') { throw ("{0}: the tool wrote PowerShell errors into its own output" -f $Label) }
            # The marker must agree with the highest tag printed.
            $top = 'OK'
            if ($out -match '(?m)^\[WARNING\]') { $top = 'WARNING' }
            if ($out -match '(?m)^\[CRITICAL\]') { $top = 'CRITICAL' }
            $mk = Join-Path $md 'dz_defexcl.txt'
            $mv = if (Test-Path $mk) { (Get-Content $mk).Trim() } else { 'OK' }
            if ($mv -ne $top) { throw ("{0}: marker says '{1}' but the highest printed tag is '{2}'" -f $Label, $mv, $top) }
            $sf = Join-Path $md 'dz_defexcl_state.txt'
            if (-not (Test-Path $sf)) { throw ("{0}: no state file for the dashboard tiles" -f $Label) }
            $state = (Get-Content $sf).Trim()
            Write-Host ("state line: {0}" -f $state)
            if ($state -notmatch '^[01]\|\d+\|\d+\|\d+$') { throw ("{0}: state line is not graded|paths|processes|extensions: '{1}'" -f $Label, $state) }
            $f = $state.Split('|')
            if ($f[0] -ne '1') { throw ("{0}: Get-MpPreference could not be queried on the runner -- the live half graded nothing" -f $Label) }
            # The counts must agree with the printed lines, kind by kind.
            $i = 1
            foreach ($kind in 'paths', 'processes', 'extensions') {
              $c = [int]$f[$i]; $i++
              $printed = [regex]::Match($out, ('(?m)^\[WARNING\] Exclusion ' + $kind + ' found \((\d+)\)'))
              if ($c -gt 0 -and (-not $printed.Success -or [int]$printed.Groups[1].Value -ne $c)) { throw ("{0}: state says {1} {2} but the printed WARNING line disagrees" -f $Label, $c, $kind) }
              if ($c -eq 0 -and $printed.Success) { throw ("{0}: state says no {1} but a WARNING for them was printed" -f $Label, $kind) }
              if ($c -eq 0 -and $out -notmatch ('(?m)^\[OK\] No ' + $okWord[$kind] + ' exclusions\.')) { throw ("{0}: no {1} and no [OK] line for them" -f $Label, $kind) }
            }
            return @{ Out = $out; Paths = [int]$f[1] }
          }
          try {
            $before = Invoke-Live 'before the plant'
            Add-MpPreference -ExclusionPath $plantDir -ErrorAction Stop
            $planted = $true
            $now = @((Get-MpPreference -ErrorAction Stop).ExclusionPath)
            if ($now -notcontains $plantDir) { throw 'Add-MpPreference returned but the exclusion is not listed -- the plant did not take' }
            $after = Invoke-Live 'after the plant'
            if ($after.Out -notmatch '(?m)^\[WARNING\] Exclusion paths found') { throw 'the planted path exclusion was not raised as a WARNING' }
            if ($after.Out -notmatch ('(?m)^    path: ' + [regex]::Escape($plantDir) + '$')) { throw 'the planted path is not named on its own "path:" line' }
            if ($after.Paths -ne ($before.Paths + 1)) { throw ("state path count went {0} -> {1}, expected +1" -f $before.Paths, $after.Paths) }
            $mv = (Get-Content (Join-Path $md 'dz_defexcl.txt')).Trim()
            if ($mv -ne 'WARNING') { throw ("marker after the plant reads '{0}', not WARNING" -f $mv) }
            Write-Host ("defender_exclusions_check.ps1 OK (before: {0} path exclusion(s); after the plant: {1}, raised WARNING, named)" -f $before.Paths, $after.Paths)
          } finally {
            if ($planted) { Remove-MpPreference -ExclusionPath $plantDir -ErrorAction SilentlyContinue }
            $left = @((Get-MpPreference -ErrorAction SilentlyContinue).ExclusionPath)
            if ($left -contains $plantDir) { $leftover = $true }
            Remove-Item $md -Recurse -Force -EA SilentlyContinue
          }
          if ($leftover) { throw 'the planted exclusion C:\dz_ci_excl_dir could not be removed -- clean it up before this runner is reused' }
          exit 0

      # LSA Protection, decided on the boot event first (WinInit Event 12) and
      # the registry second, measured once for Sections 4 and 12. A protected
      # LSASS cannot be planted on a runner without a reboot, so the ON-by-event
      # path is proven by the self-test and by an EXPERIMENT below that is
      # declared either way: can a synthetic WinInit Event 12 be written here?
      - name: pending_reboot_check.ps1 -SelfTest + live (the planted rename is listed by path; a queue written after boot is fresh; Fast Startup declared)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $st = (.\tools\pending_reboot_check.ps1 -SelfTest) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Host $st; throw 'pending_reboot_check.ps1 -SelfTest failed' }
          $n = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($n -lt 32) { throw "pending_reboot_check self-test ran only $n case(s)" }
          foreach ($must in 'written before the boot: STALE', 'a dangling last entry (odd length', 'a registry read failure is a declared gap', 'a single WARNING line even with three flags', '*1 marker on a delete: the path prints clean', 'a rename whose destination carries *1!') {
            if ($st -notmatch [regex]::Escape($must)) { throw ("pending_reboot_check self-test no longer covers: {0}" -f $must) }
          }
          Write-Host "pending_reboot_check -SelfTest OK ($n cases)"
          $md = Join-Path $env:TEMP ("dz_rb_ci_{0}" -f $PID)
          New-Item -ItemType Directory -Path $md -Force | Out-Null
          function Invoke-Rb {
            param([string]$Label)
            foreach ($x in 'dz_reboot.txt', 'dz_reboot_gap.txt', 'dz_reboot_state.txt') { Remove-Item (Join-Path $md $x) -Force -EA SilentlyContinue }
            $r = (.\tools\pending_reboot_check.ps1 -MarkerDir $md) -join "`n"
            Write-Host ("--- {0} ---" -f $Label); Write-Host $r
            if ($r -match 'null-valued expression|InvalidOperation|CommandNotFoundException|ParameterBindingException') { throw ("{0}: the tool wrote PowerShell errors" -f $Label) }
            if (Test-Path (Join-Path $md 'dz_reboot_gap.txt')) { throw ("{0}: a runner's reboot flags are readable; the tool declared a gap" -f $Label) }
            $sf = Join-Path $md 'dz_reboot_state.txt'
            if (-not (Test-Path $sf)) { throw ("{0}: no state file" -f $Label) }
            $state = (Get-Content $sf).Trim()
            Write-Host ("state: {0}" -f $state)
            if ($state -notmatch '^[01]\|(fresh|stale|mixed|unknown)\|\d+\|[01]\|[01]\|(0|1|unknown)$') { throw ("{0}: state line is not pending|age|ops|wu|cbs|faststartup: '{1}'" -f $Label, $state) }
            $top = 'OK'
            if ($r -match '(?m)^\[WARNING\]') { $top = 'WARNING' }
            $mk = Join-Path $md 'dz_reboot.txt'
            $mv = if (Test-Path $mk) { (Get-Content $mk).Trim() } else { 'OK' }
            if ($mv -ne $top) { throw ("{0}: marker says '{1}' but the highest printed tag is '{2}'" -f $Label, $mv, $top) }
            return @{ Text = $r; State = $state.Split('|') }
          }
          # Touches: registry:HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\PendingFileRenameOperations
          # (appended to, restored in finally; Session Manager would consume it at a
          # boot the ephemeral runner never has).
          $k = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager'
          $prior = (Get-ItemProperty -LiteralPath $k -Name PendingFileRenameOperations -EA SilentlyContinue).PendingFileRenameOperations
          try {
            $live = Invoke-Rb 'live'
            if ($live.State[0] -eq '0' -and $live.Text -notmatch '(?m)^\[OK\] No pending reboot detected\.') { throw 'nothing pending but no [OK] line' }
            # Two forms: the documented one, and the marker-prefixed form Windows'
            # own updaters write (`*1\??\...`, seen verbatim on the owner's laptop,
            # where it made every entry read "source missing").
            $planted = @('\??\C:\dz_ci_pending_rename.tmp', '', '*1\??\C:\dz_ci_pending_rename2.tmp', '')
            $val = if ($prior) { @($prior) + $planted } else { $planted }
            Set-ItemProperty -LiteralPath $k -Name PendingFileRenameOperations -Type MultiString -Value $val
            $p = Invoke-Rb 'planted'
            if ($p.Text -notmatch '(?m)^\[WARNING\] Reboot pending: PendingFileRenameOperations is set \(\d+ queued file operation\(s\)\)') { throw 'the planted rename did not produce the finding line' }
            if ($p.Text -notmatch '(?m)^    delete: C:\\dz_ci_pending_rename\.tmp \(source missing\)$') { throw 'the planted operation is not listed beneath the finding by path' }
            if ($p.Text -notmatch '(?m)^    delete: C:\\dz_ci_pending_rename2\.tmp \(source missing\)  \[marker \*1\]$') { throw 'the marker-prefixed entry was not listed with a clean path and its marker shown' }
            if ([int]$p.State[2] -lt 2) { throw ("the state line should count at least the two planted operations, counts {0}" -f $p.State[2]) }
            if ($p.State[0] -ne '1' -or $p.State[1] -ne 'fresh') { throw ("the plant postdates the runner's boot: expected state 1|fresh, got {0}|{1}" -f $p.State[0], $p.State[1]) }
            if ($p.Text -notmatch 'written AFTER the last boot: a Restart will run it') { throw 'the age line did not read AFTER the last boot' }
            if ([int]$p.State[2] -lt 1) { throw 'the state line counts no queued operation' }
            # The line order top_findings depends on: the first detail line directly
            # follows the finding line.
            $ls = $p.Text -split "`n"
            $wi = [array]::IndexOf($ls, ($ls | Where-Object { $_ -match '^\[WARNING\] Reboot pending:' } | Select-Object -First 1))
            if ($ls[$wi + 1] -notmatch '^    (delete|rename|flag): ') { throw ("the line after the finding is not a detail line: '{0}'" -f $ls[$wi + 1]) }
          } finally {
            if ($null -ne $prior) { Set-ItemProperty -LiteralPath $k -Name PendingFileRenameOperations -Type MultiString -Value @($prior) } else { Remove-ItemProperty -LiteralPath $k -Name PendingFileRenameOperations -EA SilentlyContinue }
            Remove-Item $md -Recurse -Force -EA SilentlyContinue
          }
          Write-Host 'pending_reboot_check.ps1 OK (planted rename listed by path; fresh; markers and state agree)'

      - name: lsa_protection_check.ps1 -SelfTest + live (WinInit Event 12 this boot or RunAsPPL decides; neither is OFF, declared) + Event 12 write experiment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $st = (.\tools\lsa_protection_check.ps1 -SelfTest) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Host $st; throw 'lsa_protection_check.ps1 -SelfTest failed' }
          $n = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($n -lt 12) { throw "lsa_protection_check self-test ran only $n case(s)" }
          foreach ($must in 'Event 12 this boot with NO RunAsPPL value: ON by event', 'RunAsPPL=2 with no Event 12 and a log that covers the boot: PENDING', 'registry unreadable, no Event 12, log rolled: UNKNOWN is a raised gap') {
            if ($st -notmatch [regex]::Escape($must)) { throw ("lsa_protection_check self-test no longer covers: {0}" -f $must) }
          }
          Write-Host "lsa_protection_check -SelfTest OK ($n cases)"
          $md = Join-Path $env:TEMP ("dz_lsa_ci_{0}" -f $PID)
          New-Item -ItemType Directory -Path $md -Force | Out-Null
          function Invoke-Lsa {
            param([string]$Label)
            foreach ($x in 'dz_lsa.txt', 'dz_lsa_state.txt', 'dz_lsa_lines.txt') { Remove-Item (Join-Path $md $x) -Force -EA SilentlyContinue }
            $m = (.\tools\lsa_protection_check.ps1 -Mode Measure -MarkerDir $md) -join "`n"
            if ($m -match 'null-valued expression|InvalidOperation|CommandNotFoundException|ParameterBindingException') { throw ("{0}: Measure wrote PowerShell errors: {1}" -f $Label, $m) }
            $sf = Join-Path $md 'dz_lsa_state.txt'
            if (-not (Test-Path $sf)) { throw ("{0}: Measure wrote no state file" -f $Label) }
            $state = (Get-Content $sf).Trim()
            Write-Host ("--- {0} --- state: {1}" -f $Label, $state)
            if ($state -notmatch '^(on|off|pending|unknown)\|(OK|WARNING)\|(event12|registry|none)\|[A-Za-z0-9:.@-]+\|[A-Za-z0-9:.@-]+$') { throw ("{0}: state line is not verdict|sev|source|registry|event: '{1}'" -f $Label, $state) }
            $r = (.\tools\lsa_protection_check.ps1 -Mode Report -MarkerDir $md) -join "`n"
            Write-Host $r
            if (-not $r) { throw ("{0}: Report printed nothing" -f $Label) }
            if ($r -match 'null-valued expression|InvalidOperation|CommandNotFoundException|ParameterBindingException') { throw ("{0}: Report wrote PowerShell errors" -f $Label) }
            $top = 'OK'
            if ($r -match '(?m)^\[WARNING\]') { $top = 'WARNING' }
            if ($r -match '(?m)^\[CRITICAL\]') { $top = 'CRITICAL' }
            $mk = Join-Path $md 'dz_lsa.txt'
            $mv = if (Test-Path $mk) { (Get-Content $mk).Trim() } else { 'OK' }
            if ($mv -ne $top) { throw ("{0}: marker says '{1}' but the highest printed tag is '{2}'" -f $Label, $mv, $top) }
            $f = $state.Split('|')
            if ($f[0] -eq 'unknown') { throw ("{0}: a runner's LSA Protection state is knowable; UNKNOWN means the measurement could not read its own registry or System log" -f $Label) }
            if ($f[0] -eq 'on' -and $r -notmatch '(?m)^\[OK\] LSASS') { throw ("{0}: state says on but no [OK] LSASS line was printed" -f $Label) }
            if (($f[0] -eq 'off' -or $f[0] -eq 'pending') -and $r -notmatch '(?m)^\[WARNING\]') { throw ("{0}: state says {1} but no WARNING was printed" -f $Label, $f[0]) }
            if ($r -notmatch 'WinInit Event 12') { throw ("{0}: the report line does not name the boot event it consulted" -f $Label) }
            return $f
          }
          $wrote = $false
          try {
            $f = Invoke-Lsa 'live'
            Write-Host ("runner verdict: {0} by {1} (registry {2}, event {3})" -f $f[0], $f[2], $f[3], $f[4])
            # THE OTHER CONSUMER agrees with the state file: module_inspect's lsass
            # line, when lsass is denied to this elevated token, must match.
            $mi = (.\tools\module_inspect.ps1 -MarkerDir $md -LsaStateFile (Join-Path $md 'dz_lsa_state.txt')) -join "`n"
            $ml = @($mi -split "`n" | Where-Object { $_ -match 'lsass module' })
            if ($ml.Count -eq 0) { Write-Host 'module_inspect: lsass modules were enumerable from this elevated token (no denial line) -- consistent with LSA Protection off' ; if ($f[0] -eq 'on') { throw 'LSA Protection reads on but an elevated module_inspect could read lsass modules' } }
            else {
              Write-Host ("module_inspect: " + $ml[0].Trim())
              if ($f[0] -eq 'on' -and $ml[0] -notmatch '^\[OK\]') { throw 'LSA Protection reads on but module_inspect did not explain the lsass denial by it' }
              if ($f[0] -ne 'on' -and $ml[0] -notmatch '^\[WARNING\]') { throw ("LSA Protection reads {0} but module_inspect did not raise the elevated lsass denial" -f $f[0]) }
            }
            # THE EXPERIMENT. Touches: eventlog:System (one synthetic WinInit 12 on an
            # ephemeral runner; CI only, never the harness a person runs).
            try {
              Write-EventLog -LogName System -Source 'Microsoft-Windows-Wininit' -EventId 12 -EntryType Information -Message 'LSASS.exe was started as a protected process with level: 4' -ErrorAction Stop
              $wrote = $true
            } catch {
              Write-Host ("[ SKIP ] a synthetic WinInit Event 12 cannot be written on this runner ({0}) -- the ON-by-event path stays proven by the self-test; the corpus entry keeps its field: reason" -f $_.Exception.Message)
            }
            if ($wrote) {
              Start-Sleep -Seconds 3
              $f2 = Invoke-Lsa 'after a synthetic WinInit Event 12'
              if ($f2[0] -ne 'on' -or $f2[2] -ne 'event12') { throw ("a WinInit Event 12 logged this boot did not read as ON by event (got {0} by {1})" -f $f2[0], $f2[2]) }
              Write-Host 'PROMOTE: a synthetic WinInit Event 12 lands on this runner and reads as ON by event -- move [lsa-protection-on-without-registry-value] to a ci: plant proof'
            }
          } finally { Remove-Item $md -Recurse -Force -EA SilentlyContinue }
          exit 0

      - name: report_safety.ps1 -SelfTest + live (Tier 0 preamble + coverage framing)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $st = (.\tools\report_safety.ps1 -SelfTest) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Host $st; throw 'report_safety.ps1 -SelfTest failed' }
          $nst = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($nst -lt 8) { throw "report_safety self-test ran only $nst case(s)" }
          Write-Host "report_safety -SelfTest OK ($nst cases)"
          # A report with no audit-policy result must never read OK.
          $rep0 = Join-Path $env:TEMP 'dz_ci_rs_none.txt'
          Set-Content $rep0 -Value @('[OK] something unrelated', '[DEFERRED - ADMIN REQUIRED] auditpol (audit-policy visibility) requires admin -- x')
          $cov0 = (.\tools\report_safety.ps1 -Mode Coverage -Report $rep0) -join "`n"
          if ($cov0 -notmatch 'Audit visibility\s+: NOT VERIFIED') { Write-Host $cov0; throw 'coverage block certified audit visibility with no audit-policy result' }
          Remove-Item $rep0 -Force -EA SilentlyContinue
          $pre = (.\tools\report_safety.ps1 -Mode Preamble) -join "`n"
          foreach ($needle in @('READ THIS FIRST','CLEAN" result does NOT prove','accessnow.org/help','stopstalkerware.org','PRESERVE EVIDENCE')) {
            if ($pre -notmatch [regex]::Escape($needle)) { throw ("preamble missing: {0}" -f $needle) }
          }
          # Coverage mode over a synthetic report with a SKIPPED line and an
          # auditing-off line must surface both in its confidence summary.
          $rp = Join-Path $env:TEMP ("dz_rs_ci_{0}.txt" -f $PID)
          # The OFF line in the shape audit_policy_check prints it (tagged): the
          # coverage block counts only that check's own lines, so an untagged
          # sentence elsewhere cannot certify or reduce audit visibility.
          Set-Content -LiteralPath $rp -Value @('[CRITICAL] x','[SKIPPED] y','[WARNING] Process Creation (4688) auditing is OFF [(not set)] -- a clean result may only mean these events are not being recorded (T1562.002).') -Encoding ASCII
          try {
            $cov = (.\tools\report_safety.ps1 -Mode Coverage -Report $rp) -join "`n"
            Write-Host $cov
            if ($cov -notmatch 'COVERAGE & CONFIDENCE') { throw 'coverage header missing' }
            if ($cov -notmatch 'Checks SKIPPED    : 1') { throw 'skipped count not surfaced' }
            if ($cov -notmatch 'Audit visibility  : REDUCED') { throw 'reduced audit visibility not surfaced' }
          } finally { Remove-Item $rp -Force -EA SilentlyContinue }
          # A RAISED GAP ([WARNING] ... NOT performed) is a check that could not
          # run AND a finding; the block must count it as a gap, not hide it
          # inside the warning total (vocabulary decision 2026-10-03).
          $rp3 = Join-Path $env:TEMP ("dz_rs_ci3_{0}.txt" -f $PID)
          Set-Content -LiteralPath $rp3 -Encoding ASCII -Value @('[WARNING] Print monitors key could not be read -- port-monitor check NOT performed.', '[WARNING] a real finding', '[SKIPPED] z')
          try {
            $cov3 = (.\tools\report_safety.ps1 -Mode Coverage -Report $rp3) -join "`n"
            Write-Host $cov3
            if ($cov3 -notmatch 'Gaps RAISED       : 1') { throw 'a raised gap was not counted as a gap' }
            if ($cov3 -notmatch '0 critical, 2 warning') { throw 'the raised gap must still count as a warning line' }
            if ($cov3 -notmatch 'Checks SKIPPED    : 1') { throw 'the unraised skip was lost' }
          } finally { Remove-Item $rp3 -Force -EA SilentlyContinue }

          # A MISSING HELPER IS A CHECK THAT DID NOT RUN. doze_sec.bat reports
          # those as "[INFO] tools\X.ps1 not found -- ... skipped", which the
          # [SKIPPED] test never matched -- so deleting stalkerware_check.ps1,
          # the one check that models an abusive partner, left this block
          # asserting "every attempted check produced a result".
          # And the counters were unanchored, so the TOP FINDINGS block
          # top_findings.ps1 prepends (which QUOTES each finding) counted every
          # finding a second time.
          $rp2 = Join-Path $env:TEMP ("dz_rs_ci2_{0}.txt" -f $PID)
          Set-Content -LiteralPath $rp2 -Encoding ASCII -Value @(
            '  TOP FINDINGS'
            '  1. [CRITICAL] quoted copy of the finding below'
            '  2. [WARNING] quoted copy of a warning'
            '[CRITICAL] the one real critical'
            '[INFO] tools\stalkerware_check.ps1 not found -- covert-monitoring check skipped.'
          )
          try {
            $cov2 = (.\tools\report_safety.ps1 -Mode Coverage -Report $rp2) -join "`n"
            Write-Host $cov2
            if ($cov2 -notmatch 'Checks SKIPPED    : 1') { throw 'a missing helper was not counted as a skipped check' }
            if ($cov2 -notmatch '1 critical, 0 warning') { throw ('quoted TOP FINDINGS lines inflated the counts: ' + $cov2) }
            if ($cov2 -match 'every attempted check produced a result') { throw 'coverage block certified full coverage while a helper was missing' }
          } finally { Remove-Item $rp2 -Force -EA SilentlyContinue }
          Write-Host "report_safety.ps1 OK (incl. missing-helper skips and anchored counting)"
          exit 0

