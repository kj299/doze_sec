      - name: run_lock.ps1 -SelfTest + real processes (busy while the holder lives, replaced once it is gone)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = (.\tools\run_lock.ps1 -SelfTest) -join "`n"
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw 'run_lock self-test failed' }
          # REAL processes on 5.1: the holder is a cmd.exe that runs the helper
          # and then waits, exactly as a bat does; the checker is another cmd.
          # Touches: file:%TEMP%\dz_ci_runlock\ (a lock and two state files)
          $d = Join-Path $env:TEMP 'dz_ci_runlock'
          New-Item -ItemType Directory -Path $d -Force | Out-Null
          $lock = Join-Path $d 'test.lock'; $st1 = Join-Path $d 'st1.txt'; $st2 = Join-Path $d 'st2.txt'; $st3 = Join-Path $d 'st3.txt'
          $tool = (Resolve-Path .\tools\run_lock.ps1).Path
          $holder = $null
          try {
            $holder = Start-Process cmd.exe -ArgumentList '/c', ("powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$tool`" -LockFiles `"$lock`" -StateFile `"$st1`" -Label dz_ci_holder & ping -n 120 127.0.0.1 >nul") -WindowStyle Hidden -PassThru
            $null = $holder.Handle
            # Poll the CONTENT: Set-Content can create the file before it writes.
            $deadline = (Get-Date).AddSeconds(60); $s1 = ''
            while ((Get-Date) -lt $deadline -and $s1 -notmatch '^[a-z-]+$') { Start-Sleep -Milliseconds 500; $s1 = [string](Get-Content $st1 -EA SilentlyContinue | Select-Object -First 1) }
            if ($s1 -ne 'acquired') { throw "the holder did not acquire the lock: '$s1'" }
            $lt = Get-Content $lock -Raw
            Write-Host ("lock: " + $lt)
            if ($lt -notmatch ('^pid=' + $holder.Id + ';')) { throw ("the lock names pid {0}, not the holder cmd {1} -- the parent was resolved wrongly" -f ([regex]::Match($lt, 'pid=(\d+)').Groups[1].Value), $holder.Id) }
            Start-Process cmd.exe -ArgumentList '/c', ("powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$tool`" -LockFiles `"$lock`" -StateFile `"$st2`" -Label dz_ci_checker") -WindowStyle Hidden -Wait
            $s2 = Get-Content $st2 | Select-Object -First 1
            if ($s2 -ne 'busy') { throw "a second invocation while the holder lives read '$s2', not busy" }
            if ((Get-Content $lock -Raw) -ne $lt) { throw 'the busy check changed the lock' }
            & taskkill.exe /PID $holder.Id /T /F 2>&1 | Out-Null
            Start-Sleep -Seconds 2
            Start-Process cmd.exe -ArgumentList '/c', ("powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$tool`" -LockFiles `"$lock`" -StateFile `"$st3`" -Label dz_ci_after") -WindowStyle Hidden -Wait
            $s3 = Get-Content $st3 | Select-Object -First 1
            if ($s3 -ne 'replaced-stale') { throw "after the holder died the next invocation read '$s3', not replaced-stale" }
            Write-Host 'PROVEN with real processes on 5.1: acquired, busy while the holder lives, replaced once it is gone'
          } finally {
            if ($holder -and -not $holder.HasExited) { & taskkill.exe /PID $holder.Id /T /F 2>&1 | Out-Null }
            Remove-Item -LiteralPath $d -Recurse -Force -EA SilentlyContinue
          }
          $global:LASTEXITCODE = 0
          exit 0

