          if (Test-Path (Join-Path $md3 'dz_hosts.txt')) { throw 'the missing-HOSTS gap wrote the FINDING marker -- its ledger row would claim non-standard entries' }
          if ($gp -match '(?m)^\[OK\]') { throw 'a gap-only run printed an all-clear line' }
