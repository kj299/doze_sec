      - name: psv2_check.ps1 (the AMSI-downgrade path must get a definite answer)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The two inline blocks this replaced never once produced a verdict on
          # a real Windows 11 machine -- five audits, two dates, elevated, all
          # "[SKIPPED] PSv2 state unavailable." PSv2 predates AMSI, so "is it
          # available" is a real security question and [SKIPPED] is not an
          # answer. A runner's PSv2 state IS knowable, so a skip here is a
          # FAILURE, not a tolerated unknown.
          $mk = Join-Path $env:TEMP 'dz_ci_psv2_hit.txt'
          $sf = Join-Path $env:TEMP 'dz_ci_psv2_state.txt'
          Remove-Item $mk, $sf -Force -EA SilentlyContinue
          $out = (.\tools\psv2_check.ps1 -MarkerFile $mk -StateFile $sf) -join "`n"
          Write-Host $out
          if ($out -match '\[SKIPPED\]') { throw 'psv2_check could not determine PSv2 state on a real runner -- all four methods were inconclusive' }
          if ($out -notmatch 'determined by:') { throw 'psv2_check did not name the method that answered' }
          $state = (Get-Content $sf -EA SilentlyContinue | Select-Object -First 1)
          if ($state -notin @('ENABLED','DISABLED')) { throw "state file says '$state' -- expected a definite ENABLED or DISABLED" }
          # The marker and the verdict must agree: a WARNING with no marker is a
          # finding that never reaches the ledger, which is this repo's oldest bug.
          $hit = Test-Path $mk
          if (($out -match '\[WARNING\]') -ne $hit) { throw "verdict and marker disagree: WARNING=$($out -match '\[WARNING\]') marker=$hit" }
          Remove-Item $mk, $sf -Force -EA SilentlyContinue
          .\tools\psv2_check.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'psv2_check self-test failed' }
          Write-Host "psv2_check.ps1 OK (state=$state)"

      - name: lint_report_echo.ps1 (every printed line reaches the report; every printed command runs)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Run on real Windows PowerShell 5.1 too, not just the Linux lint job:
          # this lint parses the PowerShell commands the report tells a reader to
          # paste, and 5.1 is the parser that reader will actually use.
          $out = (.\tools\lint_report_echo.ps1 -Root .) -join "`n"
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw 'lint_report_echo found lines that never reach the report, or printed commands that will not run' }
          # Guard the guard: a scanner that stopped finding lines would pass vacuously.
          $m = [regex]::Match($out, '(\d+) report echo line\(s\) scanned, (\d+) of them')
          if (-not $m.Success) { throw 'lint_report_echo did not report what it scanned -- the parser regressed' }
          if ([int]$m.Groups[1].Value -lt 400) { throw "lint_report_echo scanned only $($m.Groups[1].Value) echo lines -- a clean result means nothing" }
          if ([int]$m.Groups[2].Value -lt 100) { throw "lint_report_echo scanned only $($m.Groups[2].Value) Command: lines -- a clean result means nothing" }
          .\tools\lint_report_echo.ps1 -Root . -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'lint_report_echo self-test did not fail on the mutations' }
          Write-Host "lint_report_echo.ps1 OK"
          exit 0

      - name: lint_docs_drift.ps1 (documented claims match the code)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = (.\tools\lint_docs_drift.ps1 -Root .) -join "`n"
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw 'lint_docs_drift found documentation that does not match the code' }
          # Guard the guard: if the parsers stop finding switches or techniques,
          # every comparison becomes trivially true and the lint passes having
          # verified nothing.
          $m = [regex]::Match($out, 'Checked (\d+) documented claim')
          if (-not $m.Success -or [int]$m.Groups[1].Value -lt 10) { throw "docs lint checked only $($m.Groups[1].Value) claims -- a parser regressed, so a clean result means nothing" }
          Write-Host "lint_docs_drift.ps1 OK"
          exit 0

      - name: emulation_coverage.ps1 (adversary-emulation corpus; -Strict guards drift)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # -Strict fails if a CORE detection lost its plant, or if any Attack
          # tag / corpus line names a technique the audit no longer detects.
          # The backlog (detections not yet emulated) is allowed to be non-empty
          # and is printed, not gated -- pretending every technique is testable
          # would be dishonest; silent drift is what this prevents.
          $out = (.\tools\emulation_coverage.ps1 -SourceDir . -Strict) -join "`n"
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "emulation_coverage -Strict found corpus drift (a core detection lost its plant, or a stale tag) -- see WARNING lines above" }
          if ($out -notmatch 'ADVERSARY-EMULATION COVERAGE') { throw 'coverage header missing' }
          if ($out -notmatch 'Emulation corpus is consistent') { throw 'consistency line missing -- unexpected corpus drift' }
          if ($out -notmatch '(?m)^Emulation coverage of the testable surface: \d+%') { throw 'coverage percentage missing -- source scan or harness parse regressed' }
          # Prove the CORE invariant is not vacuous. Every core check is a loop
          # over the parsed CORE set, so a corpus that yields zero CORE entries
          # makes the loop iterate nothing and the tool report "consistent".
          # Feed it a corpus with no CORE lines: -Strict must fail.
          $noCore = Join-Path $env:TEMP ("dz_nocore_{0}.txt" -f $PID)
          (Get-Content tests\emulation_corpus.txt) | Where-Object { $_ -notmatch '^CORE\|' } | Set-Content -LiteralPath $noCore -Encoding UTF8
          $vac = (.\tools\emulation_coverage.ps1 -SourceDir . -Corpus $noCore -Strict) -join "`n"
          if ($LASTEXITCODE -eq 0) { Write-Host $vac; throw 'emulation_coverage -Strict PASSED on a corpus with no CORE entries -- the core-detection invariant can go unchecked' }
          Remove-Item $noCore -Force -EA SilentlyContinue
          Write-Host "emulation_coverage.ps1 OK (incl. empty-CORE guard)"
          exit 0

      - name: boot_chain_check.ps1 (boot-chain config audit; must not false-CRITICAL a clean VM)
        shell: powershell
        run: |
          # The pure grading, on the engine this tool ships to. lint.yml runs
          # the same suite on pwsh for fast feedback; a 5.1-only divergence has
          # already cost this repo a silent false negative, so this is the
          # authoritative run. The live planted cases below are not replaced
          # by it -- they cover the registry and UEFI reads it cannot.
          $stOut = (.\tools\boot_chain_check.ps1 -SelfTest) -join "`n"
          Write-Host $stOut
          if ($LASTEXITCODE -ne 0) { throw 'boot_chain_check.ps1 -SelfTest failed' }
          $stOk = @($stOut -split "`n" | Where-Object { $_ -match '^\[OK\]' }).Count
          if ($stOk -lt 20) { throw "only $stOk [OK] line(s) from the boot_chain_check.ps1 self-test; cases have gone missing" }
          foreach ($needle in @(
              'an ordinary Windows 11 boot entry raises nothing',
              'recoveryenabled Yes is not read as a debugger',
              'legacy BIOS / a VM without UEFI variables is NOT a finding',
              'a null DeviceGuard reading is never reported as "not running"')) {
            if ($stOut -notmatch ('\[OK\]\s+' + [regex]::Escape($needle))) { throw "the boot_chain_check.ps1 self-test no longer covers: $needle" }
          }

          $ErrorActionPreference = 'Stop'
          $md = Join-Path $env:TEMP ("dz_bc_ci_{0}" -f $PID)
          New-Item -ItemType Directory -Path $md -Force | Out-Null
          try {
            # The runner is a VM: bcdedit works (nointegritychecks is No), while
            # the Secure Boot UEFI vars typically do not exist -> those sub-checks
            # must degrade to [SKIPPED], NOT crash or false-CRITICAL. A CRITICAL
            # here would mean the runner really has kernel integrity disabled OR
            # the bcdedit parse is wrong.
            $out = (.\tools\boot_chain_check.ps1 -MarkerDir $md) -join "`n"
            Write-Host $out
            if ($out -notmatch 'Boot-chain configuration audit') { throw 'boot-chain header missing' }
            if ($out -match '\[CRITICAL\]') { throw "boot_chain_check reported CRITICAL on a clean VM runner (bcdedit parse or gate bug)" }
            if (Test-Path (Join-Path $md 'dz_bootchain.txt')) {
              $mv = (Get-Content (Join-Path $md 'dz_bootchain.txt')).Trim()
              if ($mv -eq 'CRITICAL') { throw "boot_chain_check wrote a CRITICAL marker on a clean VM runner" }
              Write-Host ("  note: clean-runner marker is {0} (acceptable -- e.g. no-bcdedit-output SKIPPED)" -f $mv)
            }
            # The nointegritychecks OK line must appear when bcdedit produced output,
            # proving the integrity-flag parse actually ran on this machine.
            if ($out -match 'nointegritychecks not set') { Write-Host "  integrity-flag parse ran and reported enforced" }
            elseif ($out -match 'bcdedit produced no output') { Write-Host "  bcdedit unavailable on this runner -- integrity parse skipped (honest)" }
            else { throw 'neither the integrity-OK line nor the bcdedit-skip line appeared -- parse path unclear' }
            # The memory-integrity arm asserted NOTHING until now. A runner's
            # real DeviceGuard state is unknown, so the assertable invariant is
            # that each of the two questions gets exactly one answer -- and that
            # a NULL property reports "could not be determined" rather than
            # silently claiming the hardening is off.
            $vbsLines  = @($out -split "`n" | Where-Object { $_ -match 'Virtualization-Based Security (is|state)' })
            $hvciLines = @($out -split "`n" | Where-Object { $_ -match 'HVCI / Memory Integrity (is|state)' })
            if ($out -match 'DeviceGuard status not available') {
              Write-Host '  DeviceGuard class unavailable on this runner -- honest, and the only line expected'
            } else {
              if ($vbsLines.Count -ne 1)  { throw "expected exactly one Virtualization-Based Security line, got $($vbsLines.Count)" }
              if ($hvciLines.Count -ne 1) { throw "expected exactly one HVCI / Memory Integrity line, got $($hvciLines.Count)" }
              Write-Host ("  VBS : {0}" -f $vbsLines[0].Trim())
              Write-Host ("  HVCI: {0}" -f $hvciLines[0].Trim())
            }
          } finally { Remove-Item $md -Recurse -Force -EA SilentlyContinue }
          Write-Host "boot_chain_check.ps1 OK"
          exit 0

      - name: service_signature_check.ps1 (real services + Authenticode; svchost must resolve)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = .\tools\service_signature_check.ps1
          $out | Select-Object -First 5 | Write-Host
          # The path parser must never misresolve well-known Windows services:
          # a "no-file" verdict for any svchost/system32 service means the
          # ImagePath normalization regressed (env vars, \SystemRoot\, unquoted
          # spaces). These services exist on every runner image.
          $bad = $out | Where-Object { $_ -match '\b(WinDefend|EventLog|Schedule|BITS|Dhcp|Dnscache)\b' -and $_ -match 'no-file' }
          if ($bad) { $bad | Write-Host; throw "service_signature_check misresolved a well-known service path (no-file)" }
          # -MarkerFile contract: the marker is written IFF at least one service
          # was flagged. Section 7 keys its FINDINGS raise on this file, so a
          # broken marker means a flagged malicious service reads CLEAN.
          $mk = Join-Path $env:TEMP 'dz_ci_svcgate.txt'
          Remove-Item $mk -Force -EA SilentlyContinue
          $out2 = .\tools\service_signature_check.ps1 -MarkerFile $mk
          $flagged = [bool](($out2 -join "`n") -match '\[WARNING\] \d+ service\(s\) failed')
          $marked  = Test-Path $mk
          Remove-Item $mk -Force -EA SilentlyContinue
          if ($flagged -ne $marked) { throw "service_signature_check -MarkerFile contract broken (flagged=$flagged marker=$marked)" }
          Write-Host "service_signature_check OK (marker contract: flagged=$flagged marker=$marked)"
          exit 0

      - name: persistence_eval.ps1 -SelfTest + live (Run-key + IFEO evaluation; clean host stays clean; planted IFEO raises)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The pure verdicts on real Windows PowerShell 5.1 (the engine this ships to).
          $st = (.\tools\persistence_eval.ps1 -SelfTest) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Host $st; throw 'persistence_eval.ps1 -SelfTest failed' }
          $nst = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($nst -lt 39) { throw "persistence_eval self-test ran only $nst case(s)" }
          if ($st -notmatch 'an unreadable IFEO subkey as a standard user is INFO') { throw 'persistence_eval self-test no longer covers the unreadable-IFEO-subkey case' }
          Write-Host "persistence_eval -SelfTest OK ($nst cases)"
          # On a clean runner (no planted autoruns/IFEO) it must print the OK
          # line and must NOT false-positive on any pre-existing autorun.
          $out = .\tools\persistence_eval.ps1 -MarkerFile "$env:TEMP\dz_ci_persist.txt"
          $out | Write-Host
          if (Test-Path "$env:TEMP\dz_ci_persist.txt") {
            throw "persistence_eval flagged a finding on a clean runner (false positive): $($out -join '; ')"
          }
          if (-not ($out -match 'No suspicious Run-key autoruns or IFEO')) {
            throw "persistence_eval did not emit the clean-state OK line"
          }
          Write-Host "persistence_eval OK"
          # THE ONE BRANCH THAT PRODUCES A FINDING, on the real registry: an IFEO
          # Debugger on a non-accessibility target must be a WARNING with a marker.
          $ik = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\dz_selftest_ci_tgt.exe'
          $im = Join-Path $env:TEMP 'dz_ci_persist_ifeo.txt'
          try {
            New-Item -Path $ik -Force | Out-Null
            Set-ItemProperty -Path $ik -Name Debugger -Value 'C:\Users\Public\dz_selftest_dbg.exe' -Force
            $o2 = (.\tools\persistence_eval.ps1 -MarkerFile $im) -join "`n"
            if ($o2 -notmatch '\[WARNING\] IFEO Debugger hijack: dz_selftest_ci_tgt\.exe => C:\\Users\\Public\\dz_selftest_dbg\.exe') { Write-Host $o2; throw 'a planted IFEO Debugger was not reported as a hijack' }
            if (-not (Test-Path $im)) { throw 'the IFEO hijack wrote no marker -- it never reaches the ledger' }
          } finally {
            Remove-Item -Path $ik -Recurse -Force -EA SilentlyContinue
            Remove-Item $im -Force -EA SilentlyContinue
          }
          Write-Host 'persistence_eval IFEO plant OK'
          exit 0

      - name: logon_persistence.ps1 (logon/unlock vectors; clean runner has no CRITICAL)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item "$env:TEMP\dz_logon_*.txt" -Force -EA SilentlyContinue
          $out = .\tools\logon_persistence.ps1
          $out | Write-Host
          # Must run cleanly and emit all section headers (Tier 1 + Tier 2).
          foreach ($h in 'Winlogon Notify', 'Network Provider', 'Credential Providers', 'LSA Notification', 'Screensaver', 'Logon script') {
            if (-not ($out -match [regex]::Escape($h))) { throw "logon_persistence missing section: $h" }
          }
          # A clean runner must not yield a CRITICAL logon-persistence finding.
          # (A WARNING for a legit non-Microsoft-signed provider is acceptable.)
          $crit = Get-ChildItem "$env:TEMP\dz_logon_*.txt" -EA SilentlyContinue |
            Where-Object { (Get-Content -LiteralPath $_.FullName -Raw) -match 'CRITICAL' }
          if ($crit) {
            Get-ChildItem "$env:TEMP\dz_logon_*.txt" | ForEach-Object { Write-Host ("{0}: {1}" -f $_.Name, (Get-Content -LiteralPath $_.FullName -Raw)) }
            throw "logon_persistence flagged a CRITICAL on a clean runner (false positive)"
          }
          Remove-Item "$env:TEMP\dz_logon_*.txt" -Force -EA SilentlyContinue

          # A BARE MODULE NAME IS NOT A MISSING DLL. Winlogon Notify DllName is
          # by design just a module name, which the loader resolves against
          # System32. Get-DllVerdict ran Test-Path on the raw value, resolved it
          # against the PowerShell working directory, failed, and returned
          # CRITICAL "DLL not found" -- a critical finding and a non-zero exit
          # on a healthy machine carrying a legitimate signed Notify handler.
          $nk = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\Notify\dz_ci_bare'
          New-Item -Path $nk -Force | Out-Null
          # A real, Microsoft-signed System32 DLL referenced the way the API
          # expects: bare name, no path.
          Set-ItemProperty -LiteralPath $nk -Name 'DllName' -Value 'wlnotify.dll' -Force
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('System')) 'wlnotify.dll'))) {
            Set-ItemProperty -LiteralPath $nk -Name 'DllName' -Value 'netlogon.dll' -Force
          }
          try {
            $out2 = (.\tools\logon_persistence.ps1) -join "`n"
            $ln = (($out2 -split "`n") | Where-Object { $_ -match 'dz_ci_bare' } | Select-Object -First 1)
            Write-Host $ln
            if (-not $ln) { throw 'planted Notify subkey was not reported at all' }
            if ($ln -match 'DLL not found') { throw ("a bare Notify DllName was misreported as a missing DLL: $ln") }
            if ($ln -match '^\[CRITICAL\]') { throw ("legitimate signed Notify handler reported CRITICAL (false positive): $ln") }
          } finally {
            Remove-Item -LiteralPath $nk -Recurse -Force -EA SilentlyContinue
            Remove-Item "$env:TEMP\dz_logon_*.txt" -Force -EA SilentlyContinue
          }
          Write-Host "logon_persistence OK (incl. bare Notify DllName resolution)"
          exit 0

      # Corpus [screensaver-default]: ScreenSaverIsSecure=0 is what Windows
      # leaves behind whenever someone picks a screensaver and does not tick
      # "On resume, display logon screen" -- the default, INFO, never raised.
      # The rule was a field promise. Plant a real Microsoft screensaver plus
      # the default flag and assert the INFO shape. ScreenSaveActive and the
      # timeout are NOT touched: the plant needs no screensaver to fire, and a
      # runner has no lock screen either way. Touches: registry:HKCU\Control
      # Panel\Desktop\SCRNSAVE.EXE, \ScreenSaverIsSecure -- restored in finally.
      - name: logon_persistence.ps1 -- ScreenSaverIsSecure=0 with a Microsoft screensaver is INFO
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $desk = 'HKCU:\Control Panel\Desktop'
          $scr = $null
          foreach ($c in 'scrnsave.scr', 'ssText3d.scr', 'Bubbles.scr', 'Ribbons.scr') {
            $p = Join-Path ([Environment]::GetFolderPath('System')) $c
            if (Test-Path -LiteralPath $p) { $scr = $p; break }
          }
          if (-not $scr) { throw 'no Microsoft screensaver binary under System32 -- the plant cannot be built' }
          $hadScr = (Get-ItemProperty -Path $desk -Name 'SCRNSAVE.EXE' -EA SilentlyContinue).'SCRNSAVE.EXE'
          $hadSec = (Get-ItemProperty -Path $desk -Name 'ScreenSaverIsSecure' -EA SilentlyContinue).ScreenSaverIsSecure
          Remove-Item "$env:TEMP\dz_logon_*.txt" -Force -EA SilentlyContinue
          try {
            Set-ItemProperty -Path $desk -Name 'SCRNSAVE.EXE' -Value $scr -Type String -Force
            Set-ItemProperty -Path $desk -Name 'ScreenSaverIsSecure' -Value '0' -Type String -Force
            $out = (.\tools\logon_persistence.ps1) -join "`n"
            $lines = @($out -split "`n" | Where-Object { $_ -match 'Screensaver|ScreenSaverIsSecure' })
            Write-Host $lines
            if ($out -notmatch [regex]::Escape('[OK] Screensaver is a Microsoft-signed system binary')) { throw 'a Microsoft screensaver was not graded OK' }
            if ($out -notmatch '(?m)^\[INFO\] ScreenSaverIsSecure=0') { throw 'ScreenSaverIsSecure=0 was not reported as INFO (corpus: screensaver-default)' }
            foreach ($l in $lines) { if ($l -match '^\[(WARNING|CRITICAL)\]') { throw ("the Windows default screensaver state was raised as a finding: " + $l) } }
            $bad = Get-ChildItem "$env:TEMP\dz_logon_*.txt" -EA SilentlyContinue | Where-Object { (Get-Content -LiteralPath $_.FullName -Raw) -match 'WARNING|CRITICAL' }
            if ($bad) { $bad | ForEach-Object { Write-Host ("{0}: {1}" -f $_.Name, (Get-Content -LiteralPath $_.FullName -Raw)) }; throw 'a logon-persistence marker carries a severity after planting only the default screensaver state' }
          } finally {
            if ($null -ne $hadScr) { Set-ItemProperty -Path $desk -Name 'SCRNSAVE.EXE' -Value $hadScr -Force } else { Remove-ItemProperty -Path $desk -Name 'SCRNSAVE.EXE' -EA SilentlyContinue }
            if ($null -ne $hadSec) { Set-ItemProperty -Path $desk -Name 'ScreenSaverIsSecure' -Value $hadSec -Force } else { Remove-ItemProperty -Path $desk -Name 'ScreenSaverIsSecure' -EA SilentlyContinue }
            Remove-Item "$env:TEMP\dz_logon_*.txt" -Force -EA SilentlyContinue
          }
          Write-Host 'logon_persistence: the default screensaver state is INFO'
          exit 0

      - name: INIT-path extractions (self_update_check / disk_info / smart_health)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # self_update_check: an unreachable URL must hit the catch path,
          # emit an [INFO] line, and never throw.
          $u = .\tools\self_update_check.ps1 -LocalVer '7.2' -RemoteUrl 'http://127.0.0.1:0/version.txt' -DownloadUrl 'http://x/y.bat' | Out-String
          if ($u -notmatch '\[INFO\]|version') { Write-Host "self_update_check produced no status line"; exit 1 }
          # disk_info: each mode runs against real CIM / Get-PhysicalDisk.
          $vm = (.\tools\disk_info.ps1 -Mode VmFlag).Trim()
          if ($vm -ne 'yes_vm' -and $vm -ne 'no') { Write-Host "VmFlag unexpected: '$vm'"; exit 1 }
          $ssd = (.\tools\disk_info.ps1 -Mode SsdFlag).Trim()
          if ($ssd -ne 'yes_ssd' -and $ssd -ne 'no') { Write-Host "SsdFlag unexpected: '$ssd'"; exit 1 }
          .\tools\disk_info.ps1 -Mode VmReport | Out-Null
          .\tools\disk_info.ps1 -Mode DiskDetail | Out-Null
          $free = (.\tools\disk_info.ps1 -Mode FreeSpace -SystemDrive $env:SystemDrive | Out-String).Trim()
          if ($free -notmatch '^\d+$') { Write-Host "FreeSpace not numeric: '$free'"; exit 1 }
          # smart_health: report runs; flag must be warn/ok.
          .\tools\smart_health.ps1 -Mode Report | Out-Null
          $h = (.\tools\smart_health.ps1 -Mode Flag).Trim()
          if ($h -ne 'warn' -and $h -ne 'ok') { Write-Host "smart_health Flag unexpected: '$h'"; exit 1 }
          Write-Host "INIT-path extractions OK (self_update_check, disk_info x5, smart_health x2)"
          exit 0

      - name: dns_probe.ps1 -SelfTest + live (active DNS integrity probe, -dnsprobe)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The pure verdicts on real Windows PowerShell 5.1 (the engine this ships to).
          $st = (.\tools\dns_probe.ps1 -SelfTest) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Host $st; throw 'dns_probe.ps1 -SelfTest failed' }
          $nst = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($nst -lt 26) { throw "dns_probe self-test ran only $nst case(s)" }
          Write-Host "dns_probe -SelfTest OK ($nst cases)"
          $marker = Join-Path $env:TEMP 'dz_ci_dnsprobe.txt'
          if (Test-Path $marker) { Remove-Item $marker -Force }
          $out = .\tools\dns_probe.ps1 -MarkerFile $marker | Out-String
          # Lenient on network variance: just require recognizable probe output
          # (per-domain '->' lines, or the all-clear / blackhole / unverified summary).
          if ($out -notmatch '->|security/update domains|did not resolve|NOT verified') {
            Write-Host "dns_probe produced no recognizable output:"; Write-Host $out; exit 1
          }
          # The marker is a VALUE the bat reads with set /p: only these two words
          # may ever appear in it, and a healthy runner writes none.
          if (Test-Path $marker) {
            $mv = (Get-Content $marker -Raw).Trim()
            if ($mv -notin @('blackhole', 'unverified')) { throw "dns_probe wrote an unknown marker value '$mv'" }
            Write-Host "dns_probe marker: $mv"
          }
          Write-Host "dns_probe OK"
          Write-Host $out
          exit 0

      # Server runners have System Protection off, so Checkpoint-Computer
      # cannot create a real restore point. That's the point of THIS test:
      # in a no-op run, srp_check.ps1 must (1) execute without parser/runtime
      # errors and (2) NOT write the marker file. Writing it incorrectly is
      # exactly the trust-bug we're guarding against -- it'd cause doze_sec to
      # log a phantom "[CREATED]" entry in every change log.
      - name: srp_check.ps1 runs cleanly and does NOT mark on a no-op
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Join-Path $env:TEMP 'dz_ci_srp_marker.txt'
          if (Test-Path $m) { Remove-Item $m -Force }
          .\tools\srp_check.ps1 -Description 'doze_sec CI selftest' -MarkerFile $m | Out-Null
          if (Test-Path $m) {
            Write-Host "srp_check FAILED: marker file was written despite no new restore point being created"
            Remove-Item $m -Force
            exit 1
          }
          Write-Host "srp_check OK (no marker on no-op)"
          exit 0

      # The INIT 12 if-exist block uses cmd.exe constructs (echo text>> file
      # inside a parenthesized if block). This step exercises it directly with
      # cmd.exe on a real Windows runner -- the only way to catch cmd.exe parse
      # errors like the "(if desired):" colon-after-paren crash that the PS-only
      # steps and full-run -nosrp both missed.
      - name: INIT 12 SRP if-exist changelog block (cmd.exe parse + run check)
        shell: cmd
        run: |
          rem Create marker so the if-exist condition fires
          echo.> "%TEMP%\dz_srp_created.txt"
          set "CHANGELOG=%TEMP%\dz_ci_srp_changelog.txt"
          set "SCRIPT_VERSION=7.3"
          if exist "%TEMP%\dz_srp_created.txt" (
              echo [CREATED] System Restore Point: "Pre-WIN11-Security-Audit-v%SCRIPT_VERSION%">> "%CHANGELOG%"
              echo           This is a safety net -- it lets you roll back any changes made AFTER this point.>> "%CHANGELOG%"
              echo           Undo ^(if desired^): Control Panel ^> System ^> System Protection ^> System Restore>> "%CHANGELOG%"
              echo           Select the restore point named Pre-WIN11-Security-Audit-v%SCRIPT_VERSION%>> "%CHANGELOG%"
              echo           NOTE: This is intentional and recommended. Only remove it if you are certain.>> "%CHANGELOG%"
              del "%TEMP%\dz_srp_created.txt" 2>nul
          )
          if exist "%TEMP%\dz_srp_created.txt" ( echo FAILED: marker not deleted & exit /b 1 )
          if not exist "%CHANGELOG%" ( echo FAILED: changelog not written & exit /b 1 )
          findstr /c:"CREATED" "%CHANGELOG%" >nul || ( echo FAILED: CREATED line missing & exit /b 1 )
          findstr /c:"if desired" "%CHANGELOG%" >nul || ( echo FAILED: if-desired line missing & exit /b 1 )
          echo INIT 12 if-exist block OK ^(cmd.exe parse and run^)
          exit /b 0

      # Section 4 suspicious-path patterns cross the cmd -> powershell.exe -File
      # argv boundary. A trailing UNdoubled backslash before the closing quote
      # ("\Temp\") is parsed by .NET argv rules as an escaped literal quote,
      # fusing the patterns into one garbage string -- a silent false negative
      # for the flagship malware-in-Temp check. This step runs the EXACT bat
      # invocation (doubled backslashes) from cmd and asserts both a hit and a
      # miss, so any regression in the quoting breaks CI instead of the check.
      - name: select_lines.ps1 argv quoting (Temp/AppData patterns match from cmd)
        shell: cmd
        run: |
          echo evil.exe  666  C:\Users\x\AppData\Local\Temp\evil.exe> "%TEMP%\dz_ci_argv.tmp"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\select_lines.ps1 -Path "%TEMP%\dz_ci_argv.tmp" "\Temp\\" "\AppData\\" "\Downloads\\" "\Recycle" "\Users\Public" >nul
          if not "%ERRORLEVEL%"=="0" ( echo FAILED: \Temp\ path did not match -- argv quoting regressed & exit /b 1 )
          echo winword.exe  777  C:\Program Files\Microsoft Office\winword.exe> "%TEMP%\dz_ci_argv.tmp"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\select_lines.ps1 -Path "%TEMP%\dz_ci_argv.tmp" "\Temp\\" "\AppData\\" "\Downloads\\" "\Recycle" "\Users\Public" >nul
          if not "%ERRORLEVEL%"=="1" ( echo FAILED: benign path matched -- patterns are corrupt & exit /b 1 )
          echo select_lines argv quoting OK ^(hit on \Temp\, miss on benign^)
          exit /b 0

      # Guard the bat files themselves: the suspicious-path call sites must
      # keep the doubled-backslash form, and BOTH 18e scheduled-task IOC
      # matchers must keep [regex]::Escape (the fix was once applied to only
      # one of the two scripts, silently killing 6 backslash-path IOCs in the
      # other).
      - name: bat call sites keep argv/regex fixes in BOTH scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in 'doze_sec.bat','doze_sec_noAdmin.bat') {
            if (-not (Select-String -Path $f -SimpleMatch '"\Temp\\" "\AppData\\" "\Downloads\\"' -Quiet)) {
              Write-Host "FAILED: $f lost the doubled-backslash suspicious-path patterns"; exit 1
            }
            if (-not (Select-String -Path $f -SimpleMatch '[regex]::Escape($p.Trim())' -Quiet)) {
              Write-Host "FAILED: $f lost [regex]::Escape in the 18e scheduled-task IOC matcher"; exit 1
            }
          }
          # Every active scheduled-task IOC must be usable as an escaped literal.
          $bad = @(Get-Content ThreatLists\ioc_scheduled_tasks.txt | Where-Object { $_ -and $_ -notmatch '^\s*#' } | Where-Object {
            try { [void]('probe' -match [regex]::Escape($_.Trim())); $false } catch { $true }
          })
          if ($bad) { Write-Host "FAILED: unusable IOC pattern(s): $($bad -join ', ')"; exit 1 }
          # The end-of-run CRITICAL escalation must use the resolved %PWSH%, not
          # bare 'powershell' -- on a host where powershell is not on PATH (the
          # exact case %PWSH% resolution exists for) a bare call no-ops and exit
          # code 8 is never raised. Assert the scrape line uses "%PWSH%".
          foreach ($f in 'doze_sec.bat','doze_sec_noAdmin.bat') {
            # The census reads the report path from the environment (an apostrophe
          # in a pasted path ended the string); single quotes here so $env:REPORT
          # is searched for literally, not expanded.
          $scrape = Select-String -Path $f -SimpleMatch 'Select-String -LiteralPath $env:REPORT -Pattern ''\A\[CRITICAL\]'''
            if (-not $scrape) { Write-Host "FAILED: $f lost the CRITICAL-escalation scrape line"; exit 1 }
            if ($scrape.Line -notmatch '"%PWSH%"') {
              Write-Host "FAILED: $f CRITICAL-escalation scrape uses bare powershell, not %PWSH% -- $($scrape.Line.Trim())"; exit 1
            }
          }
          Write-Host 'argv/regex fix guards OK (both bats, all task IOCs escape-safe, CRIT scrape uses %PWSH%)'
          exit 0

      # vt_self_check.ps1 is called from the bats as -Binaries "a","b","c".
      # powershell.exe -File binds that as ONE comma-joined string, which the
      # script must split -- before this was fixed, zero binaries resolved and
      # the VT integrity gate silently verified nothing. Run the EXACT bat-style
      # call from cmd with a dummy token and assert all four binaries resolve
      # (the dummy key then 401s and exits 2, which is fine -- resolution
      # happens before any network call).
      # Corpus [vt-low-credibility]: this tool needs a VirusTotal token and -vt
      # (which -readonly refuses), so it had never run anywhere in CI and its
      # credibility tiers were a field promise. The judgement is now a pure
      # function; -SelfTest returns before any token read or network call.
      - name: vt_ip_check.ps1 -SelfTest (a single non-top-tier engine is INFO, not a finding)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $st = (.\tools\vt_ip_check.ps1 -SelfTest) -join "`n"
          Write-Host $st
          if ($LASTEXITCODE -ne 0) { throw 'vt_ip_check.ps1 -SelfTest failed' }
          $n = @($st -split "`n" | Where-Object { $_ -match '^\[OK\]   ' }).Count
          if ($n -lt 9) { throw "vt_ip_check self-test ran only $n case(s)" }
          if ($st -notmatch 'one non-top-tier engine: LOW credibility') { throw 'vt_ip_check self-test no longer covers the LOW-credibility twin' }
          Write-Host "vt_ip_check -SelfTest OK ($n cases)"
          exit 0

      - name: vt_self_check.ps1 resolves comma-bound -Binaries from cmd
        shell: cmd
        run: |
          mkdir "%TEMP%\dz_vt_home" 2>nul
          echo dummy-token-for-binding-test> "%TEMP%\dz_vt_home\.vt_token"
          set "USERPROFILE=%TEMP%\dz_vt_home"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\vt_self_check.ps1 -SleepSeconds 0 -TimeoutSeconds 5 -Binaries "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe","%SystemRoot%\System32\wevtutil.exe","%SystemRoot%\System32\reg.exe","%SystemRoot%\System32\findstr.exe"> "%TEMP%\dz_vt_out.txt" 2>&1
          findstr /c:"no resolvable binaries" "%TEMP%\dz_vt_out.txt" >nul && ( echo FAILED: comma-bound -Binaries did not split -- VT gate is dead again & type "%TEMP%\dz_vt_out.txt" & exit /b 1 )
          findstr /c:"verifying 4" "%TEMP%\dz_vt_out.txt" >nul || ( echo FAILED: expected all 4 binaries to resolve & type "%TEMP%\dz_vt_out.txt" & exit /b 1 )
          echo vt_self_check comma-binding OK ^(4/4 binaries resolved^)
          exit /b 0

  full-run:
    name: "doze_sec.bat end-to-end (hang guard, hard timeout)"
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Plant a 7045 record carrying the retired dz_probe marker (residue the audit must count, not list)
        shell: powershell
        run: |
          # Six records exactly like this outlived a manual run of the EDR
          # verification block on the owner's machine (2026-08-30, before the
          # marker became dz_selftest_ci_probe) and were reported as suspicious
          # service installations on every audit for three weeks. sc delete
          # removes the service, never the log record; the exclusion has to
          # know the marker. Section 16 must LIST the record (it is a real
          # 7045), Section 18 must COUNT it as harness residue.
          & sc.exe create dzsmoke_probe_residue binPath= 'C:\Windows\System32\cmd.exe /c rem dz_probe' start= demand | Out-Null
          & sc.exe delete dzsmoke_probe_residue | Out-Null

      - name: Plant a pending reboot (exit code 4 is the code of every run on the owner's laptop; CI must take that path)
        shell: powershell
        run: |
          # The audit's exit handler deleted its RunOnce resume entry only on exit
          # 0/2/8. A run that COMPLETED with a reboot pending exits 4 and left the
          # entry behind -- the audit would launch itself with -resume at the next
          # logon. The owner's laptop has had a reboot pending for every field run,
          # so 4 is the path a person takes and the path this job never took: a
          # runner without one exits 2 or 8 (8 here: this image carries a cleared
          # Security log and Defender real-time off, and a CRITICAL outranks the
          # reboot code, so the run reads 8 with the REBOOT row still in the
          # ledger -- the deletion is unconditional now, and the ledger row is what
          # proves the plant was seen). Windows records a pending reboot in
          # PendingFileRenameOperations (Session Manager consumes it at boot; the
          # runner is ephemeral and never boots again), and the bat's Section 1
          # check reads exactly that value. Touches: registry:HKLM\SYSTEM\
          # CurrentControlSet\Control\Session Manager\PendingFileRenameOperations.
          $k = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager'
          $cur = (Get-ItemProperty -LiteralPath $k -Name PendingFileRenameOperations -EA SilentlyContinue).PendingFileRenameOperations
          # APPEND, never skip: the post-run step asserts the planted path is LISTED
          # beneath the finding, which a runner's own entries could not satisfy.
          $planted = @('\??\C:\dz_ci_pending_rename.tmp', '', '*1\??\C:\dz_ci_pending_rename2.tmp', '')
          if ($cur) { Write-Host ("PendingFileRenameOperations already set ({0} entries) -- the runner has a pending reboot of its own; appending the plant" -f @($cur).Count); $planted = @($cur) + $planted }
          Set-ItemProperty -LiteralPath $k -Name PendingFileRenameOperations -Type MultiString -Value $planted
          Write-Host 'planted PendingFileRenameOperations: the audit must now report a pending reboot, list the planted path, and exit 4'

      # Corpus [adfs-present] / [aadconnect-present]: Section 17 prints
      # "[INFO] ADFS detected" when the service adfssrv OR the key
      # HKLM\SOFTWARE\Microsoft\ADFS exists, and "[INFO] Azure AD Connect
      # detected" for ADSync OR HKLM\SOFTWARE\Microsoft\Azure AD Connect.
      # Installed software is attack surface, not compromise: INFO, never
      # raised. Both were field promises. Plant the registry footprint only --
      # an EMPTY key each, never a service, because a fake adfssrv with a
      # cmd.exe image path would also be graded by the service checks and is
      # not the benign twin. Touches: registry:HKLM\SOFTWARE\Microsoft\ADFS,
      # registry:HKLM\SOFTWARE\Microsoft\Azure AD Connect (removed by the
      # cleanup step below, which runs even when the audit fails).
      - name: Plant the ADFS and Azure AD Connect registry footprints (installed software is INFO, not a finding)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($k in 'HKLM:\SOFTWARE\Microsoft\ADFS', 'HKLM:\SOFTWARE\Microsoft\Azure AD Connect') {
            if (Test-Path -LiteralPath $k) { throw ("{0} already exists on this runner -- the plant would not be a plant; inspect the image" -f $k) }
            New-Item -Path $k -Force | Out-Null
          }
          Write-Host 'planted two empty keys: ADFS and Azure AD Connect'

      # A USER NAMED O'BRIEN. The bats used to paste paths between single quotes
      # into the PowerShell they run, and %TEMP% and %APPDATA% live under the
      # user's profile, so for such a user the dashboard script (in %TEMP%) and
      # Section 11's history block were parse errors that printed nothing: no
      # dashboard, and a remediation script holding only its header. This run takes TEMP and TMP from a
      # folder holding an apostrophe, and APPDATA from one holding an apostrophe
      # and a space ("Mary O'Brien"), with a PowerShell history planted there so
      # Section 11's block really runs. CI only. Touches: C:\dz_ci_o'brien\Temp
      # and "C:\dz ci o'brien\AppData\Roaming\...\ConsoleHost_history.txt".
      - name: "Plant an apostrophe in TEMP and APPDATA (a user named O'Brien), with a PowerShell history"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path "C:\dz_ci_o'brien\Temp" -Force | Out-Null
          $h = "C:\dz ci o'brien\AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine"
          New-Item -ItemType Directory -Path $h -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $h 'ConsoleHost_history.txt') -Value @('Get-Date', 'Write-Output dz_ci_history_marker_7c1') -Encoding ASCII
          Write-Host "planted: TEMP/TMP C:\dz_ci_o'brien\Temp, APPDATA C:\dz ci o'brien\AppData\Roaming, and a history file with a marker line"

      - name: "Run lock: watch which process holds the lock during the full run (the console-log path a person takes)"
        shell: powershell
        run: |
          # The full run below takes the default console-log path: the bat
          # re-runs itself on the left side of a pipe into Tee-Object, and the
          # audit body runs in THAT child cmd. The lock must name a process
          # that lives exactly as long as the audit. Every other lock test uses
          # -noConsoleLog, so this records the holder here, in the background,
          # for the step after the run to check.
          $w = Join-Path $env:RUNNER_TEMP 'dz_lock_watch.txt'
          Remove-Item -LiteralPath $w -Force -EA SilentlyContinue
          $ws = Join-Path $env:RUNNER_TEMP 'dz_lock_watch.ps1'
          $lines = @(
            '$deadline = (Get-Date).AddMinutes(25)',
            'while ((Get-Date) -lt $deadline) {',
            '  if (Test-Path ''C:\SecurityAudit\dz_audit_running.lock'') {',
            '    $t = [IO.File]::ReadAllText(''C:\SecurityAudit\dz_audit_running.lock'')',
            '    $m = [regex]::Match($t, ''pid=(\d+);'')',
            '    if ($m.Success) {',
            '      $p = Get-CimInstance Win32_Process -Filter (''ProcessId='' + $m.Groups[1].Value)',
            '      Set-Content -LiteralPath $args[0] -Value @((''lock='' + $t), (''name='' + $p.Name), (''cmd='' + $p.CommandLine)) -Encoding ASCII',
            '      exit 0',
            '    }',
            '  }',
            '  Start-Sleep -Milliseconds 500',
            '}'
          )
          Set-Content -LiteralPath $ws -Value $lines -Encoding ASCII
          Start-Process powershell.exe -ArgumentList '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', ('"' + $ws + '"'), ('"' + $w + '"') -WindowStyle Hidden
          Write-Host 'lock watcher started'

      - name: Run the full audit; fail on hang (timeout), fatal error, or early exit
        shell: cmd
        run: |
          rem The audit alone runs under the apostrophe paths planted above.
          set "DZ_REAL_TEMP=%TEMP%"
          set "DZ_REAL_TMP=%TMP%"
          set "DZ_REAL_APPDATA=%APPDATA%"
          set "TEMP=C:\dz_ci_o'brien\Temp"
          set "TMP=C:\dz_ci_o'brien\Temp"
          set "APPDATA=C:\dz ci o'brien\AppData\Roaming"
          rem AN INHERITED OUTDIR. OUTDIR is a common variable name in build tools,
          rem and the -resetTTP/-updateTTP handlers once fell back to whatever the
          rem environment held: -resetTTP deleted the ioc_*.txt lists in that folder.
          rem This run passes -resetTTP with OUTDIR naming a decoy that holds a
          rem planted list; the decoy must come out untouched and hold no output.
          rem Touches: file:C:\dz_ci_outdir_decoy\ (removed below)
          if not exist "C:\dz_ci_outdir_decoy\ThreatLists" mkdir "C:\dz_ci_outdir_decoy\ThreatLists"
          >"C:\dz_ci_outdir_decoy\ThreatLists\ioc_dz_ci_decoy.txt" echo dz_ci_outdir_decoy planted list
          set "OUTDIR=C:\dz_ci_outdir_decoy"
          call doze_sec.bat -dev -sdu -nosrp -resetTTP -dnsprobe
          set RC=%ERRORLEVEL%
          set "OUTDIR="
          set "TEMP=%DZ_REAL_TEMP%"
          set "TMP=%DZ_REAL_TMP%"
          set "APPDATA=%DZ_REAL_APPDATA%"
          echo doze_sec.bat exit code: %RC%
          if not exist "C:\dz_ci_outdir_decoy\ThreatLists\ioc_dz_ci_decoy.txt" ( echo INHERITED OUTDIR: -resetTTP deleted a list in the folder an environment variable named & exit /b 1 )
          findstr /x /c:"dz_ci_outdir_decoy planted list" "C:\dz_ci_outdir_decoy\ThreatLists\ioc_dz_ci_decoy.txt" >nul || ( echo INHERITED OUTDIR: the planted list in the decoy folder was rewritten & exit /b 1 )
          dir /b /s /a-d "C:\dz_ci_outdir_decoy" > "%RUNNER_TEMP%\dz_decoy_files.txt"
          rem Windows' own find.exe, by path: the image puts Git's GNU find on PATH too.
          %SystemRoot%\System32\find.exe /c /v "" < "%RUNNER_TEMP%\dz_decoy_files.txt" | findstr /x "1" >nul || ( echo INHERITED OUTDIR: the audit wrote into the folder an environment variable named: & type "%RUNNER_TEMP%\dz_decoy_files.txt" & exit /b 1 )
          rmdir /s /q "C:\dz_ci_outdir_decoy"
          echo inherited OUTDIR: the decoy folder came out untouched, its planted list intact
          if "%RC%"=="1" ( echo FATAL ERROR exit code 1 & exit /b 1 )
          rem THE PENDING-REBOOT PATH. The step above planted PendingFileRenameOperations,
          rem so this run must read "Reboot pending" and exit 4 -- or 8, because a
          rem CRITICAL outranks the reboot code and this runner image carries two of
          rem its own (Security log cleared when the image was built, Event 1102;
          rem Defender real-time protection off). An 8 is accepted only when the
          rem ledger holds a CRITICAL row that explains it; any other code fails.
          rem The RC == REPRC comparison below holds either way.
          set "RCOK="
          if "%RC%"=="4" set "RCOK=1"
          if "%RC%"=="8" ( findstr /b /c:"CRITICAL|" "C:\SecurityAudit\SecurityReport_*.ledger" >nul 2>&1 && set "RCOK=1" )
          if "%RC%"=="8" ( echo exit 8: a CRITICAL row outranks the planted reboot on this runner image -- see the ledger )
          if not defined RCOK ( echo EXPECTED EXIT CODE 4 WITH A PENDING REBOOT PLANTED, OR 8 EXPLAINED BY A CRITICAL LEDGER ROW -- GOT %RC% & exit /b 1 )
          rem THE REPORT THIS RUN WROTE, NOT THE NEWEST FILE IN THE FOLDER.
          rem
          rem This loop used to assign unconditionally, so it kept the LAST
          rem match -- and `for` walks the glob in name order, which for
          rem SecurityReport_<date>_<time> is chronological. That is the newest
          rem report, which is not necessarily this run's.
          rem
          rem It cost a red job twice, on PR #235 and again here, both times
          rem with the same baffling symptom: the console shows all 18 sections
          rem and exit 8, while the check reports "the audit did not reach
          rem Section 18". The diagnostic added for the first occurrence
          rem printed the answer this time -- the file it read was 11,718 bytes
          rem with a header reading `Dev=0 Resume=1` and a last line of
          rem "STATUS: Unsupported OS", i.e. a SECOND invocation carrying only
          rem -resume, which began six seconds into this run and so sorted
          rem after it. That is the RunOnce resume entry this audit creates at
          rem INIT 8 being executed by the runner's own session while the first
          rem run was still going; harmless in itself (a -resume run with no
          rem -dev stops at the OS check on a Server image), and nothing to do
          rem with what the audit found.
          rem
          rem So: take the FIRST report, which is the one this step's own
          rem invocation started, and declare the extra if there is one rather
          rem than letting it silently become the thing under test.
          set "REP="
          set "REPN=0"
          for %%R in ("C:\SecurityAudit\SecurityReport_*.txt") do (
              set /a REPN+=1
              if not defined REP set "REP=%%R"
          )
          if not defined REP ( echo NO REPORT PRODUCED & exit /b 1 )
          rem ONE AUDIT AT A TIME. The second report used to come from the
          rem RunOnce resume entry firing mid-run; the run lock now makes that
          rem invocation stand down before it writes anything, so a second
          rem report is a defect, not a curiosity.
          if not "%REPN%"=="1" (
              echo %REPN% reports are present, and the run lock should have stopped any second audit:
              for %%R in ("C:\SecurityAudit\SecurityReport_*.txt") do echo    %%R
              exit /b 1
          )
          set "STOOD=0"
          for %%L in ("C:\SecurityAudit\AuditConsole_*.log") do findstr /c:"Another doze_sec audit is already running" "%%L" >nul 2>&1 && set "STOOD=1"
          if "%STOOD%"=="1" ( echo MEASURED: the RunOnce resume entry fired during this run, and that second invocation stood down at the run lock ) else ( echo MEASURED: the RunOnce resume entry did not fire during this run )
          rem A hang is caught by the job timeout; this catches an EARLY EXIT
          rem (e.g. a parse error mid-audit) that still left a partial report:
          rem the exit handler's "EXIT CODE:" line and the [18/18] banner only
          rem exist if the audit actually ran to the end.
          rem Asserted by a script that prints the file's shape on failure (size,
          rem lines, longest line, NUL count, encoding sniff, head and tail): a
          rem bare findstr verdict named the symptom and nothing else when this
          rem failed on a run whose console showed every section and the summary.
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\assert_report_complete.ps1 -Report "%REP%" || exit /b 1
          rem A REAL run (no -selftest) must never carry the test banner nor land
          rem in the selftest quarantine; the harness jobs assert the inverse.
          findstr /c:"TEST RUN -- every finding below was planted" "%REP%" >nul && ( echo REAL RUN CARRIES THE TEST BANNER & exit /b 1 )
          echo %REP% | findstr /i /c:"\selftest\" >nul && ( echo REAL RUN LANDED IN THE SELFTEST QUARANTINE & exit /b 1 )
          rem THE HEADER MUST AGREE WITH FINDINGS COUNTED. A field report headed
          rem "0 CRITICAL / 3 WARNING / 30 PASSED" and ended "FINDINGS COUNTED: 7",
          rem because the header counted dashboard TILES. It now derives from the
          rem same ledger, and nothing else asserts that, so it would drift back
          rem silently. Compared on the real report a real cmd.exe just produced.
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\assert_header_matches_ledger.ps1 -Report "%REP%" || exit /b 1
          rem A PRINTED FINDING MUST REACH THE LEDGER UNDER ITS OWN TECHNIQUE.
          rem verdict_audit asks only whether the SECTION raised anything, which is
          rem the right question for it: :dz_ps_scan deliberately raises once for a
          rem block printing several lines, so it cannot compare counts. That gap is
          rem how Sticky Keys printed a WARNING in Section 13, was covered by the
          rem BitLocker row, and reached neither FINDINGS COUNTED, the exit code nor
          rem the remediation script. This asserts the curated cases by section AND
          rem technique. The runner has the Sticky Keys shortcut enabled, so this
          rem exercises the real path rather than a fixture.
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\assert_printed_findings_raised.ps1 -Report "%REP%" || exit /b 1
          rem THE EXIT CODE A PERSON SEES. Without -noConsoleLog the bat re-runs
          rem itself under Tee-Object and hands its real exit code back through
          rem a file. That write was `echo %EXIT_CODE%>"file"`: cmd reads a digit
          rem before `>` as a HANDLE, so `echo 8>file` printed "ECHO is off." and
          rem wrote nothing, and every such run on every machine exited 0. This
          rem job took that path all along and asserted only RC==1, which could
          rem never fire. Compare RC with the code the report itself printed.
          set "REPRC="
          for /f "tokens=3" %%c in ('findstr /c:"EXIT CODE:" "%REP%"') do set "REPRC=%%c"
          if not defined REPRC ( echo REPORT HAS NO "EXIT CODE:" LINE & exit /b 1 )
          echo report says EXIT CODE: %REPRC% -- the process exited %RC%
          if not "%RC%"=="%REPRC%" ( echo EXIT CODE LOST ON THE CONSOLE-LOG PATH: process exited %RC%, report says %REPRC% & exit /b 1 )
          rem Section 16 lists the 7045 record the plant step left (it is real);
          rem Section 18 counts it as harness residue and does not list it.
          findstr /r /c:"^Service Name: *dzsmoke_probe_residue" "%REP%" >nul || ( echo SECTION 16 DID NOT PRINT THE PLANTED 7045 RECORD & exit /b 1 )
          findstr /r /c:"system\. Service Name: *dzsmoke_probe_residue" "%REP%" >nul && ( echo SECTION 18 LISTED OUR OWN dz_probe RESIDUE AS A SUSPICIOUS SERVICE INSTALL & exit /b 1 )
          findstr /c:"(dz_selftest/dzsmoke/dz_probe) and were excluded" "%REP%" >nul || ( echo SECTION 18 DID NOT DECLARE THE EXCLUDED RESIDUE COUNT & exit /b 1 )
          echo Completed end-to-end through Section 18 and the exit handler.
          exit /b 0

      - name: "Run lock: on the console-log path the lock named the audit's own cmd, and was released"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $w = Join-Path $env:RUNNER_TEMP 'dz_lock_watch.txt'
          if (-not (Test-Path $w)) { throw 'the watcher never saw the output-folder run lock during the full run -- it was not taken' }
          $c = Get-Content $w
          Write-Host ($c -join ' | ')
          $name = (($c | Where-Object { $_ -like 'name=*' }) -replace '^name=', '')
          $cmd = (($c | Where-Object { $_ -like 'cmd=*' }) -replace '^cmd=', '')
          if ($name -ne 'cmd.exe') { throw "the lock holder was '$name', not the cmd running the audit" }
          if ($cmd -notmatch 'doze_sec\.bat') { throw "the lock holder's command line does not run doze_sec.bat: $cmd" }
          if (Test-Path 'C:\SecurityAudit\dz_audit_running.lock') { throw 'the full run left its output-folder run lock behind' }
          $rep = @(Get-ChildItem 'C:\SecurityAudit\SecurityReport_*.txt' | Sort-Object Name)[0]
          if (-not (Select-String -LiteralPath $rep.FullName -SimpleMatch -Pattern 'Run lock taken: a second audit started while this one runs will stand down' -Quiet)) { throw 'the full run''s report does not say it took the run lock' }
          Write-Host 'PROVEN on the console-log path: the lock named the cmd running doze_sec.bat, and was released at exit'

      - name: The resume entry pointed at the bat, the planted reboot reached the ledger, and the entry is gone after the exit-4 run
        shell: powershell
        run: |
          . .\.github\ci\resume_entry_exit4.ps1
          exit $LASTEXITCODE

      - name: Remove the planted ADFS and Azure AD Connect footprints
        if: always()
        shell: powershell
        run: |
          foreach ($k in 'HKLM:\SOFTWARE\Microsoft\ADFS', 'HKLM:\SOFTWARE\Microsoft\Azure AD Connect') { Remove-Item -LiteralPath $k -Recurse -Force -EA SilentlyContinue }
          Write-Host 'removed the two planted keys'

      - name: Upload the audit artifacts for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securityaudit-output
          path: C:\SecurityAudit\**
          if-no-files-found: ignore

  # Read-only field test. full-run above proves the audit completes; this
  # proves the -readonly promise on a real Windows machine using the exact
  # script a person runs on their own machine (tests\field_test.ps1): the
  # RunOnce key, the boot configuration and the restore-point count are
  # captured before and after and must be unchanged; the report must carry
  # the READ-ONLY banner and declare every skipped step; and the benign
  # look-alike corpus must grade it with no known false positive returning.
  readonly-field-test:
    name: "tests/field_test.ps1: -readonly changes nothing on the machine (proven before/after)"
    runs-on: windows-latest
    timeout-minutes: 44
    steps:
      - uses: actions/checkout@v4

      - name: "Run lock: a second audit started while one runs stands down -- no report, nothing changed"
        shell: powershell
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          # A LIVE holder takes the real lock the bats use, the way a running
          # audit would; then the real bat is started beside it.
          # Touches: file:%TEMP%\dz_audit_running.lock, file:C:\SecurityAudit\dz_audit_running.lock (both left STALE for the next step on purpose)
          $lock = Join-Path $env:TEMP 'dz_audit_running.lock'
          $lockO = 'C:\SecurityAudit\dz_audit_running.lock'
          if (-not (Test-Path 'C:\SecurityAudit')) { New-Item -ItemType Directory -Path 'C:\SecurityAudit' | Out-Null }
          Remove-Item -LiteralPath $lock, $lockO -Force -EA SilentlyContinue
          $st = Join-Path $env:TEMP 'dz_ci_holder_state.txt'
          Remove-Item -LiteralPath $st -Force -EA SilentlyContinue
          $tool = (Resolve-Path .\tools\run_lock.ps1).Path
          $holder = Start-Process cmd.exe -ArgumentList '/c', ("powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$tool`" -LockFiles `"$lock|$lockO`" -StateFile `"$st`" -Label dz_ci_holder & ping -n 300 127.0.0.1 >nul") -WindowStyle Hidden -PassThru
          $null = $holder.Handle
          $deadline = (Get-Date).AddSeconds(60); $sv = ''
          while ((Get-Date) -lt $deadline -and $sv -notmatch '^[a-z-]+$') { Start-Sleep -Milliseconds 500; $sv = [string](Get-Content $st -EA SilentlyContinue | Select-Object -First 1) }
          if ($sv -ne 'acquired') { throw "the holder did not take the locks: '$sv'" }
          $lt = Get-Content $lock -Raw
          $ltO = Get-Content $lockO -Raw
          $before = @(Get-ChildItem 'C:\SecurityAudit\SecurityReport_*.txt' -EA SilentlyContinue).Count
          $outF = Join-Path $env:TEMP 'dz_ci_busy_out.txt'
          $p = Start-Process cmd.exe -ArgumentList '/c', ("doze_sec.bat -dev -readonly -noConsoleLog > `"$outF`" 2>&1") -WindowStyle Hidden -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { & taskkill.exe /PID $p.Id /T /F 2>&1 | Out-Null; & taskkill.exe /PID $holder.Id /T /F 2>&1 | Out-Null; throw 'the second audit did not stand down within 3 minutes -- it is running beside the first' }
          $o = Get-Content $outF -Raw
          Write-Host $o
          if ($p.ExitCode -ne 1) { throw ("the second audit exited {0}, not 1" -f $p.ExitCode) }
          if ($o -notmatch 'Another doze_sec audit is already running \(process ' + $holder.Id) { throw 'the second audit did not say an audit is already running, naming the holder' }
          $after = @(Get-ChildItem 'C:\SecurityAudit\SecurityReport_*.txt' -EA SilentlyContinue).Count
          if ($after -ne $before) { throw 'the second audit wrote a report' }
          if ((Get-Content $lock -Raw) -ne $lt -or (Get-Content $lockO -Raw) -ne $ltO) { throw 'the second audit changed the running audit''s locks' }
          # Now the holder dies without releasing -- a crash mid-run. The lock
          # stays, STALE, and the field test that follows must proceed and
          # replace it.
          & taskkill.exe /PID $holder.Id /T /F 2>&1 | Out-Null
          Start-Sleep -Seconds 2
          if (-not (Test-Path $lock) -or -not (Test-Path $lockO)) { throw 'a stale lock is gone before the field test -- the next step would test nothing' }
          Remove-Item -LiteralPath $st, $outF -Force -EA SilentlyContinue
          Write-Host 'PROVEN: with an audit running, a second one exits 1 having written no report and left both locks untouched; the holder is now gone and its lock is stale'
          $global:LASTEXITCODE = 0
          exit 0

      - name: Run the field test (read-only audit + read-only proof + corpus check)
        shell: powershell
        run: |
          . .\.github\ci\field_test_readonly.ps1
          exit $LASTEXITCODE

      - name: "Run lock: the field test replaced the stale lock and left none behind"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $rep = Get-ChildItem 'C:\SecurityAudit\SecurityReport_*.txt' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $t = [IO.File]::ReadAllText($rep.FullName)
          $line = ($t -split "`r?`n" | Where-Object { $_ -match 'Run lock' }) -join ' | '
          Write-Host ("report: " + $rep.Name + " -- " + $line)
          if ($t -notmatch '\[INFO\] Run lock: replaced a stale lock left by an audit that is no longer running') { throw 'the audit did not say it replaced the stale lock the previous step left -- a lock left by a crash must never block, and must be visible' }
          foreach ($lk in (Join-Path $env:TEMP 'dz_audit_running.lock'), 'C:\SecurityAudit\dz_audit_running.lock') {
            if (Test-Path $lk) { throw ("the audit left its run lock behind: {0}" -f $lk) }
          }
          Write-Host 'PROVEN: a stale lock was replaced and declared, and the audit released its own lock at exit'

      # The report prints ~176 " Command: <X>" lines -- "here is how to check
      # this yourself". lint_report_echo proves each one PARSES. Parsing is not
      # running: #195 rewrote 22 of them per bat and verified only with
      # ParseInput, and this project already paid for that distinction once,
      # when two remediation commands parsed cleanly and could never execute.
      # This runs them, against the report a -readonly audit just produced --
      # the exact text with %VAR% already expanded that a reader would paste.
      #
      # It executes nothing it cannot prove read-only: the RunOnce `reg add`,
      # the `ping` and the self-update `Invoke-WebRequest` honestly document
      # the audit's own INIT actions and are skipped by name. A line it cannot
      # classify at all fails the job rather than being skipped quietly.
      - name: report_command_probe.ps1 (the printed commands actually RUN, not just parse)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $rep = Get-ChildItem 'C:\SecurityAudit\SecurityReport_*.txt' -EA SilentlyContinue |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $rep) { throw 'no report to probe -- the field test did not produce one' }
          $out = (.\tools\report_command_probe.ps1 -Report $rep.FullName -MinProbed 120) -join "`n"
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw 'a command the report tells a reader to run does not run' }
          # Guard the guard: a probe that skipped everything would pass vacuously.
          $m = [regex]::Match($out, "(\d+) 'Command:' line\(s\): (\d+) executed, (\d+) skipped")
          if (-not $m.Success) { throw 'report_command_probe did not report what it did -- the extractor regressed' }
          if ([int]$m.Groups[2].Value -lt 120) { throw "only $($m.Groups[2].Value) command(s) executed -- a clean result means nothing" }
          if ([int]$m.Groups[3].Value -lt 6)   { throw "only $($m.Groups[3].Value) skipped -- the mutating lines must still be recognised and refused" }
          foreach ($must in @('the RunOnce resume key', 'the INIT 9 connectivity probe', 'the INIT 10 self-update check')) {
            if ($out -notmatch [regex]::Escape($must)) { throw ("probe did not declare the expected skip: {0}" -f $must) }
          }
          .\tools\report_command_probe.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'report_command_probe self-test did not fail on its mutations' }
          Write-Host "report_command_probe.ps1 OK"

      # A MANAGED MACHINE MUST NOT READ CLEAN WHEN NOTHING RAN. Every helper and
      # staged block runs as `powershell -ExecutionPolicy Bypass -File`, and an
      # execution policy set by Group Policy OVERRIDES Bypass: each helper is
      # refused, writes no marker, and no marker reads OK. The registry value
      # below is how Group Policy stores MachinePolicy. Both bats must stop at
      # the probe with exit 1 and print the evidence, and never reach a section.
      # Touches: registry HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell
      # (EnableScripts, ExecutionPolicy) -- restored in finally, and by the cmd
      # step after this one if the finally never ran (a PowerShell step would
      # itself be refused while the plant stands).
      - name: "GPO execution policy AllSigned: the audit declares itself blind, never CLEAN"
        shell: powershell
        # Both bats stop at INIT; minutes, not the job budget. The first push hung
        # here for 13 minutes: the blocked path fell through to `start notepad`,
        # which inherited this step's output pipe.
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          $k = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell'
          $sentinel = Join-Path $env:RUNNER_TEMP 'dz_ci_gpo_planted.txt'
          $had = Test-Path -LiteralPath $k
          $prior = $null
          if ($had) { $prior = Get-ItemProperty -LiteralPath $k -EA SilentlyContinue }
          $probe = Join-Path $env:TEMP 'dz_ci_gpo_probe.ps1'
          Set-Content -LiteralPath $probe -Value "'DZ_RAN'" -Encoding ASCII
          try {
            New-Item -Path $k -Force | Out-Null
            Set-Content -LiteralPath $sentinel -Value 'planted' -Encoding ASCII
            Set-ItemProperty -LiteralPath $k -Name EnableScripts -Value 1 -Type DWord
            Set-ItemProperty -LiteralPath $k -Name ExecutionPolicy -Value 'AllSigned' -Type String
            $ErrorActionPreference = 'Continue'
            $r = (& powershell -NoProfile -ExecutionPolicy Bypass -File $probe 2>&1 | Out-String)
            if ($r -match 'DZ_RAN') { Write-Host '[ SKIP ] the Group Policy execution policy did not take on this runner (a -File script still ran with Bypass) -- the guard is NOT exercised here'; $global:LASTEXITCODE = 0; return }
            Write-Host 'plant confirmed: powershell -ExecutionPolicy Bypass -File is refused under MachinePolicy AllSigned'
            foreach ($run in @(@{ Bat = 'doze_sec.bat'; Args = '-dev -readonly -noConsoleLog' }, @{ Bat = 'doze_sec_noAdmin.bat'; Args = '-dev -readonly -noAdmin -noConsoleLog' })) {
              $t0 = Get-Date
              $con = (& cmd /c ('{0} {1}' -f $run.Bat, $run.Args) 2>&1 | ForEach-Object { "$_" }) -join "`n"
              $rc = $LASTEXITCODE
              $rep = @(Get-ChildItem 'C:\SecurityAudit\SecurityReport_*.txt', (Join-Path $env:USERPROFILE 'SecurityAudit\SecurityReport_*.txt') -EA SilentlyContinue |
                       Where-Object { $_.LastWriteTime -ge $t0 } | Sort-Object LastWriteTime -Descending) | Select-Object -First 1
              if (-not $rep) { Write-Host $con; throw ("{0}: no report written -- the refusal must be declared in a report, not only on the console" -f $run.Bat) }
              $text = [IO.File]::ReadAllText($rep.FullName)
              Write-Host ("--- {0} (exit {1}) ---" -f $run.Bat, $rc)
              Write-Host (($text -split "`r?`n" | Where-Object { $_ -match 'AUDIT NOT PERFORMED|PowerShell refused|MachinePolicy|LanguageMode =|STATUS:' }) -join "`n")
              if ($rc -ne 1) { throw ("{0}: exit {1}, expected 1 -- a blind run must not exit as a completed audit" -f $run.Bat, $rc) }
              if ($text -notmatch "\*\*\* AUDIT NOT PERFORMED -- PowerShell will not run this audit's helper scripts") { throw ("{0}: no AUDIT NOT PERFORMED banner" -f $run.Bat) }
              if ($text -notmatch 'MachinePolicy = AllSigned') { throw ("{0}: the evidence (Get-ExecutionPolicy -List) is missing from the report" -f $run.Bat) }
              if ($text -match '\[SECTION \d+/18 RESULT') { throw ("{0}: the audit reached a section verdict while its helpers were refused" -f $run.Bat) }
              if ($text -match 'CLEAN -- no issues detected') { throw ("{0}: a section read CLEAN on a run that could not run its checks" -f $run.Bat) }
              if ($text -notmatch 'STATUS: Nothing was audited') { throw ("{0}: the STATUS line does not say nothing was audited" -f $run.Bat) }
            }
            Write-Host 'both bats refuse to run blind under a Group Policy execution policy, and say why'
          } finally {
            if ($had) {
              foreach ($n in 'EnableScripts', 'ExecutionPolicy') {
                if ($prior -and ($prior.PSObject.Properties.Name -contains $n)) { Set-ItemProperty -LiteralPath $k -Name $n -Value $prior.$n }
                else { Remove-ItemProperty -LiteralPath $k -Name $n -EA SilentlyContinue }
              }
            } else { Remove-Item -LiteralPath $k -Recurse -Force -EA SilentlyContinue }
            Remove-Item -LiteralPath $sentinel, $probe -Force -EA SilentlyContinue
          }
          # The runner's PowerShell wrapper exits with $LASTEXITCODE, and the last
          # bat run returned 1 ON PURPOSE -- that is the assertion above passing.
          exit 0

      - name: Remove the planted execution policy if the step above did not (cmd, not PowerShell)
        if: always()
        shell: cmd
        run: |
          if exist "%RUNNER_TEMP%\dz_ci_gpo_planted.txt" (
            reg delete "HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell" /v ExecutionPolicy /f
            reg delete "HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell" /v EnableScripts /f
            del "%RUNNER_TEMP%\dz_ci_gpo_planted.txt"
          )
          exit /b 0

      # A Group Policy RemoteSigned or Unrestricted policy lets an UNMARKED
      # script run, which is all exec_probe used to prove about itself. A copy
      # unzipped from a download carries the Mark of the Web on its files:
      # RemoteSigned refuses each marked helper (it writes no marker, so its
      # check read OK), and Unrestricted stops to ask about each one where
      # nobody sees the question -- the audit hung. Microsoft:
      # about_Execution_Policies. This step first ASKS WINDOWS which marks each
      # policy treats as downloaded, so the probe's rule is pinned to the
      # answer rather than to a reading of the documentation, then marks
      # helpers on a COPY of the checkout and requires both bats to stop and
      # name them, and a fully marked copy to stop rather than hang.
      # Touches: registry HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell
      # (EnableScripts, ExecutionPolicy) -- restored in finally, and by the cmd
      # step after this one; Zone.Identifier streams on the copy only, which is
      # deleted with them.
      - name: "GPO RemoteSigned and Unrestricted with the Mark of the Web: the audit names the marked helpers and stops, and never hangs at a hidden prompt"
        shell: powershell
        timeout-minutes: 10
        run: |
          . .\.github\ci\gpo_policy_motw.ps1
          exit $LASTEXITCODE

      - name: Remove the planted Mark of the Web policy if the step above did not (cmd, not PowerShell)
        if: always()
        shell: cmd
        run: |
          if exist "%RUNNER_TEMP%\dz_ci_motw_planted.txt" (
            reg delete "HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell" /v ExecutionPolicy /f
            reg delete "HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell" /v EnableScripts /f
            del "%RUNNER_TEMP%\dz_ci_motw_planted.txt"
          )
          exit /b 0

      # AppLocker / WDAC run PowerShell in ConstrainedLanguage, where Add-Type
      # and most .NET types throw inside the checks. The machine-level
      # __PSLockdownPolicy=4 variable forces that mode for new PowerShell
      # processes; whether Windows PowerShell 5.1 on this image honours it is
      # checked first and the step declares a [ SKIP ] if it does not.
      # Touches: machine environment variable __PSLockdownPolicy -- removed in
      # finally, and by the cmd step after this one.
      - name: "ConstrainedLanguage lockdown: field_test and both bats refuse to run blind"
        shell: powershell
        # Both bats stop at INIT; minutes, not the job budget. The first push hung
        # here for 13 minutes: the blocked path fell through to `start notepad`,
        # which inherited this step's output pipe.
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          $sentinel = Join-Path $env:RUNNER_TEMP 'dz_ci_clm_planted.txt'
          try {
            Set-Content -LiteralPath $sentinel -Value 'planted' -Encoding ASCII
            [Environment]::SetEnvironmentVariable('__PSLockdownPolicy', '4', 'Machine')
            $ErrorActionPreference = 'Continue'
            $mode = (& powershell -NoProfile -Command '$ExecutionContext.SessionState.LanguageMode' 2>&1 | Out-String).Trim()
            if ($mode -ne 'ConstrainedLanguage') { Write-Host ("[ SKIP ] __PSLockdownPolicy=4 did not engage ConstrainedLanguage on this runner (a new process reports '{0}') -- the CLM path is proven only by exec_probe's state vocabulary and field_test's mode check" -f $mode); $global:LASTEXITCODE = 0; return }
            Write-Host 'plant confirmed: a new PowerShell process runs in ConstrainedLanguage'
            $ft = (& powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\field_test.ps1 -BatPath .\doze_sec.bat -NoConsoleLog 2>&1 | ForEach-Object { "$_" }) -join "`n"
            $ftRc = $LASTEXITCODE
            Write-Host $ft
            if ($ftRc -ne 1) { throw ("field_test exited {0} under ConstrainedLanguage, expected 1" -f $ftRc) }
            if ($ft -notmatch '\[FAIL\] PowerShell runs in ConstrainedLanguage mode on this machine') { throw 'field_test did not name the language lockdown' }
            foreach ($run in @(@{ Bat = 'doze_sec.bat'; Args = '-dev -readonly -noConsoleLog' }, @{ Bat = 'doze_sec_noAdmin.bat'; Args = '-dev -readonly -noAdmin -noConsoleLog' })) {
              $t0 = Get-Date
              $con = (& cmd /c ('{0} {1}' -f $run.Bat, $run.Args) 2>&1 | ForEach-Object { "$_" }) -join "`n"
              $rc = $LASTEXITCODE
              $rep = @(Get-ChildItem 'C:\SecurityAudit\SecurityReport_*.txt', (Join-Path $env:USERPROFILE 'SecurityAudit\SecurityReport_*.txt') -EA SilentlyContinue |
                       Where-Object { $_.LastWriteTime -ge $t0 } | Sort-Object LastWriteTime -Descending) | Select-Object -First 1
              if (-not $rep) { Write-Host $con; throw ("{0}: no report written under ConstrainedLanguage" -f $run.Bat) }
              $text = [IO.File]::ReadAllText($rep.FullName)
              Write-Host ("--- {0} (exit {1}) ---" -f $run.Bat, $rc)
              Write-Host (($text -split "`r?`n" | Where-Object { $_ -match 'AUDIT NOT PERFORMED|Scripts run here|LanguageMode =|STATUS:' }) -join "`n")
              if ($rc -ne 1) { throw ("{0}: exit {1} under ConstrainedLanguage, expected 1" -f $run.Bat, $rc) }
              if ($text -notmatch 'Scripts run here, but in ConstrainedLanguage mode') { throw ("{0}: the language lockdown was not named" -f $run.Bat) }
              if ($text -match '\[SECTION \d+/18 RESULT') { throw ("{0}: the audit reached a section verdict under ConstrainedLanguage" -f $run.Bat) }
            }
            Write-Host 'field_test and both bats refuse to run blind under ConstrainedLanguage, and say why'
          } finally {
            [Environment]::SetEnvironmentVariable('__PSLockdownPolicy', $null, 'Machine')
            Remove-Item -LiteralPath $sentinel -Force -EA SilentlyContinue
          }
          # As above: the expected exit 1 of the last run is not the step's result.
          exit 0

      - name: Remove the planted language lockdown if the step above did not (cmd, not PowerShell)
        if: always()
        shell: cmd
        run: |
          if exist "%RUNNER_TEMP%\dz_ci_clm_planted.txt" (
            reg delete "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" /v __PSLockdownPolicy /f
            del "%RUNNER_TEMP%\dz_ci_clm_planted.txt"
          )
          exit /b 0

      - name: Upload the audit artifacts for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readonly-field-test-output
          path: C:\SecurityAudit\**
          if-no-files-found: ignore

  # Detection-regression harness. full-run above proves the audit COMPLETES;
  # this proves it DETECTS. It plants known-bad artifacts (WDigest=1, a HOSTS
  # hijack, a Run-key backdoor, an IFEO Debugger on notepad, an enabled Guest
  # account), runs the audit, and asserts the report flags them. Every case is
  # "required": a regression fails the job. (The "pending" tier this comment
  # used to describe is empty -- every gap the original code review found was
  # promoted on 2026-07-18 -- so nothing here is exempt from failing.)
  #
  # A plant that FAILS also fails the job unless the case declares MaySkip with
  # a reason. A silently skipped case is a detection that stopped being tested,
  # and a green job would then mean "checked nothing here" while looking
  # identical to "checked and fine".
  #
  # Every artifact is removed in a finally block.
  detection-selftest:
    name: "detection regression harness (plant known-bad -> assert verdict)"
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Plant indicators, run the audit, assert detections, clean up
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\detection_selftest.ps1 -BatPath .\doze_sec.bat
          exit $LASTEXITCODE

      # A field test on a WSL machine got a credential-capture WARNING for
      # Microsoft's own P9NP provider (p9np.dll): the netprov branch upgraded
      # Microsoft-signed-System32 verdicts to WARNING to keep a pre-WSL
      # three-name allowlist authoritative. Pin the fix: a provider whose DLL
      # is a Microsoft-signed System32 binary must be [INFO] with no marker.
      # (The true-positive side is already pinned by detection_selftest.ps1,
      # which plants dz_selftest_np with a staging-path DLL and requires the
      # CRITICAL.) Testable at all only because this PR gave the tool a
      # -MarkerDir parameter.
      - name: "Network provider: Microsoft-signed System32 provider is context, not a finding"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $npOrder = 'HKLM:\SYSTEM\CurrentControlSet\Control\NetworkProvider\Order'
          $prev = (Get-ItemProperty -Path $npOrder -Name ProviderOrder).ProviderOrder
          $svc = 'HKLM:\SYSTEM\CurrentControlSet\Services\dz_ci_msnp\NetworkProvider'
          $md = Join-Path $env:TEMP ("dz_np_ci_{0}" -f $PID)
          try {
            Set-ItemProperty -Path $npOrder -Name ProviderOrder -Value ($prev + ',dz_ci_msnp')
            New-Item -Path $svc -Force | Out-Null
            Set-ItemProperty -Path $svc -Name ProviderPath -Value 'C:\Windows\System32\ntlanman.dll'
            $out = (.\tools\logon_persistence.ps1 -MarkerDir $md) -join "`n"
            if (-not $out) { throw 'logon_persistence produced no output -- nothing was tested' }
            $npLines = ($out -split "`n" | Where-Object { $_ -match 'dz_ci_msnp' }) -join "`n"
            Write-Host $npLines
            if ($npLines -notmatch '\[INFO\]') { throw 'a Microsoft-signed System32 provider was not reported as INFO (the WSL/P9NP false positive)' }
            if ($npLines -match '\[WARNING\]|\[CRITICAL\]') { throw 'a Microsoft-signed System32 provider was flagged as a finding' }
            if (Test-Path (Join-Path $md 'dz_logon_netprov.txt')) { throw 'a Microsoft-signed System32 provider raised the netprov marker' }
            Write-Host 'Microsoft-signed provider correctly reported as context'
          } finally {
            Set-ItemProperty -Path $npOrder -Name ProviderOrder -Value $prev
            Remove-Item 'HKLM:\SYSTEM\CurrentControlSet\Services\dz_ci_msnp' -Recurse -Force -EA SilentlyContinue
            Remove-Item $md -Recurse -Force -EA SilentlyContinue
          }

      # A real machine's report (field test, 2026-08-30) flagged "System event
      # log was cleared" off a smart-card-reader driver's Event 104: event IDs
      # are unique only PER PROVIDER, and the query matched the bare ID. This
      # pins the provider-filtered query in BOTH directions, and tests the
      # SHIPPED fragment extracted from doze_sec.bat -- not a copy that can
      # drift. Runs after the main harness because direction (b) clears this
      # ephemeral runner's System log.
      - name: "Event 104 provider filter: benign 104 stays quiet, a real clear fires; a real Security-log clear is CRITICAL"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The 1102/104 queries live in tools\log_clear_check.ps1 now; both bats
          # call it and carry no inline query of their own.
          foreach ($bat in '.\doze_sec.bat','.\doze_sec_noAdmin.bat') {
            if (-not (Select-String -Path $bat -SimpleMatch 'tools\log_clear_check.ps1' -Quiet)) { throw "$bat does not run tools\log_clear_check.ps1" }
            if (Select-String -Path $bat -Pattern "Id=(1102|104);ProviderName" -Quiet) { throw "$bat still carries an inline 1102/104 query (a second measurement)" }
          }
          $src = Get-Content -Raw .\tools\log_clear_check.ps1
          $prov = ([regex]::Match($src, "ProviderName = '([^']+)'")).Groups[1].Value
          if ($prov -ne 'Microsoft-Windows-Eventlog') { throw "log_clear_check lost its provider filter (found '$prov')" }
          $md = Join-Path $env:TEMP 'dz_ci_logclear'
          Remove-Item $md -Recurse -Force -EA SilentlyContinue
          New-Item -ItemType Directory -Path $md | Out-Null

          # (a) FALSE-POSITIVE direction -- the field report's exact shape: a
          # non-eventlog provider's Event 104 in the System log must not be
          # what the check matches. The runner image already carries a genuine
          # Microsoft-Windows-Eventlog 104, so the discriminating PROPERTY is
          # tested: the bare-ID query (the field bug) matches the planted
          # benign event, and the shipped provider-filtered query excludes it.
          if (-not [System.Diagnostics.EventLog]::SourceExists('dz_ci_benign104')) {
            New-EventLog -LogName System -Source dz_ci_benign104
          }
          Write-EventLog -LogName System -Source dz_ci_benign104 -EventId 104 -EntryType Information -Message 'benign 104: smart-card-reader-shaped noise, not a log clear'
          Start-Sleep -Seconds 2
          $bare = @(Get-WinEvent -FilterHashtable @{LogName='System';Id=104} -EA SilentlyContinue | Where-Object { $_.ProviderName -eq 'dz_ci_benign104' })
          if ($bare.Count -lt 1) { throw 'benign 104 did not land in the System log -- direction (a) could not be tested (this is a failure, not a skip)' }
          $filtered = @(Get-WinEvent -FilterHashtable @{LogName='System';Id=104;ProviderName=$prov} -EA SilentlyContinue)
          $leak = @($filtered | Where-Object { $_.ProviderName -ne $prov })
          if ($leak.Count -gt 0) { throw ("the shipped provider filter let {0} non-{1} event(s) through" -f $leak.Count, $prov) }
          Write-Host ("direction (a): shipped filter ({0}) returns {1} event(s), zero from the benign source -- discrimination PASS" -f $prov, $filtered.Count)

          # (b) TRUE-POSITIVE direction: actually clear this ephemeral runner's
          # System log. The clear writes a 104 from Microsoft-Windows-Eventlog
          # under THIS computer's name -- so it is also the real-record proof
          # that a clear made in this machine's own life is not called image
          # preparation.
          wevtutil cl System
          Start-Sleep -Seconds 3
          $out2 = (& .\tools\log_clear_check.ps1 -MarkerDir $md) -join "`n"
          Write-Host $out2
          if ($out2 -match 'Exception|is not recognized|CategoryInfo') { throw "PowerShell error text in the output: $out2" }
          if ($out2 -notmatch '(?m)^\[WARNING\] System event log was cleared at ') { throw 'a genuinely cleared System log was NOT detected' }
          if ($out2 -match 'System event log was cleared at [^\r\n]*before this PC took its current name') { throw 'a clear made under this runner''s own name was called image preparation' }
          if (-not (Test-Path (Join-Path $md 'dz_logclear104.txt'))) { throw 'cleared-log WARNING wrote no marker -- the finding would never reach the ledger' }
          if ((Get-Content (Join-Path $md 'dz_logclear_state.txt')) -notmatch 'sys=cleared') { throw 'the state line does not say the System log was cleared' }

          # (c) PINNED, not branched on: clear this ephemeral runner's SECURITY
          # log (the last step of this job; nothing after it reads that log).
          # The 1102 is written under the runner's own name, after its install
          # date, so the verdict must be CRITICAL -- whatever the image held
          # before. A run that reads it as image preparation is the false
          # reassurance this rule exists to avoid.
          # Touches: eventlog:System, eventlog:Security (both cleared; CI runner only).
          Remove-Item (Join-Path $md 'dz_logclear*.txt') -Force -EA SilentlyContinue
          wevtutil cl Security
          Start-Sleep -Seconds 3
          $out3 = (& .\tools\log_clear_check.ps1 -MarkerDir $md) -join "`n"
          Write-Host $out3
          if ($out3 -match 'Exception|is not recognized|CategoryInfo') { throw "PowerShell error text in the output: $out3" }
          if ($out3 -notmatch '(?m)^\[CRITICAL\] Security event log was CLEARED at ') { throw 'a Security log cleared under the runner''s own name was NOT graded CRITICAL' }
          if ($out3 -match 'before this PC took its current name') { throw 'a Security log cleared under the runner''s own name was called image preparation' }
          if ((Get-Content (Join-Path $md 'dz_logclear.txt') -EA SilentlyContinue) -ne 'CRITICAL') { throw 'the CRITICAL clear wrote no CRITICAL marker -- it would never reach the ledger' }
          if ((Get-Content (Join-Path $md 'dz_logclear_state.txt')) -notmatch '^sec=critical,') { throw 'the state line does not say sec=critical' }
          Remove-Item $md -Recurse -Force -EA SilentlyContinue
          Write-Host 'ev104: benign-source discrimination PASS; genuine-clear detection PASS; a clear under the runner''s own name is not called image preparation; a real Security-log clear is CRITICAL'

      - name: Upload the selftest audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-selftest-output
          path: C:\SecurityAudit\**
          if-no-files-found: ignore

  # The same plant/assert harness against doze_sec_noAdmin.bat, elevated.
  # Elevated, the adaptive bat sets IS_ADMIN=1 and runs its full path, so every
  # detection, section verdict, and Option B consistency assertion must hold
  # exactly as they do for doze_sec.bat -- this is the mirror-parity check the
  # design memo (section 7) called out as missing.
  detection-selftest-noadmin:
    name: "detection regression harness (doze_sec_noAdmin.bat, elevated adaptive path)"
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Plant indicators, run the noAdmin bat elevated, assert detections
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\detection_selftest.ps1 -BatPath .\doze_sec_noAdmin.bat
          exit $LASTEXITCODE

      - name: Upload the selftest audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-selftest-noadmin-output
          path: C:\SecurityAudit\**
          if-no-files-found: ignore

  # The path CI never executed before: doze_sec_noAdmin.bat as a REAL standard
  # user (created on the runner, launched via Start-Process -Credential).
  # Asserts the non-admin contract: report says Admin : 0, sections defer with
  # PARTIAL verdicts, a planted HKLM CRITICAL is still detected without admin,
  # exit codes 6/8 honor their semantics, and the Option B ledger consistency
  # net holds under deferral. See tests/noadmin_smoke.ps1.
  noadmin-true-run:
    name: "doze_sec_noAdmin.bat as a real standard user (deferral contract)"
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Create standard user, run the audit twice, assert the contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\noadmin_smoke.ps1 -BatPath .\doze_sec_noAdmin.bat
          exit $LASTEXITCODE

      - name: Upload the non-admin audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noadmin-smoke-output
          path: noadmin-smoke-output\*
          if-no-files-found: ignore
