name: windows-smoke

# Real-Windows smoke tests. The lint workflow runs on Linux/pwsh and the
# author develops on Linux, so neither can exercise cmd.exe end-to-end,
# Windows PowerShell 5.1 runtime behavior, real WMI/CIM, findstr, or detect
# a runtime HANG. These jobs close that gap by running on a genuine Windows
# runner (Windows Server 2022 + built-in Windows PowerShell 5.1).
#
# Job 1 (helpers-ps51): parses every tools/*.ps1 with the 5.1 language parser
# and executes the read-only ones against real WMI/CIM/scheduled-tasks/
# Authenticode/Get-FileHash -- catching 5.1-only and WMI issues a Linux/pwsh
# box cannot see. Includes a 20,000-char-line select_lines.ps1 case (the
# exact shape that hangs findstr).
#
# Job 2 (full-run): runs doze_sec.bat end-to-end under a hard timeout. A hang
# (e.g. the Section 4 findstr-on-long-lines regression) makes the job exceed
# its timeout and FAIL, instead of silently shipping. -dev bypasses the
# Server-edition OS gate; -sdu/-nosrp skip the network threat-list pull and
# the restore point.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  helpers-ps51:
    name: "tools/*.ps1 on Windows PowerShell 5.1 (real WMI/CIM)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Note: every step ends with `exit 0`. The helpers legitimately return a
      # non-zero exit code (e.g. select_lines.ps1 returns 1 for "no match",
      # mirroring findstr); GitHub's powershell shell would otherwise propagate
      # that leaked $LASTEXITCODE as a step failure. Assertion failures still
      # `exit 1` before reaching the final `exit 0`, and ErrorActionPreference
      # = Stop fails the step on any thrown error.
      - name: Parse every helper with the Windows PowerShell 5.1 parser
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          Get-ChildItem tools\*.ps1, tests\*.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $bad += "$($_.Name): $($errs[0].Message)" }
          }
          if ($bad) { $bad | ForEach-Object { Write-Host "PARSE ERROR  $_" }; exit 1 }
          Write-Host "All tools/*.ps1 + tests/*.ps1 parse clean under Windows PowerShell $($PSVersionTable.PSVersion)"
          exit 0

      - name: scheduled_tasks_full.ps1 (real Get-ScheduledTask + Authenticode)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($m in 'Inventory','Suspicious','System') {
            .\tools\scheduled_tasks_full.ps1 -Mode $m | Out-Null
            if ($LASTEXITCODE -gt 1) { Write-Host "scheduled_tasks_full -Mode $m exit $LASTEXITCODE"; exit 1 }
          }
          Write-Host "scheduled_tasks_full OK (all three modes)"
          exit 0

      - name: browser_extensions.ps1 (real profile enumeration)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\browser_extensions.ps1 | Out-Null
          Write-Host "browser_extensions OK"
          exit 0

      - name: select_lines.ps1 incl. a 20,000-char line (findstr would hang)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $f = Join-Path $env:TEMP 'dz_ci_proc.tmp'
          'brave.exe  1  C:\Users\x\AppData\Local\BraveSoftware\Brave-Browser\Application\brave.exe' | Set-Content $f
          ('giant.exe  2  C:\Windows\giant.exe ' + ('x' * 20000)) | Add-Content $f
          'mshta.exe  3  C:\Windows\System32\mshta.exe' | Add-Content $f
          .\tools\select_lines.ps1 -Path $f "\AppData\" | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "expected AppData match (exit 0), got $LASTEXITCODE"; exit 1 }
          .\tools\select_lines.ps1 -Path $f "ScreenConnect" "AnyDesk" | Out-Null
          if ($LASTEXITCODE -ne 1) { Write-Host "expected no RMM match (exit 1), got $LASTEXITCODE"; exit 1 }
          Write-Host "select_lines OK (matched through a 20KB line, no hang)"
          exit 0

      - name: top_findings.ps1 + report_format.ps1 on a sample report
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Join-Path $env:TEMP 'dz_ci_report.txt'
          $lines = @(
            '===================================================================='
            ' [6/18] SCHEDULED TASKS'
            '===================================================================='
            '--- CRITICAL: Tasks with Actions in Suspicious Paths ---'
            '[CRITICAL] 1 scheduled task(s) with actions in suspicious locations: EvilTask'
            '===================================================================='
            ' [1/18] SYSTEM IDENTITY AND PATCH LEVEL'
            '===================================================================='
            '[OK] placeholder line'
          )
          $lines | Set-Content -LiteralPath $r -Encoding UTF8
          .\tools\top_findings.ps1 -Report $r
          if (-not (Select-String -LiteralPath $r -Pattern 'TOP FINDINGS' -Quiet)) { Write-Host "top_findings did not prepend its block"; exit 1 }
          .\tools\report_format.ps1 -Report $r | Out-Null
          Write-Host "top_findings + report_format OK"
          exit 0

      - name: report_html.ps1 surfaces a Findings Index with section links
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Join-Path $env:TEMP 'dz_ci_html_report.txt'
          $h = Join-Path $env:TEMP 'dz_ci_html_report.html'
          $lines = @(
            '===================================================================='
            ' [18/18] CTI-DRIVEN IOC SWEEP'
            '===================================================================='
            '[CRITICAL] Known malware staging files found: C:\x\evil.exe'
            '######################################################################'
            '##  SECURITY AUDIT SUMMARY  --  CITEST'
            '##  ACTION REQUIRED  --  1 CRITICAL  /  2 WARNING  /  5 PASSED'
            '######################################################################'
            '  --- CTI IOC SWEEP  (Section 18 - SENTINEL-X) -----------------------'
            '  [!! CRITICAL !!]  CTI IOC sweep: 1 category matches found'
            '                     Fix: Review Section 18 for specific IOC matches.'
            '  --- SYSTEM HARDENING  (Section 13) ---------------------------------'
            '  [  WARNING   ]  BitLocker OFF for C:'
            '  [    OK      ]  UAC on with prompt'
            '  NEXT STEPS -- CRITICAL issues found:'
          )
          $lines | Set-Content -LiteralPath $r -Encoding UTF8
          .\tools\report_html.ps1 -Report $r -HtmlPath $h
          if (-not (Test-Path $h)) { Write-Host 'report_html produced no HTML'; exit 1 }
          $html = Get-Content -LiteralPath $h -Raw
          if ($html -notmatch 'Findings Index') { Write-Host 'no Findings Index panel'; exit 1 }
          if ($html -notmatch 'CTI IOC sweep: 1 category matches found') { Write-Host 'critical finding not surfaced'; exit 1 }
          if ($html -notmatch 'href="#sec18"') { Write-Host 'critical not linked to its section'; exit 1 }
          if ($html -notmatch '<div class="card card-crit"><h3>1</h3>') { Write-Host 'dashboard crit count not taken from verdict line'; exit 1 }
          Write-Host 'report_html OK (Findings Index, section link, verdict-based counts)'
          exit 0

      - name: ioc_hash_check.ps1 (real Get-FileHash, capped)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\ioc_hash_check.ps1 -IocFile ThreatLists\ioc_hashes.txt -MaxFiles 3 | Out-Null
          Write-Host "ioc_hash_check OK"
          exit 0

      - name: startup_eval.ps1 (Startup folder + AppCert DLL evaluation)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $md = Join-Path $env:TEMP ("dz_se_ci_{0}" -f $PID)
          New-Item -ItemType Directory -Path $md -Force | Out-Null
          # Clean runner: must produce no CRITICAL and write no marker.
          # NB: -match/-notmatch on an ARRAY are FILTERS, not booleans. Join to
          # a single string before testing, or `-notmatch` returns every
          # non-matching line (truthy) and the check always fires.
          $out = (.\tools\startup_eval.ps1 -MarkerDir $md) -join "`n"
          Write-Host $out
          if ($out -match '\[CRITICAL\]') { throw "startup_eval flagged CRITICAL on a clean runner (false positive)" }
          if (Test-Path (Join-Path $md 'dz_startup_folder.txt')) {
            throw ("startup marker written on a clean runner: {0}" -f (Get-Content (Join-Path $md 'dz_startup_folder.txt')))
          }
          if (Test-Path (Join-Path $md 'dz_appcert.txt')) {
            throw ("appcert marker written on a clean runner: {0}" -f (Get-Content (Join-Path $md 'dz_appcert.txt')))
          }
          # Plant an AppCert DLL pointing at a missing staging-path file: must
          # be CRITICAL and must write the marker.
          $ac = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\AppCertDlls'
          if (-not (Test-Path $ac)) { New-Item -Path $ac -Force | Out-Null }
          Set-ItemProperty -Path $ac -Name 'dz_ci_probe' -Value 'C:\Windows\Temp\dz_ci_probe.dll' -Force
          try {
            $out2 = (.\tools\startup_eval.ps1 -MarkerDir $md) -join "`n"
            if ($out2 -notmatch 'dz_ci_probe') { throw "planted AppCert DLL not reported" }
            $m = Join-Path $md 'dz_appcert.txt'
            if (-not (Test-Path $m)) { throw "planted AppCert DLL wrote no marker" }
            if ((Get-Content $m).Trim() -ne 'CRITICAL') { throw ("expected CRITICAL marker, got {0}" -f (Get-Content $m)) }
          } finally {
            Remove-ItemProperty -Path $ac -Name 'dz_ci_probe' -EA SilentlyContinue
            Remove-Item $md -Recurse -Force -EA SilentlyContinue
          }
          Write-Host "startup_eval.ps1 OK"
          exit 0

      - name: ledger.ps1 (finding-record append / summarize / section contract)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $L = Join-Path $env:TEMP ("dz_ledger_ci_{0}.txt" -f $PID)
          Remove-Item $L -Force -EA SilentlyContinue
          .\tools\ledger.ps1 -Mode Append -Path $L -Severity WARNING  -Section 9  -Code T1562.001 -Message 'ASR rules not in Block mode'
          .\tools\ledger.ps1 -Mode Append -Path $L -Severity CRITICAL -Section 13 -Message 'IFEO hijack on sethc.exe'
          .\tools\ledger.ps1 -Mode Append -Path $L -Severity WARNING  -Section 9  -Message 'second Section 9 finding'
          $sum = .\tools\ledger.ps1 -Mode Summarize -Path $L
          # NB: loop var must not be $l -- PowerShell variable names are
          # case-insensitive, so $l would clobber the ledger path $L.
          $h = @{}; foreach ($line in $sum) { if ($line -match '^(\w+)=(.+)$') { $h[$Matches[1]] = $Matches[2] } }
          if ($h.TOTAL    -ne '3')        { throw "TOTAL expected 3, got $($h.TOTAL)" }
          if ($h.CRITICAL -ne '1')        { throw "CRITICAL expected 1, got $($h.CRITICAL)" }
          if ($h.WARNING  -ne '2')        { throw "WARNING expected 2, got $($h.WARNING)" }
          if ($h.MAXSEV   -ne 'CRITICAL') { throw "MAXSEV expected CRITICAL, got $($h.MAXSEV)" }
          $s9 = "$(.\tools\ledger.ps1 -Mode Section -Path $L -Section 9)".Trim()
          if ($s9 -ne '2') { throw "Section 9 count expected 2, got $s9" }
          $s99 = "$(.\tools\ledger.ps1 -Mode Section -Path $L -Section 99)".Trim()
          if ($s99 -ne '0') { throw "Section 99 count expected 0, got $s99" }
          # Separator/newline injection in a message must not corrupt the record.
          .\tools\ledger.ps1 -Mode Append -Path $L -Severity WARNING -Section 8 -Message 'pipe|inside|the message'
          $s8 = "$(.\tools\ledger.ps1 -Mode Section -Path $L -Section 8)".Trim()
          if ($s8 -ne '1') { throw "Section 8 count expected 1 after pipe-injection, got $s8" }
          Remove-Item $L -Force -EA SilentlyContinue
          Write-Host "ledger.ps1 OK"
          exit 0

      - name: persistence_extra.ps1 (netsh / print / BITS / profile / time-provider)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $md = Join-Path $env:TEMP ("dz_pe_ci_{0}" -f $PID)
          New-Item -ItemType Directory -Path $md -Force | Out-Null
          $markers = @('dz_netsh.txt','dz_printproc.txt','dz_portmon.txt','dz_bits.txt','dz_psprofile.txt','dz_timeprov.txt')
          # Clean runner: a stock Windows image registers netsh helpers, print
          # processors, port monitors and time providers, and they are all
          # Microsoft-signed -- so any CRITICAL here is a false positive in the
          # signature gate, which is exactly the risk this check exists to catch.
          # NB: -match on an ARRAY is a FILTER, not a boolean -- join first.
          $out = (.\tools\persistence_extra.ps1 -MarkerDir $md) -join "`n"
          Write-Host $out
          if ($out -match '\[CRITICAL\]') { throw "persistence_extra flagged CRITICAL on a clean runner (false positive)" }
          foreach ($m in $markers) {
            if (Test-Path (Join-Path $md $m)) { throw ("{0} written on a clean runner: {1}" -f $m, (Get-Content (Join-Path $md $m))) }
          }
          # The detection harness plants the time-provider and PowerShell-profile
          # vectors end-to-end (proving the bat marker wiring). The three print/
          # netsh vectors are planted HERE instead: a bogus netsh helper makes
          # netsh.exe emit load errors, which would contaminate the firewall and
          # portproxy cases in the full-audit harness. Isolated per-vector plants
          # keep that blast radius inside this step.
          $netsh = 'HKLM:\SOFTWARE\Microsoft\Netsh'
          $mon   = 'HKLM:\SYSTEM\CurrentControlSet\Control\Print\Monitors\dz_ci_probe'
          $pproc = 'HKLM:\SYSTEM\CurrentControlSet\Control\Print\Environments\Windows x64\Print Processors\dz_ci_probe'
          try {
            Set-ItemProperty -Path $netsh -Name 'dz_ci_probe' -Value 'dz_ci_probe_missing.dll' -Force
            New-Item -Path $mon -Force | Out-Null
            Set-ItemProperty -Path $mon -Name 'Driver' -Value 'dz_ci_probe_missing.dll' -Force
            New-Item -Path $pproc -Force | Out-Null
            Set-ItemProperty -Path $pproc -Name 'Driver' -Value 'dz_ci_probe_missing.dll' -Force
            $out2 = (.\tools\persistence_extra.ps1 -MarkerDir $md) -join "`n"
            Write-Host $out2
            foreach ($pair in @(
              @{ Rx = "Netsh helper 'dz_ci_probe'";    Marker = 'dz_netsh.txt' },
              @{ Rx = "Port monitor 'dz_ci_probe'";    Marker = 'dz_portmon.txt' },
              @{ Rx = "Print processor 'dz_ci_probe'"; Marker = 'dz_printproc.txt' }
            )) {
              if ($out2 -notmatch [regex]::Escape($pair.Rx)) { throw ("planted vector not reported: {0}" -f $pair.Rx) }
              $mp = Join-Path $md $pair.Marker
              if (-not (Test-Path $mp)) { throw ("planted vector wrote no marker: {0}" -f $pair.Marker) }
              if ((Get-Content $mp).Trim() -ne 'CRITICAL') { throw ("{0}: expected CRITICAL, got {1}" -f $pair.Marker, (Get-Content $mp)) }
            }
          } finally {
            Remove-ItemProperty -Path $netsh -Name 'dz_ci_probe' -EA SilentlyContinue
            Remove-Item -LiteralPath $mon   -Recurse -Force -EA SilentlyContinue
            Remove-Item -LiteralPath $pproc -Recurse -Force -EA SilentlyContinue
            Remove-Item $md -Recurse -Force -EA SilentlyContinue
          }
          Write-Host "persistence_extra.ps1 OK"
          exit 0

      - name: service_signature_check.ps1 (real services + Authenticode; svchost must resolve)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = .\tools\service_signature_check.ps1
          $out | Select-Object -First 5 | Write-Host
          # The path parser must never misresolve well-known Windows services:
          # a "no-file" verdict for any svchost/system32 service means the
          # ImagePath normalization regressed (env vars, \SystemRoot\, unquoted
          # spaces). These services exist on every runner image.
          $bad = $out | Where-Object { $_ -match '\b(WinDefend|EventLog|Schedule|BITS|Dhcp|Dnscache)\b' -and $_ -match 'no-file' }
          if ($bad) { $bad | Write-Host; throw "service_signature_check misresolved a well-known service path (no-file)" }
          # -MarkerFile contract: the marker is written IFF at least one service
          # was flagged. Section 7 keys its FINDINGS raise on this file, so a
          # broken marker means a flagged malicious service reads CLEAN.
          $mk = Join-Path $env:TEMP 'dz_ci_svcgate.txt'
          Remove-Item $mk -Force -EA SilentlyContinue
          $out2 = .\tools\service_signature_check.ps1 -MarkerFile $mk
          $flagged = [bool](($out2 -join "`n") -match '\[WARNING\] \d+ service\(s\) failed')
          $marked  = Test-Path $mk
          Remove-Item $mk -Force -EA SilentlyContinue
          if ($flagged -ne $marked) { throw "service_signature_check -MarkerFile contract broken (flagged=$flagged marker=$marked)" }
          Write-Host "service_signature_check OK (marker contract: flagged=$flagged marker=$marked)"
          exit 0

      - name: persistence_eval.ps1 (Run-key + IFEO evaluation; clean host stays clean)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # On a clean runner (no planted autoruns/IFEO) it must print the OK
          # line and must NOT false-positive on any pre-existing autorun.
          $out = .\tools\persistence_eval.ps1 -MarkerFile "$env:TEMP\dz_ci_persist.txt"
          $out | Write-Host
          if (Test-Path "$env:TEMP\dz_ci_persist.txt") {
            throw "persistence_eval flagged a finding on a clean runner (false positive): $($out -join '; ')"
          }
          if (-not ($out -match 'No suspicious Run-key autoruns or IFEO')) {
            throw "persistence_eval did not emit the clean-state OK line"
          }
          Write-Host "persistence_eval OK"
          exit 0

      - name: logon_persistence.ps1 (logon/unlock vectors; clean runner has no CRITICAL)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item "$env:TEMP\dz_logon_*.txt" -Force -EA SilentlyContinue
          $out = .\tools\logon_persistence.ps1
          $out | Write-Host
          # Must run cleanly and emit all section headers (Tier 1 + Tier 2).
          foreach ($h in 'Winlogon Notify', 'Network Provider', 'Credential Providers', 'LSA Notification', 'Screensaver', 'Logon script') {
            if (-not ($out -match [regex]::Escape($h))) { throw "logon_persistence missing section: $h" }
          }
          # A clean runner must not yield a CRITICAL logon-persistence finding.
          # (A WARNING for a legit non-Microsoft-signed provider is acceptable.)
          $crit = Get-ChildItem "$env:TEMP\dz_logon_*.txt" -EA SilentlyContinue |
            Where-Object { (Get-Content -LiteralPath $_.FullName -Raw) -match 'CRITICAL' }
          if ($crit) {
            Get-ChildItem "$env:TEMP\dz_logon_*.txt" | ForEach-Object { Write-Host ("{0}: {1}" -f $_.Name, (Get-Content -LiteralPath $_.FullName -Raw)) }
            throw "logon_persistence flagged a CRITICAL on a clean runner (false positive)"
          }
          Remove-Item "$env:TEMP\dz_logon_*.txt" -Force -EA SilentlyContinue
          Write-Host "logon_persistence OK"
          exit 0

      - name: INIT-path extractions (self_update_check / disk_info / smart_health)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # self_update_check: an unreachable URL must hit the catch path,
          # emit an [INFO] line, and never throw.
          $u = .\tools\self_update_check.ps1 -LocalVer '7.2' -RemoteUrl 'http://127.0.0.1:0/version.txt' -DownloadUrl 'http://x/y.bat' | Out-String
          if ($u -notmatch '\[INFO\]|version') { Write-Host "self_update_check produced no status line"; exit 1 }
          # disk_info: each mode runs against real CIM / Get-PhysicalDisk.
          $vm = (.\tools\disk_info.ps1 -Mode VmFlag).Trim()
          if ($vm -ne 'yes_vm' -and $vm -ne 'no') { Write-Host "VmFlag unexpected: '$vm'"; exit 1 }
          $ssd = (.\tools\disk_info.ps1 -Mode SsdFlag).Trim()
          if ($ssd -ne 'yes_ssd' -and $ssd -ne 'no') { Write-Host "SsdFlag unexpected: '$ssd'"; exit 1 }
          .\tools\disk_info.ps1 -Mode VmReport | Out-Null
          .\tools\disk_info.ps1 -Mode DiskDetail | Out-Null
          $free = (.\tools\disk_info.ps1 -Mode FreeSpace -SystemDrive $env:SystemDrive | Out-String).Trim()
          if ($free -notmatch '^\d+$') { Write-Host "FreeSpace not numeric: '$free'"; exit 1 }
          # smart_health: report runs; flag must be warn/ok.
          .\tools\smart_health.ps1 -Mode Report | Out-Null
          $h = (.\tools\smart_health.ps1 -Mode Flag).Trim()
          if ($h -ne 'warn' -and $h -ne 'ok') { Write-Host "smart_health Flag unexpected: '$h'"; exit 1 }
          Write-Host "INIT-path extractions OK (self_update_check, disk_info x5, smart_health x2)"
          exit 0

      - name: dns_probe.ps1 (active DNS integrity probe, -dnsprobe)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $marker = Join-Path $env:TEMP 'dz_ci_dnsprobe.txt'
          if (Test-Path $marker) { Remove-Item $marker -Force }
          $out = .\tools\dns_probe.ps1 -MarkerFile $marker | Out-String
          # Lenient on network variance: just require recognizable probe output
          # (per-domain '->' lines, or the all-clear / blackhole summary).
          if ($out -notmatch '->|security/update domains|did not resolve') {
            Write-Host "dns_probe produced no recognizable output:"; Write-Host $out; exit 1
          }
          Write-Host "dns_probe OK"
          Write-Host $out
          exit 0

      # Server runners have System Protection off, so Checkpoint-Computer
      # cannot create a real restore point. That's the point of THIS test:
      # in a no-op run, srp_check.ps1 must (1) execute without parser/runtime
      # errors and (2) NOT write the marker file. Writing it incorrectly is
      # exactly the trust-bug we're guarding against -- it'd cause doze_sec to
      # log a phantom "[CREATED]" entry in every change log.
      - name: srp_check.ps1 runs cleanly and does NOT mark on a no-op
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Join-Path $env:TEMP 'dz_ci_srp_marker.txt'
          if (Test-Path $m) { Remove-Item $m -Force }
          .\tools\srp_check.ps1 -Description 'doze_sec CI selftest' -MarkerFile $m | Out-Null
          if (Test-Path $m) {
            Write-Host "srp_check FAILED: marker file was written despite no new restore point being created"
            Remove-Item $m -Force
            exit 1
          }
          Write-Host "srp_check OK (no marker on no-op)"
          exit 0

      # The INIT 12 if-exist block uses cmd.exe constructs (echo text>> file
      # inside a parenthesized if block). This step exercises it directly with
      # cmd.exe on a real Windows runner -- the only way to catch cmd.exe parse
      # errors like the "(if desired):" colon-after-paren crash that the PS-only
      # steps and full-run -nosrp both missed.
      - name: INIT 12 SRP if-exist changelog block (cmd.exe parse + run check)
        shell: cmd
        run: |
          rem Create marker so the if-exist condition fires
          echo.> "%TEMP%\dz_srp_created.txt"
          set "CHANGELOG=%TEMP%\dz_ci_srp_changelog.txt"
          set "SCRIPT_VERSION=7.3"
          if exist "%TEMP%\dz_srp_created.txt" (
              echo [CREATED] System Restore Point: "Pre-WIN11-Security-Audit-v%SCRIPT_VERSION%">> "%CHANGELOG%"
              echo           This is a safety net -- it lets you roll back any changes made AFTER this point.>> "%CHANGELOG%"
              echo           Undo ^(if desired^): Control Panel ^> System ^> System Protection ^> System Restore>> "%CHANGELOG%"
              echo           Select the restore point named Pre-WIN11-Security-Audit-v%SCRIPT_VERSION%>> "%CHANGELOG%"
              echo           NOTE: This is intentional and recommended. Only remove it if you are certain.>> "%CHANGELOG%"
              del "%TEMP%\dz_srp_created.txt" 2>nul
          )
          if exist "%TEMP%\dz_srp_created.txt" ( echo FAILED: marker not deleted & exit /b 1 )
          if not exist "%CHANGELOG%" ( echo FAILED: changelog not written & exit /b 1 )
          findstr /c:"CREATED" "%CHANGELOG%" >nul || ( echo FAILED: CREATED line missing & exit /b 1 )
          findstr /c:"if desired" "%CHANGELOG%" >nul || ( echo FAILED: if-desired line missing & exit /b 1 )
          echo INIT 12 if-exist block OK ^(cmd.exe parse and run^)
          exit /b 0

      # Section 4 suspicious-path patterns cross the cmd -> powershell.exe -File
      # argv boundary. A trailing UNdoubled backslash before the closing quote
      # ("\Temp\") is parsed by .NET argv rules as an escaped literal quote,
      # fusing the patterns into one garbage string -- a silent false negative
      # for the flagship malware-in-Temp check. This step runs the EXACT bat
      # invocation (doubled backslashes) from cmd and asserts both a hit and a
      # miss, so any regression in the quoting breaks CI instead of the check.
      - name: select_lines.ps1 argv quoting (Temp/AppData patterns match from cmd)
        shell: cmd
        run: |
          echo evil.exe  666  C:\Users\x\AppData\Local\Temp\evil.exe> "%TEMP%\dz_ci_argv.tmp"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\select_lines.ps1 -Path "%TEMP%\dz_ci_argv.tmp" "\Temp\\" "\AppData\\" "\Downloads\\" "\Recycle" "\Users\Public" >nul
          if not "%ERRORLEVEL%"=="0" ( echo FAILED: \Temp\ path did not match -- argv quoting regressed & exit /b 1 )
          echo winword.exe  777  C:\Program Files\Microsoft Office\winword.exe> "%TEMP%\dz_ci_argv.tmp"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\select_lines.ps1 -Path "%TEMP%\dz_ci_argv.tmp" "\Temp\\" "\AppData\\" "\Downloads\\" "\Recycle" "\Users\Public" >nul
          if not "%ERRORLEVEL%"=="1" ( echo FAILED: benign path matched -- patterns are corrupt & exit /b 1 )
          echo select_lines argv quoting OK ^(hit on \Temp\, miss on benign^)
          exit /b 0

      # Guard the bat files themselves: the suspicious-path call sites must
      # keep the doubled-backslash form, and BOTH 18e scheduled-task IOC
      # matchers must keep [regex]::Escape (the fix was once applied to only
      # one of the two scripts, silently killing 6 backslash-path IOCs in the
      # other).
      - name: bat call sites keep argv/regex fixes in BOTH scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in 'doze_sec.bat','doze_sec_noAdmin.bat') {
            if (-not (Select-String -Path $f -SimpleMatch '"\Temp\\" "\AppData\\" "\Downloads\\"' -Quiet)) {
              Write-Host "FAILED: $f lost the doubled-backslash suspicious-path patterns"; exit 1
            }
            if (-not (Select-String -Path $f -SimpleMatch '[regex]::Escape($p.Trim())' -Quiet)) {
              Write-Host "FAILED: $f lost [regex]::Escape in the 18e scheduled-task IOC matcher"; exit 1
            }
          }
          # Every active scheduled-task IOC must be usable as an escaped literal.
          $bad = @(Get-Content ThreatLists\ioc_scheduled_tasks.txt | Where-Object { $_ -and $_ -notmatch '^\s*#' } | Where-Object {
            try { [void]('probe' -match [regex]::Escape($_.Trim())); $false } catch { $true }
          })
          if ($bad) { Write-Host "FAILED: unusable IOC pattern(s): $($bad -join ', ')"; exit 1 }
          # The end-of-run CRITICAL escalation must use the resolved %PWSH%, not
          # bare 'powershell' -- on a host where powershell is not on PATH (the
          # exact case %PWSH% resolution exists for) a bare call no-ops and exit
          # code 8 is never raised. Assert the scrape line uses "%PWSH%".
          foreach ($f in 'doze_sec.bat','doze_sec_noAdmin.bat') {
            $scrape = Select-String -Path $f -SimpleMatch "Select-String -LiteralPath '%REPORT%' -Pattern '\A\[CRITICAL\]'"
            if (-not $scrape) { Write-Host "FAILED: $f lost the CRITICAL-escalation scrape line"; exit 1 }
            if ($scrape.Line -notmatch '"%PWSH%"') {
              Write-Host "FAILED: $f CRITICAL-escalation scrape uses bare powershell, not %PWSH% -- $($scrape.Line.Trim())"; exit 1
            }
          }
          Write-Host 'argv/regex fix guards OK (both bats, all task IOCs escape-safe, CRIT scrape uses %PWSH%)'
          exit 0

      # vt_self_check.ps1 is called from the bats as -Binaries "a","b","c".
      # powershell.exe -File binds that as ONE comma-joined string, which the
      # script must split -- before this was fixed, zero binaries resolved and
      # the VT integrity gate silently verified nothing. Run the EXACT bat-style
      # call from cmd with a dummy token and assert all four binaries resolve
      # (the dummy key then 401s and exits 2, which is fine -- resolution
      # happens before any network call).
      - name: vt_self_check.ps1 resolves comma-bound -Binaries from cmd
        shell: cmd
        run: |
          mkdir "%TEMP%\dz_vt_home" 2>nul
          echo dummy-token-for-binding-test> "%TEMP%\dz_vt_home\.vt_token"
          set "USERPROFILE=%TEMP%\dz_vt_home"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\vt_self_check.ps1 -SleepSeconds 0 -TimeoutSeconds 5 -Binaries "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe","%SystemRoot%\System32\wevtutil.exe","%SystemRoot%\System32\reg.exe","%SystemRoot%\System32\findstr.exe"> "%TEMP%\dz_vt_out.txt" 2>&1
          findstr /c:"no resolvable binaries" "%TEMP%\dz_vt_out.txt" >nul && ( echo FAILED: comma-bound -Binaries did not split -- VT gate is dead again & type "%TEMP%\dz_vt_out.txt" & exit /b 1 )
          findstr /c:"verifying 4" "%TEMP%\dz_vt_out.txt" >nul || ( echo FAILED: expected all 4 binaries to resolve & type "%TEMP%\dz_vt_out.txt" & exit /b 1 )
          echo vt_self_check comma-binding OK ^(4/4 binaries resolved^)
          exit /b 0

  full-run:
    name: "doze_sec.bat end-to-end (hang guard, hard timeout)"
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run the full audit; fail on hang (timeout), fatal error, or early exit
        shell: cmd
        run: |
          call doze_sec.bat -dev -sdu -nosrp -resetTTP -dnsprobe
          set RC=%ERRORLEVEL%
          echo doze_sec.bat exit code: %RC%
          if "%RC%"=="1" ( echo FATAL ERROR exit code 1 & exit /b 1 )
          set "REP="
          for %%R in ("C:\SecurityAudit\SecurityReport_*.txt") do set "REP=%%R"
          if not defined REP ( echo NO REPORT PRODUCED & exit /b 1 )
          rem A hang is caught by the job timeout; this catches an EARLY EXIT
          rem (e.g. a parse error mid-audit) that still left a partial report:
          rem the exit handler's "EXIT CODE:" line and the [18/18] banner only
          rem exist if the audit actually ran to the end.
          findstr /c:"EXIT CODE:" "%REP%" >nul || ( echo AUDIT DID NOT REACH EXIT HANDLER -- early exit or crash & exit /b 1 )
          findstr /c:"[18/18]" "%REP%" >nul || ( echo AUDIT DID NOT REACH SECTION 18 -- early exit & exit /b 1 )
          echo Completed end-to-end through Section 18 and the exit handler.
          exit /b 0

      - name: Upload the audit artifacts for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securityaudit-output
          path: C:\SecurityAudit\*
          if-no-files-found: ignore

  # Detection-regression harness. full-run above proves the audit COMPLETES;
  # this proves it DETECTS. It plants known-bad artifacts (WDigest=1, a HOSTS
  # hijack, a Run-key backdoor, an IFEO Debugger on notepad, an enabled Guest
  # account), runs the audit, and asserts the report flags them. Detections
  # that work today are "required" (a regression fails the job); the gaps the
  # code review found are "pending" and never fail the job -- they flip to
  # required as the fixes land. Every artifact is removed in a finally block.
  detection-selftest:
    name: "detection regression harness (plant known-bad -> assert verdict)"
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Plant indicators, run the audit, assert detections, clean up
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\detection_selftest.ps1 -BatPath .\doze_sec.bat
          exit $LASTEXITCODE

      - name: Upload the selftest audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-selftest-output
          path: C:\SecurityAudit\*
          if-no-files-found: ignore

  # The same plant/assert harness against doze_sec_noAdmin.bat, elevated.
  # Elevated, the adaptive bat sets IS_ADMIN=1 and runs its full path, so every
  # detection, section verdict, and Option B consistency assertion must hold
  # exactly as they do for doze_sec.bat -- this is the mirror-parity check the
  # design memo (section 7) called out as missing.
  detection-selftest-noadmin:
    name: "detection regression harness (doze_sec_noAdmin.bat, elevated adaptive path)"
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Plant indicators, run the noAdmin bat elevated, assert detections
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\detection_selftest.ps1 -BatPath .\doze_sec_noAdmin.bat
          exit $LASTEXITCODE

      - name: Upload the selftest audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-selftest-noadmin-output
          path: C:\SecurityAudit\*
          if-no-files-found: ignore

  # The path CI never executed before: doze_sec_noAdmin.bat as a REAL standard
  # user (created on the runner, launched via Start-Process -Credential).
  # Asserts the non-admin contract: report says Admin : 0, sections defer with
  # PARTIAL verdicts, a planted HKLM CRITICAL is still detected without admin,
  # exit codes 6/8 honor their semantics, and the Option B ledger consistency
  # net holds under deferral. See tests/noadmin_smoke.ps1.
  noadmin-true-run:
    name: "doze_sec_noAdmin.bat as a real standard user (deferral contract)"
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Create standard user, run the audit twice, assert the contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\noadmin_smoke.ps1 -BatPath .\doze_sec_noAdmin.bat
          exit $LASTEXITCODE

      - name: Upload the non-admin audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noadmin-smoke-output
          path: noadmin-smoke-output\*
          if-no-files-found: ignore
