name: lint

on:
  push:
    branches: [main]
  pull_request:
  # Manual kick. Without this there is no way to re-run these checks except by
  # pushing a commit -- which is exactly the wrong tool when the checks failed
  # for a reason that has nothing to do with the diff (a runner outage, an
  # expired token, a transient registry fetch). Keep it: the day you need it,
  # adding it requires the push you were trying to avoid.
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  batch-comment-lint:
    name: "Batch lint: no '::' inside ( ) blocks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lint_batch_comments.ps1
        run: pwsh -NoProfile -File tools/lint_batch_comments.ps1

  unraised-findings-lint:
    name: "Findings lint: nothing printed that is not raised"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Guards the failure mode a retrospective found on ~25 checks at once: a
      # check printing '[CRITICAL] ...' into the report while the ledger -- and
      # therefore the section verdict, the findings count and the exit code --
      # never heard about it. Structural, so a check written next year is
      # covered the day it is added.
      - name: Run lint_unraised_findings.ps1
        run: pwsh -NoProfile -File tools/lint_unraised_findings.ps1

  marker-selftest:
    name: "Marker selftest: a finding actually reaches the ledger"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The findings lint is STATIC: it proves a check routes through a marker,
      # not that the write lands. A field test on a real Windows machine found
      # twelve tools whose marker write failed silently into a directory they
      # never created -- the finding printed into the report while the section
      # verdict, the findings count and the exit code all said clean. This runs
      # each tool's real Write-Marker against a nonexistent directory and
      # requires the marker to appear.
      - name: Run tests/marker_selftest.ps1
        run: pwsh -NoProfile -File tests/marker_selftest.ps1

  safety-invariants:
    name: "Safety: every plant declares its blast radius; the harness cannot lock a user out"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A real user was locked out of their own machine when the screen locked
      # while the detection harness had a fake credential provider registered.
      # Static analysis over the harness AST, so it runs anywhere: every plant
      # declares what it touches and which of logon/boot/network/defense it can
      # affect (the axes are also INFERRED from the plant body, so a declaration
      # cannot be omitted), every logon-path plant is skipped before planting
      # under -NoLockScreenRisk, every skip is declared, standalone cold
      # recovery covers every declared target, and manual_ci is safe by default.
      - name: Run tests/safety_invariants.ps1
        run: pwsh -NoProfile -File tests/safety_invariants.ps1
      # A check that cannot fail is not a check: the self-test mutates copies of
      # the harness (undeclared plant, missing reason, wrong axis, missing
      # cleanup, undeclared smoke-test plant) and asserts each one FAILS.
      - name: The check must fail on a mutated harness
        run: pwsh -NoProfile -File tests/safety_invariants.ps1 -SelfTest

  readonly-lint:
    name: "Read-only tripwire: every mutation/egress site in the bats stays gated"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # -readonly promises a person that the audit changes nothing on their
      # machine outside the output folder and the temp folder and makes no
      # network connections. This lint fails if any reg/bcdedit/restore-point/
      # download site loses its gate.
      - name: Run tools/lint_readonly.ps1
        run: pwsh -NoProfile -File tools/lint_readonly.ps1
      - name: The lint must fail on an ungated site
        run: pwsh -NoProfile -File tools/lint_readonly.ps1 -SelfTest

  benign-corpus-lint:
    name: "Benign corpus: every known false positive is catalogued with the test that proves it"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tests/benign_corpus.txt catalogues benign look-alikes (P9NP, a
      # never-onboarded Sense, a smart-card reader's Event 104, ...). Every
      # entry must resolve to a harness Invert case, a windows-smoke step, or a
      # stated field-only reason, and every Invert case must be catalogued.
      - name: Run tools/benign_corpus_check.ps1 -Mode Lint
        run: pwsh -NoProfile -File tools/benign_corpus_check.ps1 -Mode Lint
      - name: The check must fail on a broken corpus and grade reports correctly
        run: pwsh -NoProfile -File tools/benign_corpus_check.ps1 -SelfTest

  remediation-lint:
    name: "Remediation: every command the user is told to run elevated actually works"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The remediation script is the only artifact this tool hands a person to
      # run elevated. Two of its commands shipped broken: one passed \False to a
      # boolean, the other was a parse error that voided the whole file -- and
      # both fired only when something was genuinely wrong. This reproduces the
      # cmd + PowerShell expansion and parses what would really land on disk.
      - name: Run tools/lint_remediation.ps1
        run: pwsh -NoProfile -File tools/lint_remediation.ps1
      - name: The lint must fail on a reintroduced expansion bug
        run: pwsh -NoProfile -File tools/lint_remediation.ps1 -SelfTest

  driver-audit-grade:
    name: "Driver audit: the signature grade, exercised in both directions"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tools/driver_audit.ps1 decides whether a kernel driver is unsigned.
      # Being wrong one way cries wolf about a Microsoft inbox driver; being
      # wrong the other calls a genuinely unsigned driver -- the BYOVD /
      # EDR-kill shape -- fine. Until now the signature read was INLINE in the
      # scan loop, so the rule most likely to be wrong was also the only one
      # that could not be exercised by a test at all.
      #
      # It is now a pure Get-DriverVerdict behind injectable probes. One case
      # asserts the emitted message still matches the regex
      # tests/benign_corpus.txt keys on: reword it and the corpus entry
      # silently stops matching, which that file warns about in as many words.
      - name: Grade both directions (signed, unsigned, staged, known-bad, unreadable)
        run: pwsh -NoProfile -File tools/driver_audit.ps1 -SelfTest
      # The Memory Integrity context must never become a severity downgrade,
      # and must never go silent when the state is unknown -- this tool is not
      # admin-gated in doze_sec_noAdmin.bat, so unelevated runs are real. The
      # probe itself is never called here: this runner is Linux and the
      # DeviceGuard CIM namespace does not exist, which is why the note is a
      # pure function taking a state.
      - name: The HVCI context is present for every state and downgrades nothing
        run: |
          out=$(pwsh -NoProfile -File tools/driver_audit.ps1 -SelfTest)
          echo "$out"
          echo "$out" | grep -q 'an UNKNOWN Memory Integrity state still produces a line' \
            || { echo 'the unknown-state case is gone -- an unelevated run could go silent'; exit 1; }
          echo "$out" | grep -q 'the HVCI-on note states the finding still stands' \
            || { echo 'the no-downgrade case is gone -- HVCI context could start quieting real findings'; exit 1; }
          echo "$out" | grep -q 'Unsigned is false for a known-bad hash that is validly signed' \
            || { echo 'the Unsigned-flag case is gone -- the context line could attach to the wrong findings'; exit 1; }
          n=$(echo "$out" | grep -c '^\[OK\]')
          [ "$n" -ge 32 ] || { echo "self-test ran only $n case(s) -- it is not exercising the grade"; exit 1; }
      # A field report printed a flagged driver as "PROCEXP152.SYS [ff9b3fc4...]"
      # and nothing else: the hash could not be looked up, and whether the
      # driver was loaded, when it arrived and who signed it took the owner
      # three commands to learn. The finding now carries those facts.
      - name: A driver finding carries its triage facts (full hash, loaded or on disk, signer, times, install event)
        run: |
          out=$(pwsh -NoProfile -File tools/driver_audit.ps1 -SelfTest)
          for c in 'the FULL sha256 is printed' 'on disk only, not loaded' 'reads LOADED with its name' \
                   'a matching Event 7045 gives the install time' 'an unreadable System log says not read' \
                   'a crafted path or service name cannot start a new line'; do
            echo "$out" | grep -q "^\[OK\].*$c" || { echo "evidence case missing or failing: $c"; echo "$out"; exit 1; }
          done

  persistence-bits-grade:
    name: "BITS destination rule: plain HTTP is not a signal"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The BITS arm of tools/persistence_extra.ps1 had NO seam at all: the
      # rule was inline in a loop over Get-BitsTransfer, so it could only ever
      # be exercised by CI against a real bitsadmin job on a Windows runner.
      # That gap is why the false positive below had to be caught by hand on
      # the owner's machine rather than by a test.
      #
      # THE FALSE POSITIVE. A destination rule replaced an age rule that had
      # flagged Microsoft Edge's own updater for having a birthday. The new
      # rule raised on any http:// remote -- and on 2026-09-19 flagged the
      # SAME job, for the third time through a third rule:
      #
      #   [WARNING] ... it fetches over plain HTTP, not HTTPS
      #   (http://msedge.b.tlu.dl.delivery.mp.microsoft.com/...)
      #
      # Microsoft documents *.dl.delivery.mp.microsoft.com as HTTP on port 80
      # for Edge content delivery: "Be sure not to use HTTPS for those
      # endpoints that specify HTTP, and vice versa. The connection will
      # fail." Plain HTTP there is REQUIRED. The CI case that covered this
      # used http://localhost and proved the rule FIRED; it never asked
      # whether firing was correct. The mechanism was tested, the judgement
      # was not.
      #
      # Get-BitsVerdict is now pure, so the whole rule runs here on Linux.
      - name: Grade every destination shape (public IP, LAN IP, hostname, autostart, unreadable)
        run: pwsh -NoProfile -File tools/persistence_extra.ps1 -SelfTest
      # By NAME, so a case cannot be deleted and still satisfy a count. The
      # first two are the regression itself.
      - name: The deleted plain-HTTP branch stays deleted
        run: |
          out=$(pwsh -NoProfile -File tools/persistence_extra.ps1 -SelfTest)
          echo "$out"
          echo "$out" | grep -q 'the real Edge Component Updater remote is context, not a finding' \
            || { echo 'the field regression case is gone -- the Edge updater could be flagged a fourth time'; exit 1; }
          echo "$out" | grep -q 'no line anywhere says plain HTTP' \
            || { echo 'nothing now stops the plain-HTTP branch being reinstated'; exit 1; }
          echo "$out" | grep -q 'a bare public IP destination raises' \
            || { echo 'the true-positive direction is gone -- the destination rule may be dead'; exit 1; }
          echo "$out" | grep -q 'a bare private LAN address is context' \
            || { echo 'the WSUS/SCCM/Connected Cache carve-out is untested'; exit 1; }
          echo "$out" | grep -q '172.32.x is outside the private block and raises' \
            || { echo 'the private-range boundary is untested -- 172.32 could be swallowed as LAN'; exit 1; }
          echo "$out" | grep -q 'a download into the temp folder is what a downloader does' \
            || { echo 'nothing stops $badPathRx being applied to BITS local names again'; exit 1; }
          echo "$out" | grep -q 'an unreadable file list is NOT cleared' \
            || { echo 'an unreadable destination could start reading as an all-clear'; exit 1; }
          # The DIRECTION of transfer (T1048). The age gate used to sit above
          # every one of these arms, so a job created minutes ago -- which is
          # what an exfiltration job and a next-stage ingress job both are --
          # was graded on nothing at all.
          echo "$out" | grep -q 'a job created 3 days ago fetching from a bare public IP is graded NOW' \
            || { echo 'the age gate could move back above the destination rule, hiding every fresh job'; exit 1; }
          echo "$out" | grep -q 'an upload one day old is reported' \
            || { echo 'nothing stops the upload arm being put back behind the age gate'; exit 1; }
          echo "$out" | grep -q "a file from the person's own folders escalates to CRITICAL" \
            || { echo 'the upload payload classes are untested -- the person own files could read as routine'; exit 1; }
          echo "$out" | grep -q 'a private LAN collector is WARNING with the management-point cause named' \
            || { echo 'the management-agent carve-out is untested -- a ConfigMgr client could read as exfiltration'; exit 1; }
          echo "$out" | grep -q 'an archive outside the user own folders stays WARNING' \
            || { echo 'a diagnostics .cab could start reading as staged loot'; exit 1; }
          echo "$out" | grep -q 'a job with no TransferType property is counted as unchecked for direction' \
            || { echo 'an unreadable direction could be absorbed as a download -- the OK-default mistake'; exit 1; }
          echo "$out" | grep -q 'a crafted FILE NAME cannot forge a line of its own' \
            || { echo 'a file name could inject its own severity tag into the report'; exit 1; }
          # Each of these pins a defect a read-only review found before the
          # first push: a job's own name is chosen by whoever created it, and
          # it reached both the report's line structure and the command the
          # report tells the reader to paste.
          echo "$out" | grep -q 'a crafted JOB NAME cannot forge a line in the destination arm' \
            || { echo 'a job name could forge a line in the arms that do not filter it'; exit 1; }
          echo "$out" | grep -q 'the verify line is ONE statement even when the job name holds an apostrophe' \
            || { echo 'a job name could append a statement to the command the reader is told to paste'; exit 1; }
          echo "$out" | grep -q 'an application config file is not a registry hive' \
            || { echo 'config\system.json could read as a hive copy again -- CRITICAL on a clean machine'; exit 1; }
          echo "$out" | grep -q "a shared profile folder is not the person's own" \
            || { echo 'C:\Users\Public could read as the signed-in user own folders again'; exit 1; }
          echo "$out" | grep -q 'a .pem is named as a certificate file, not escalated' \
            || { echo 'a public certificate could be graded as a stolen private key'; exit 1; }
          echo "$out" | grep -q 'a bare IPv6 collector is CRITICAL, not reassured' \
            || { echo 'an IPv6 collector could get the reassuring sentence again'; exit 1; }
          echo "$out" | grep -q 'an upload job with an empty file list is context, not a finding' \
            || { echo 'the transient between creating a job and adding a file could become a finding'; exit 1; }
          echo "$out" | grep -q 'a job whose direction could not be read is NOT covered by the all-clear' \
            || { echo 'the all-clear could absorb a direction nobody read'; exit 1; }
          echo "$out" | grep -q 'a standard-user enumeration says whose jobs it saw' \
            || { echo 'a one-user enumeration could claim the whole machine again'; exit 1; }
          echo "$out" | grep -q 'a direction that is none of the three documented types is a declared gap' \
            || { echo 'an unrecognised direction could be read as a harmless download'; exit 1; }
          n=$(echo "$out" | grep -c '^\[OK\]')
          [ "$n" -ge 80 ] || { echo "self-test ran only $n case(s) -- it is not exercising the rule"; exit 1; }

  benign-twin-grade:
    name: "Benign twins: the ordinary state of a real machine must not raise"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A sweep after #212 asked of every rule: could its test fail if the
      # rule were WRONG, as opposed to merely broken? The gap tracked the
      # absence of a pure verdict function almost exactly -- every tool that
      # had one carried benign must-not-raise cases, and every tool that did
      # not carried none. These three had none and now do.
      #
      # What each pins is the ORDINARY state of a real machine, because that
      # is what a false positive costs: a person told their computer is
      # compromised when it is not.
      - name: stalkerware_check -- the highest-stakes check had no self-test at all
        run: |
          out=$(pwsh -NoProfile -File tools/stalkerware_check.ps1 -SelfTest); echo "$out"
          for n in 'the CodexSandbox pair is a finding, at WARNING and never CRITICAL' \
                   'an account named psadmin is NOT swallowed by the note-property skip' \
                   'an EMPTY string value is not a hide-flag' \
                   'Shadow=unset requires consent, so it is not a finding' \
                   'ordinary software is not a monitoring product'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]'); [ "$n" -ge 24 ] || { echo "only $n case(s)"; exit 1; }
      - name: boot_chain_check -- Secure Boot off and VBS off are consumer defaults
        run: |
          out=$(pwsh -NoProfile -File tools/boot_chain_check.ps1 -SelfTest); echo "$out"
          for n in 'an ordinary Windows 11 boot entry raises nothing' \
                   'recoveryenabled Yes is not read as a debugger' \
                   'legacy BIOS / a VM without UEFI variables is NOT a finding' \
                   'a null DeviceGuard reading is never reported as "not running"'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]'); [ "$n" -ge 20 ] || { echo "only $n case(s)"; exit 1; }
      - name: log_gap_check -- "records were lost" must not fire on ordinary rollover
        run: |
          out=$(pwsh -NoProfile -File tools/log_gap_check.ps1 -SelfTest); echo "$out"
          for n in 'retention: 20 MB on Security -- the Windows default' \
                   'retention: 0 MB on Unreadable -- size unreadable is not a small log' \
                   'rollover: full log rolled for the ordinary reason' \
                   'rollover: oldest record predates the boot' \
                   'unlistable: Security as a standard user is DEFERRED (the token, not the machine)' \
                   'unlistable: Security while ELEVATED is a raised gap (WARNING), never a deferral'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]'); [ "$n" -ge 23 ] || { echo "only $n case(s)"; exit 1; }
      # The last four tools without a seam. Each pins a real machine's ordinary
      # state: a laptop with no network, the owner's fifteen autoruns, Process
      # Explorer's documented IFEO value, Patch Tuesday driver churn and the RPC
      # endpoint mapper's moving ports, a German auditpol.
      - name: dns_probe -- a probe that resolved NOTHING is unverified, not nine blackholes
        run: |
          out=$(pwsh -NoProfile -File tools/dns_probe.ps1 -SelfTest); echo "$out"
          for n in 'nine real public answers raise nothing and write no marker' \
                   'ALL FAIL: marker is unverified, never blackhole' \
                   'ALL FAIL: no [WARNING] line is printed' \
                   'ONE of nine fails while eight resolve: marker is blackhole' \
                   'the REAL wdcp answer 172.178.160.22 is public' \
                   'a loopback resolver is INFO, and the probe stays clean'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]'); [ "$n" -ge 26 ] || { echo "only $n case(s)"; exit 1; }
      - name: audit_policy_check -- a localized setting is unread, never reported OFF
        run: |
          out=$(pwsh -NoProfile -File tools/audit_policy_check.ps1 -SelfTest); echo "$out"
          for n in 'a localized header still yields the rows' \
                   '"Success and Failure" is ON' \
                   'a localized setting (Erfolg) is a raised gap ([WARNING] not classified), never reported as OFF' \
                   'Failure alone is OFF' \
                   'cmdline value absent is DISABLED' \
                   'the real table with Kernel Object off: one [INFO] line, no WARNING, nothing raised (the live plumbing, not one row)' \
                   'a CONTEXT row that is off prints [INFO], raises nothing, and uses none of the graded phrases' \
                   'exactly one row in the shipped table is context-only, and it is Kernel Object'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]   '); [ "$n" -ge 29 ] || { echo "only $n case(s)"; exit 1; }
      - name: persistence_eval -- the owner's real autoruns, and Process Explorer's Replace Task Manager
        run: |
          out=$(pwsh -NoProfile -File tools/persistence_eval.ps1 -SelfTest); echo "$out"
          for n in "owner's real autorun is not a finding: OneDrive" \
                   "owner's real autorun is not a finding: deviceTRUST Client User" \
                   'a hidden-window launcher ALONE is common in updaters and is not a finding' \
                   'hidden window + -enc is a finding' \
                   'IFEO taskmgr.exe -> Microsoft-signed procexp64.exe is Replace Task Manager: INFO, no finding' \
                   'an UNSIGNED procexp64.exe on taskmgr.exe is the hijack' \
                   'sethc.exe -> cmd.exe is the classic hijack' \
                   'an unreadable IFEO subkey as a standard user is INFO, named, not graded, not cleared' \
                   'IFEO subkeys an ADMINISTRATOR cannot read are a WARNING that names them'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]'); [ "$n" -ge 39 ] || { echo "only $n case(s)"; exit 1; }
      - name: baseline_diff -- update churn is context, a replaced unsigned binary is a finding
        run: |
          out=$(pwsh -NoProfile -File tools/baseline_diff.ps1 -SelfTest); echo "$out"
          for n in 'CHANGED Microsoft-signed driver (Windows Update replaced it) is INFO' \
                   'CHANGED driver whose new binary is NOT Microsoft-signed is WARNING' \
                   'NEW dynamic-range listener owned by svchost is INFO' \
                   'NEW listener BELOW the dynamic range is WARNING even for svchost' \
                   'NEW service hosted by signed rundll32 pointed at ProgramData is WARNING' \
                   'NEW service whose Microsoft-signed binary sits in Users\Public is WARNING' \
                   'NEW root CA is WARNING' \
                   'Get-BinPath walks an unquoted path with spaces to the first file that exists' \
                   'CHANGED service validly signed by a non-Microsoft publisher, version segment only, is INFO naming the signer' \
                   'CHANGED service version bump whose new binary is NOT validly signed stays WARNING' \
                   'CHANGED signed task whose ARGUMENT changed (an address, not a path version) is WARNING' \
                   'NEW task validly signed by a non-Microsoft publisher is INFO naming the signer' \
                   'NEW task whose binary is not validly signed is WARNING' \
                   'NEW SoftLanding task with no executable action is INFO' \
                   'NEW COM-handler task OUTSIDE the Windows task paths is WARNING' \
                   'NEW listener bound to [::1] only is INFO whatever the owner' \
                   'NEW non-system listener in the dynamic range bound to 0.0.0.0 is WARNING' \
                   'CHANGED listener that moved from loopback to 0.0.0.0 is WARNING' \
                   'a baseline saved before the bind field existed does not read every port as CHANGED' \
                   'Winlogon LastLogOffEndTimePerfCounter is excluded from the snapshot' \
                   'a per-user service renamed by a new logon keeps one key' \
                   'a per-user-LOOKING name with no template keeps its own key' \
                   'an instance repointed at another image keeps its own key' \
                   'is NOT excluded (marker, never name)'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]'); [ "$n" -ge 84 ] || { echo "only $n case(s)"; exit 1; }
      # T1036: the one real detection gap the 2026-09 retrospective found. The
      # benign twins are Windows' own casing, SysWOW64, wbem, the Defender
      # platform directory, and a path the tool could not read.
      - name: masquerade_check -- a system name outside its directory or with the wrong parent, without flagging Windows' own casing or a parent that exits by design
        run: |
          out=$(pwsh -NoProfile -File tools/masquerade_check.ps1 -SelfTest); echo "$out"
          for n in "svchost.exe at C:\\WINDOWS\\system32\\svchost.exe (the owner's casing) is canonical" \
                   "Explorer.EXE at C:\\WINDOWS\\Explorer.EXE (the owner's casing) is canonical" \
                   'a 32-bit svchost.exe under SysWOW64 is canonical' \
                   'WmiPrvSE.exe lives under System32\wbem, not System32' \
                   'a system name with NO path is UNVERIFIED, not a finding' \
                   'svchost.exe from AppData\Roaming is WARNING' \
                   'svchost.exe from System32x (a prefix trick) is WARNING' \
                   'svchost.exe whose parent PID is explorer.exe is WARNING, and names services.exe' \
                   'a renamed chain (fake wininit -> fake services -> implant svchost) is caught: two wininit and two services' \
                   'a clock that moved backward: nothing is flagged for it, and the report says time was not used' \
                   'svchost.exe whose parent is no longer running is WARNING: services.exe runs until shutdown' \
                   'csrss.exe whose session smss.exe has exited is EXITED, not a finding' \
                   'winlogon.exe whose parent PID now belongs to a LATER process is EXITED (PID reuse), not a finding' \
                   'a real-shaped Windows tree raises nothing and prints the OK line' \
                   'a session whose winlogon.exe has exited: its dwm.exe and fontdrvhost.exe are counted as exited, not flagged' \
                   'csrss, wininit and winlogon under a living, OLDER cmd.exe are not graded by parent (one per session grades them, so no clock step can raise one)' \
                   'RuntimeBroker.exe whose parent PID belongs to a LATER svchost.exe is named as a reused number, and the clock is not blamed' \
                   'dwm.exe in session 1 under the winlogon.exe of session 2 is WARNING (a winlogon.exe only starts processes in its own session)' \
                   'smss.exe whose parent calls itself System but is not PID 4 is WARNING: System is PID 4 and nothing else' \
                   'a snapshot with no lsass.exe is SKIPPED, never OK (every running Windows has one)' \
                   'a ten-digit session ID parses (4294967295 is not dropped or overflowed)' \
                   'a dwm.exe under services.exe in session 0 is a finding, never "a session that is ending"' \
                   'userinit.exe under a living, OLDER cmd.exe in a session that is ending is WARNING: an older holder is no reused number, it started the child' \
                   'a WmiPrvSE.exe recorded before the first service host (a small step back soon after boot) reads as a clock that moved, not a finding' \
                   'a process recorded before the System-started smss.exe, alone, reads as a clock that moved' \
                   'an svchost.exe recorded before its services.exe (but after smss), alone, reads as a clock that moved' \
                   'a copy of LSASS is CRITICAL, on its own row, named once: no wrong-parent line and no second-instance line for it' \
                   'lsass.exe under lsass.exe from ANOTHER path is not a copy (the other rules grade an impostor)' \
                   'browsers and explorer start children from their own image: chrome.exe, msedge.exe or explorer.exe under itself is no copy' \
                   'smss.exe under smss.exe is no copy: the first smss starts one for each session by design' \
                   'a parent PID now held by a NEWER process of the same name is a reused number, not a copy'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]   '); [ "$n" -ge 125 ] || { echo "only $n case(s)"; exit 1; }
      - name: lsass_copy_events -- an LSASS copy in the Security log is CRITICAL in any spelling; the boot start and a log with no 4688 are not
        run: |
          out=$(pwsh -NoProfile -File tools/lsass_copy_events.ps1 -SelfTest); echo "$out"
          for n in 'LSASS started by wininit.exe at boot is the normal record: OK, counted' \
                   'lsass.exe created by lsass.exe is CRITICAL: LSASS was copied, with the time and both PIDs' \
                   'paths compare case-insensitively: a recorded spelling cannot hide a copy' \
                   'no process-creation record at all: SKIPPED (auditing off), never OK, raises nothing'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]   '); [ "$n" -ge 14 ] || { echo "only $n case(s)"; exit 1; }
      - name: asr_lsass_events -- the accessing program is taken from whichever field is not lsass.exe; a log the rule never writes to is SKIPPED, not cleared
        run: |
          out=$(pwsh -NoProfile -File tools/asr_lsass_events.ps1 -SelfTest); echo "$out"
          for n in 'the real captured field order (Process Name = lsass.exe, Path = the program) names the program, not lsass.exe' \
                   'the reversed order (Path = lsass.exe) names the same program -- neither field is trusted to be the accessor' \
                   'when neither field names lsass.exe, both are printed and the line says it could not tell them apart' \
                   'an audit-mode record says the access was NOT blocked' \
                   'a per-rule exclusion is a WARNING naming the excluded program, and the all-clear line is withheld' \
                   'with the rule off, an empty log is [SKIPPED] and raises nothing -- never an all-clear'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]   '); [ "$n" -ge 42 ] || { echo "only $n case(s)"; exit 1; }
      - name: lsass_dump_config -- a dump-on-exit setting or a dump file is a finding; the documented LSA-protection value is not
        run: |
          out=$(pwsh -NoProfile -File tools/lsass_dump_config.ps1 -SelfTest); echo "$out"
          for n in 'AuditLevel=8 alone is the documented LSA-protection setting: OK, named as ordinary, never a finding' \
                   'the flag is read as a bit, not an equality: 0x240 still carries 0x200' \
                   'a GlobalFlag that cannot be read as a number is a declared gap, never read as no flags set' \
                   'a dump FILE of lsass on disk is CRITICAL, with its path, size and time, and says what to do' \
                   'the GLOBAL full-dump setting is named as a general debugging setting, never graded' \
                   'a dump file left by this tool'"'"'s own harness is still CRITICAL, and the line says what it is' \
                   'pointed at another program, every line names that program and none mentions LSASS'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]   '); [ "$n" -ge 36 ] || { echo "only $n case(s)"; exit 1; }
      - name: proc_snapshot -- one query, the former Name-PID-Path lines byte for byte, and the process tree
        run: |
          out=$(pwsh -NoProfile -File tools/proc_snapshot.ps1 -SelfTest); echo "$out"
          echo "$out" | grep -qF 'the stdout line is exactly the former one-liner' || { echo 'case gone: stdout format'; exit 1; }
          n=$(echo "$out" | grep -c '^\[OK\]   '); [ "$n" -ge 6 ] || { echo "only $n case(s)"; exit 1; }
      # The first standard-user field run (2026-09-24): a DACL-restricted
      # Microsoft service reported as a rootkit, a stale per-user IOC copy
      # reporting UAC ON as an IOC, and a coverage block certifying an audit
      # check that never ran. A standard-user token is a different machine.
      - name: cross_api_check -- a service the SCM refuses to a standard user is not a hidden service
        run: |
          out=$(pwsh -NoProfile -File tools/cross_api_check.ps1 -SelfTest); echo "$out"
          for n in 'zthelper denied (error 5) to a standard-user token is NOT a finding' \
                   'error 1060 (SCM has never heard of it) is the hidden service: CRITICAL even unelevated' \
                   'a service that denies an ADMINISTRATOR is a WARNING' \
                   'CRITICAL names only the hidden one' \
                   'sc query exit 5 is error 5 and the detail names the failing call' \
                   'no exit code at all (sc.exe did not run) is -1, never a default grade' \
                   'the hidden-service line states how it was established' \
                   'no readable code, standard user: WARNING unprobed' \
                   'TaskCache unreadable as a standard user is DEFERRED (the token, not the machine)' \
                   'TaskCache unreadable while ELEVATED is a raised gap (WARNING), never a deferral' \
                   'a disagreeing PID that is GONE at the final liveness check is a race, not a hit' \
                   'a disagreeing PID that is STILL ALIVE is the hidden process'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]'); [ "$n" -ge 28 ] || { echo "only $n case(s)"; exit 1; }
      - name: defender_core_check -- another antivirus in control is INFO; real-time off with no other AV is CRITICAL
        run: |
          out=$(pwsh -NoProfile -File tools/defender_core_check.ps1 -SelfTest); echo "$out"
          for n in "Passive Mode with real-time OFF: INFO 'another antivirus product is in control'" \
                   'EMPTY mode with real-time OFF is not passive: CRITICAL' \
                   'passive mode does not excuse an explicit DisableRealtimeMonitoring policy: still CRITICAL' \
                   'Normal mode with real-time OFF: CRITICAL'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]'); [ "$n" -ge 16 ] || { echo "only $n case(s)"; exit 1; }
      - name: defender_exclusions_check -- every exclusion is WARNING and named; none is OK; unqueryable is SKIPPED, never OK
        run: |
          out=$(pwsh -NoProfile -File tools/defender_exclusions_check.ps1 -SelfTest); echo "$out"
          for n in 'one path: WARNING naming T1562.001' \
                   'Get-MpPreference failed: one [SKIPPED], not graded, no severity invented' \
                   'an item that starts with a severity tag never starts a report line with one' \
                   'a single string (not an array) is one exclusion'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]'); [ "$n" -ge 10 ] || { echo "only $n case(s)"; exit 1; }
      - name: module_inspect -- lsass denied on a standard-user token is DEFERRED; elevated with LSA Protection off it is a raised gap
        run: |
          out=$(pwsh -NoProfile -File tools/module_inspect.ps1 -SelfTest); echo "$out"
          for n in 'lsass denied, standard-user token, LSA Protection off: DEFERRED' \
                   'lsass denied, ELEVATED, LSA Protection off: a raised gap (WARNING), never a deferral' \
                   'LSA Protection state UNKNOWN, elevated: WARNING naming the unknown state, never OK' \
                   'no state file at all (empty state) on a standard-user token: DEFERRED, never OK'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]'); [ "$n" -ge 31 ] || { echo "only $n case(s)"; exit 1; }
      - name: pending_reboot_check -- a pending reboot names what is queued and whether the flag predates the last boot; an unreadable flag is a gap
        run: |
          out=$(pwsh -NoProfile -File tools/pending_reboot_check.ps1 -SelfTest); echo "$out"
          for n in 'written before the boot: STALE' \
                   'written after the boot: fresh' \
                   'a dangling last entry (odd length' \
                   'a registry read failure is a declared gap' \
                   'a single WARNING line even with three flags' \
                   'nothing pending: the OK line' \
                   '*1 marker on a delete: the path prints clean' \
                   'a rename whose destination carries *1!'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]'); [ "$n" -ge 32 ] || { echo "only $n case(s)"; exit 1; }
      - name: lsa_protection_check -- the boot event is the fact, the registry value the intent; unknown is a raised gap
        run: |
          out=$(pwsh -NoProfile -File tools/lsa_protection_check.ps1 -SelfTest); echo "$out"
          for n in 'Event 12 this boot with NO RunAsPPL value: ON by event' \
                   'RunAsPPL=2 with no Event 12 and a log that covers the boot: PENDING' \
                   'no Event 12, log rolled past the boot, RunAsPPL=1: ON by registry' \
                   'registry unreadable, no Event 12, log rolled: UNKNOWN is a raised gap'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]'); [ "$n" -ge 12 ] || { echo "only $n case(s)"; exit 1; }
      - name: vt_ip_check -- a single non-top-tier VirusTotal engine is INFO, not a finding
        run: |
          out=$(pwsh -NoProfile -File tools/vt_ip_check.ps1 -SelfTest); echo "$out"
          for n in 'one non-top-tier engine: LOW credibility, [INFO], does not count toward IOC_HITS' \
                   'one engine, but top-tier: boosted to MED, [WARNING], counts' \
                   'five malicious: HIGH, [CRITICAL]'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]'); [ "$n" -ge 9 ] || { echo "only $n case(s)"; exit 1; }
      - name: verdict_audit -- a raised finding must be printed, or at least declared SKIPPED
        run: |
          out=$(pwsh -NoProfile -File tools/verdict_audit.ps1 -SelfTest); echo "$out"
          for n in 'printed but not raised: a [WARNING] line under a CLEAN verdict is a defect' \
                   'raised from a [SKIPPED] line (a blind spot raised on purpose): not a defect of THIS rule' \
                   'raised with NOTHING printed (no finding line, no [SKIPPED]): the inverse defect' \
                   'anything before the first section banner is outside every section'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]'); [ "$n" -ge 9 ] || { echo "only $n case(s)"; exit 1; }
      - name: threat_list_seed -- a runtime IOC copy behind the release is replaced and reported
        run: |
          out=$(pwsh -NoProfile -File tools/threat_list_seed.ps1 -SelfTest); echo "$out"
          for n in 'a runtime copy OLDER than the release, different content: Replace' \
                   'a runtime copy -updateTTP wrote AFTER the release (newer date, more rows): Keep' \
                   'same date, different content (a fork nobody chose): Replace' \
                   'directory pass: the stale registry list is replaced'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]'); [ "$n" -ge 14 ] || { echo "only $n case(s)"; exit 1; }
      - name: report_safety -- audit visibility is never OK by default
        run: |
          out=$(pwsh -NoProfile -File tools/report_safety.ps1 -SelfTest); echo "$out"
          for n in 'auditpol deferred, no ON line -> DEFERRED, never OK' \
                   'a report with no audit-policy lines at all -> UNKNOWN, never OK' \
                   'one OFF among ON lines: REDUCED'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]'); [ "$n" -ge 8 ] || { echo "only $n case(s)"; exit 1; }

  orphan-else-lint:
    name: "Orphaned else: no clause detached from its if (parses, then dies at runtime)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # An orphaned `else` is syntactically a command name, so a parse check
      # passes and the script dies at runtime after printing its OK lines.
      # The AST sees it; this runs anywhere.
      - name: Run tools/lint_orphan_else.ps1
        run: pwsh -NoProfile -File tools/lint_orphan_else.ps1

  threat-list-dates-lint:
    name: "Threat lists: a content change carries a new verified date (digest in the header)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ttp_manifest.txt changed content in three commits while its
      # "# Last verified" header stayed at 2026-06-06; the seed step then
      # replaced the runtime copy "same date, content differs", right only
      # because ties go to the shipped file. The header now carries a digest
      # of the entries; this fails when they drift from it.
      - name: Run tools/lint_threat_list_dates.ps1
        run: pwsh -NoProfile -File tools/lint_threat_list_dates.ps1
      - name: The lint must fail on a changed entry, a lost header, a future date, and must match the sync tool's digest rule
        run: pwsh -NoProfile -File tools/lint_threat_list_dates.ps1 -SelfTest

  noninteractive-lint:
    name: "Batch lint: every PowerShell the bats start runs -NonInteractive"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A PowerShell that stops to ask waits where nobody sees it: every helper
      # writes into the report, >nul, the console-log tee or field_test's pipe.
      # Under a Group Policy Unrestricted policy a marked script stopped at such
      # a question and the audit hung (PR #245, measured). The flag must come
      # before -File/-Command; after them PowerShell hands it to the script.
      - name: Run tools/lint_noninteractive.ps1
        run: pwsh -NoProfile -File tools/lint_noninteractive.ps1
      - name: The lint must fail on a launch without the flag, and on one with it after -File
        run: pwsh -NoProfile -File tools/lint_noninteractive.ps1 -SelfTest

  arg0-after-shift-lint:
    name: "Batch lint: no %0-derived path after the parse loop's shift"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cmd's `shift` moves %0 too. After the switch-parsing loop, %0 is the
      # last switch typed, and %~f0 resolved it against the current directory:
      # the RunOnce resume entry pointed at "<checkout>\-noVtSelf" -resume on
      # the owner's 2026-09-26 run, so no interrupted run could ever resume,
      # and SCRIPT_DIR was the current directory. No report line and no test
      # could see it: everyone runs the bat from its own directory.
      - name: Run tools/lint_arg0.ps1
        run: pwsh -NoProfile -File tools/lint_arg0.ps1
      - name: The lint must fail on a re-introduced %~f0 after the shift
        run: pwsh -NoProfile -File tools/lint_arg0.ps1 -SelfTest

  ps51-portability-lint:
    name: "5.1 portability: no source that parses on 5.1 and means something else"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The class no parse check can see. Windows PowerShell 5.1 decodes a
      # BOM-less .ps1 as ANSI (pwsh reads UTF-8) and has no `u{...} / `e escape
      # -- it drops the backtick and keeps the literal text. Both ACCEPT the
      # source and mean something else by it.
      #
      # hosts_check.ps1 shipped both at once: its U+FEFF strip compiled to a
      # duplicate of the line above it on 5.1, so a BOM left the first HOSTS
      # entry unparsed -- a blackholed windowsupdate.microsoft.com on line 1
      # would have been invisible -- and the test that should have caught it
      # was written `u{FEFF} and so asserted against literal text for four
      # merges. Real-Windows CI caught it; this lint is why it cannot return.
      - name: Run tools/lint_ps51_portability.ps1
        run: pwsh -NoProfile -File tools/lint_ps51_portability.ps1
      - name: The lint must fail on each reintroduced class, and not on prose
        run: pwsh -NoProfile -File tools/lint_ps51_portability.ps1 -SelfTest

  docs-drift-lint:
    name: "Docs lint: the README matches the code"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A retrospective found the README claiming 48 techniques when the audit
      # referenced 81, and three implemented switches -- including -baseline,
      # the tool's strongest signal against a signature-less targeted implant --
      # documented only in the script's own -help and absent from the project
      # page. Nothing read the prose, so nothing caught it.
      - name: Run lint_docs_drift.ps1
        run: pwsh -NoProfile -File tools/lint_docs_drift.ps1

  report-echo-lint:
    name: "Report lint: every printed line reaches the report and every printed command runs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One real field run exposed three classes at once. Two narrative lines
      # had an odd number of double quotes, so cmd never saw the `>>` as a
      # redirection operator: text, operator and report path all went to the
      # CONSOLE and the report lost the lines. 90 display lines carried `^(`
      # `^)` `^|` inside quotes, where cmd leaves the caret alone, so the
      # report printed stray carets and the `wevtutil ... /q:"...^(EventID=
      # 4720^)..."` lines it told the reader to paste were rejected by
      # wevtutil. And 22 `Command:` lines per bat had been truncated -- a lost
      # opening paren, or a hashtable cut mid-literal -- so they read as
      # authoritative and could not run. None of it touched detection, which
      # is why every other gate here stayed green over it.
      - name: Run tools/lint_report_echo.ps1
        run: pwsh -NoProfile -File tools/lint_report_echo.ps1
      - name: The lint must fail on each reintroduced class
        run: pwsh -NoProfile -File tools/lint_report_echo.ps1 -SelfTest

  quoted-paths-lint:
    name: "No path between single quotes in the PowerShell the bats run (a user named O'Brien)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A profile folder like C:\Users\O'Brien holds the apostrophe that ends a
      # single-quoted PowerShell string: the dashboard, the remediation script,
      # the [CRITICAL] census and the Section 11 history were parse errors that
      # printed nothing for such a user. Paths are read from the environment;
      # a printed Command: line doubles the apostrophe with %X:'=''%.
      - name: Run tools/lint_quoted_paths.ps1
        run: pwsh -NoProfile -File tools/lint_quoted_paths.ps1
      - name: Run tools/lint_quoted_paths.ps1 -SelfTest
        run: pwsh -NoProfile -File tools/lint_quoted_paths.ps1 -SelfTest

  report-command-probe-selftest:
    name: "Probe self-test: a printed command that cannot run must fail the build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The probe itself needs Windows (it runs reg/wevtutil/Defender queries),
      # so the real run lives in windows-smoke. Its self-test is platform-free
      # and belongs on every PR: it proves a malformed command FAILS, a
      # mutating one is REFUSED rather than executed, an unclassifiable line
      # FAILS rather than being skipped quietly, and that nothing refused can
      # reach the executor -- `continue` inside a PowerShell `switch` leaves
      # the switch and not the loop, and an early version of this file fell
      # through after deciding to skip the RunOnce `reg add`.
      - name: Run tools/report_command_probe.ps1 -SelfTest
        run: pwsh -NoProfile -File tools/report_command_probe.ps1 -SelfTest

  exec-probe-selftest:
    name: "exec_probe: the audit can tell when PowerShell will not run its helpers"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The bats refuse to run blind when a Group Policy execution policy or a
      # language lockdown stops their helpers; the probe's state line is what
      # they read. The refusal itself is exercised on Windows (windows-smoke,
      # readonly-field-test: a planted MachinePolicy and __PSLockdownPolicy).
      - name: Run tools/exec_probe.ps1 -SelfTest
        run: pwsh -NoProfile -File tools/exec_probe.ps1 -SelfTest
      # The bats must reach :exec_probe_ok ONLY through an ok Mark of the Web
      # verdict (a missing verdict is never read as ok). Windows proves the
      # behaviour (windows-smoke, readonly-field-test); this keeps the two bats'
      # wiring. -NonInteractive on every launch is the noninteractive-lint job.
      - name: "Both bats: only an ok verdict reaches :exec_probe_ok, and the probe is asked for it"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          foreach ($f in 'doze_sec.bat', 'doze_sec_noAdmin.bat') {
            $lines = Get-Content -LiteralPath $f
            $probe = @(for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '-File "%SCRIPT_DIR%tools\\exec_probe\.ps1"') { $i } })
            if ($probe.Count -ne 1) { $bad += "${f}: expected one exec_probe call, found $($probe.Count)"; continue }
            $pl = $lines[$probe[0]]
            if ($pl -notmatch '-MotwFile "%TEMP%\\dz_exec_motw\.txt"') { $bad += "${f}:$($probe[0] + 1): the probe is not asked for its Mark of the Web verdict" }
            # -NonInteractive on the probe, and on every other launch, is
            # tools/lint_noninteractive.ps1's rule (the noninteractive-lint job).
            # Every jump to the label, in any spelling cmd accepts (goto x,
            # goto:x, call :x), and no fall-through into it.
            $toOk = @(for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -notmatch '^\s*(::|rem\s)' -and $lines[$i] -match '(?i)\b(goto|call)\s*:?exec_probe_ok\b') { $i } })
            if ($toOk.Count -ne 1 -or $lines[$toOk[0]] -ne 'if "%EXEC_MOTW%"=="ok" goto :exec_probe_ok') { $bad += "${f}: :exec_probe_ok must be reached only by: if `"%EXEC_MOTW%`"==`"ok`" goto :exec_probe_ok" }
            $lbl = [array]::IndexOf($lines, ':exec_probe_ok')
            if ($lbl -lt 1 -or $lines[$lbl - 1] -ne 'goto :end_script') { $bad += "${f}: the line before :exec_probe_ok must be goto :end_script, or the blocked path falls through into it" }
            # The verdict is read only after the language mode passed: under
            # ConstrainedLanguage the probe still writes ok on a machine with
            # no Group Policy.
            $ran = [array]::IndexOf($lines, ':exec_probe_ran')
            $first = -1
            if ($ran -ge 0) { for ($i = $ran + 1; $i -lt $lines.Count; $i++) { if ($lines[$i] -notmatch '^\s*(::|rem\s|$)') { $first = $i; break } } }
            if ($first -lt 0 -or $lines[$first] -ne 'if "%EXEC_MOTW%"=="ok" goto :exec_probe_ok') { $bad += "${f}: the EXEC_MOTW check must be the first command after :exec_probe_ran" }
            $toRan = @(for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -notmatch '^\s*(::|rem\s)' -and $lines[$i] -match '(?i)\b(goto|call)\s*:?exec_probe_ran\b') { $i } })
            if ($toRan.Count -ne 1 -or $lines[$toRan[0]] -ne 'if "%EXEC_STATE%"=="ok|FullLanguage" goto :exec_probe_ran') { $bad += "${f}: :exec_probe_ran must be reached only once the state line reads ok|FullLanguage" }
            if ($ran -lt 1 -or $lines[$ran - 1] -ne 'goto :exec_blind') { $bad += "${f}: the line before :exec_probe_ran must be goto :exec_blind, or the refused path falls through into it" }
            $clear = [array]::IndexOf($lines, 'set "EXEC_MOTW="')
            $read = [array]::IndexOf($lines, 'if exist "%TEMP%\dz_exec_motw.txt" set /p EXEC_MOTW=<"%TEMP%\dz_exec_motw.txt"')
            if ($clear -lt 0 -or $read -lt 0 -or $clear -gt $read) { $bad += "${f}: EXEC_MOTW must be cleared before its set /p (set /p from an empty file keeps the old value)" }
          }
          if ($bad) { $bad | ForEach-Object { Write-Host "FAIL: $_" }; exit 1 }
          Write-Host 'OK: both bats reach :exec_probe_ok only through an ok verdict, and ask the probe for it'

  shared-copies-lint:
    name: "Shared helpers: every copy stays identical"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tools are self-contained by design, so a helper several of them
      # need is copied. A fix made in one copy and not the others leaves two
      # tools answering the same question differently; pending_reboot_check's
      # copy of Get-RegKeyLastWrite had already drifted when this was added.
      - name: Run tools/lint_shared_copies.ps1
        run: pwsh -NoProfile -File tools/lint_shared_copies.ps1
      - name: Run tools/lint_shared_copies.ps1 -SelfTest
        run: pwsh -NoProfile -File tools/lint_shared_copies.ps1 -SelfTest

  ioc-matchers:
    name: "Sections 18a/18f/18g: select_lines, and a list with nothing to match is NOT performed, never OK"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tools/select_lines.ps1 -SelfTest
        run: pwsh -NoProfile -File tools/select_lines.ps1 -SelfTest
      # Section 18's summary counts the checks that could not run, so a
      # partial sweep is never an all-clear.
      - name: Run tools/count_gaps.ps1 -SelfTest
        run: pwsh -NoProfile -File tools/count_gaps.ps1 -SelfTest
      # The staged matchers (18b, 18c, 18d, 18e, 18h) printed [SKIPPED] or
      # [INFO] and raised nothing when their list was missing or Windows would
      # not list what they match; 18a, 18g and 18k did the same in the bat.
      # Render each block as cmd writes it and RUN it with no list and with a
      # comments-only list; check the bats raise each gap under its technique.
      - name: Run tests/section18_gaps.ps1 -SelfTest
        run: pwsh -NoProfile -File tests/section18_gaps.ps1 -SelfTest
      - name: "Section 18: every matcher that cannot run says NOT performed and raises it (both bats)"
        run: pwsh -NoProfile -File tests/section18_gaps.ps1 -Mode Missing
      - name: "Section 18: the shipped lists on Linux (no Windows listings: 18b/18c/18e gap, 18d/18h OK)"
        run: pwsh -NoProfile -File tests/section18_gaps.ps1 -Mode Shipped
      # findstr /g: read a broken list as [OK]: the errorlevel checked was the
      # SECOND findstr's in the pipe. Each of 18a, 18f and 18g must call
      # select_lines with its list and give exit 0 a raise, exit 1 the [OK]
      # line, and anything else a raised NOT-performed line -- in both bats.
      - name: 18a, 18f and 18g branch three ways on select_lines' exit, in both bats
        shell: pwsh
        run: |
          # Structural, line by line: the select_lines call, the exit captured
          # on the next line, then exactly 0 -> :<sec>_hit, 1 -> :<sec>_clean,
          # and anything else straight into the raised NOT-performed line. No
          # other way into :<sec>_clean, and the hit label raises.
          $specs = @(
            @{ S = '18a'; List = 'ioc_processes.txt'; Var = '_SEL18A';      Gap = 'Process IOC match NOT performed' },
            @{ S = '18f'; List = 'ioc_domains.txt';   Var = '_SEL18F';      Gap = 'C2 domain IOC match NOT performed' },
            @{ S = '18g'; List = 'ioc_lolbins.txt';   Var = '_SELECT_EXIT'; Gap = 'LOLBin pattern match NOT performed' })
          function Get-Code([string[]]$lines) { @($lines | Where-Object { $_.Trim() -and $_ -notmatch '^\s*(::|rem\s)' }) }
          function Get-Defects([string]$text, [string]$name) {
            $bad = @()
            foreach ($sp in $specs) {
              $m = [regex]::Match($text, '(?s)--- \[' + $sp.S + '\].*?(?=--- \[18[a-z]\]|$)')
              if (-not $m.Success) { $bad += ("{0}: section {1} not found -- this check is broken, not the code" -f $name, $sp.S); continue }
              $code = Get-Code ($m.Value -split "\r?\n")
              $tag = $name + ' ' + $sp.S
              if (@($code | Where-Object { $_ -match 'findstr /i /g:' }).Count) { $bad += "${tag}: still matches with findstr /g:" }
              $ci = [array]::FindIndex([string[]]$code, [Predicate[string]]{ param($l) $l -match ('select_lines\.ps1" -Path "[^"]+" -PatternFile "%IOCDIR%\\' + [regex]::Escape($sp.List) + '"') })
              if ($ci -lt 0) { $bad += "${tag}: no select_lines -PatternFile $($sp.List) call outside a comment"; continue }
              $want = @(
                ('^set "' + $sp.Var + '=!errorlevel!"$'),
                ('^if "!' + $sp.Var + '!"=="0" goto :sec' + $sp.S + '_hit$'),
                ('^if "!' + $sp.Var + '!"=="1" goto :sec' + $sp.S + '_clean$'),
                ('^echo \[WARNING\] ' + [regex]::Escape($sp.Gap)),
                '^call :dz_finding WARNING 18 ')
              for ($k = 0; $k -lt $want.Count; $k++) {
                $l = if ($ci + 1 + $k -lt $code.Count) { $code[$ci + 1 + $k].Trim() } else { '' }
                # 18g deletes its temp file between the call and the branch.
                if ($k -eq 1 -and $l -match '^del ') { $ci++; $l = $code[$ci + 1 + $k].Trim() }
                if ($l -notmatch $want[$k]) { $bad += ("{0}: line {1} after the select_lines call should match /{2}/, found: {3}" -f $tag, ($k + 1), $want[$k], $l); break }
              }
              $cleanGotos = @($code | Where-Object { $_ -match ('goto :sec' + $sp.S + '_clean\b') }).Count
              if ($cleanGotos -ne 1) { $bad += "${tag}: $cleanGotos ways into :sec$($sp.S)_clean -- only exit 1 may lead there" }
              $hi = [array]::FindIndex([string[]]$code, [Predicate[string]]{ param($l) $l.Trim() -eq (':sec' + $sp.S + '_hit') })
              if ($hi -lt 0 -or $code[$hi + 1] -notmatch '^echo \[(WARNING|CRITICAL)\]' -or -not (@($code[($hi + 1)..([Math]::Min($code.Count - 1, $hi + 3))] | Where-Object { $_ -match '^call :dz_finding (WARNING|CRITICAL) 18 ' }).Count)) { $bad += "${tag}: :sec$($sp.S)_hit does not print and raise the finding" }
            }
            return $bad
          }
          $all = @()
          foreach ($bat in 'doze_sec.bat', 'doze_sec_noAdmin.bat') { $all += Get-Defects ([IO.File]::ReadAllText($bat)) $bat }
          # Every mutation the review named must fail this check.
          $base = [IO.File]::ReadAllText('doze_sec.bat')
          $mutations = @(
            @{ N = 'exit 0 sent to [OK]';             F = 'if "!_SEL18A!"=="0" goto :sec18a_hit';   T = 'if "!_SEL18A!"=="0" goto :sec18a_clean' },
            @{ N = 'exit 1 sent to the raise';        F = 'if "!_SEL18A!"=="1" goto :sec18a_clean'; T = 'if "!_SEL18A!"=="1" goto :sec18a_hit' },
            @{ N = 'the old two-way branch';          F = 'if "!_SEL18F!"=="1" goto :sec18f_clean'; T = 'goto :sec18f_clean' },
            @{ N = 'errorlevel tested before capture'; F = 'set "_SEL18F=!errorlevel!"';            T = ("if errorlevel 1 goto :sec18f_clean`r`n" + 'set "_SEL18F=!errorlevel!"') },
            @{ N = 'a second way into [OK]';          F = 'if "!_SELECT_EXIT!"=="1" goto :sec18g_clean'; T = ('if "!_SELECT_EXIT!"=="1" goto :sec18g_clean' + "`r`n" + 'goto :sec18g_clean') },
            @{ N = 'the select_lines call commented out'; F = '"%PWSH%" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%SCRIPT_DIR%tools\select_lines.ps1" -Path "%TEMP%\dz_proc18a.tmp"'; T = ':: "%PWSH%" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%SCRIPT_DIR%tools\select_lines.ps1" -Path "%TEMP%\dz_proc18a.tmp"' })
          foreach ($mu in $mutations) {
            if (-not $base.Contains($mu.F)) { throw ("mutation '{0}' found nothing to change -- this check no longer looks at the code it was written for" -f $mu.N) }
            $idx = $base.IndexOf($mu.F)
            $mut = $base.Substring(0, $idx) + $mu.T + $base.Substring($idx + $mu.F.Length)
            if (-not @(Get-Defects $mut 'mutated').Count) { throw ("the check did not fail on the mutation '{0}' -- it cannot catch that defect" -f $mu.N) }
          }
          if ($all.Count) { $all | ForEach-Object { Write-Host "[FAIL] $_" }; exit 1 }
          Write-Host ("[OK] 18a, 18f and 18g branch exactly three ways on select_lines' exit in both bats; all {0} mutations fail as they should." -f $mutations.Count)
          exit 0

  usb-stick-selftest:
    name: "USB stick: copy only, USB only, harness off, returned stick checked"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tools/make_usb_stick.ps1 never formats or writes boot files; its target
      # rule refuses anything not on the USB bus, the boot/system disk and the
      # Windows drive; the copy leaves the plant harness off; -Verify trusts
      # only the manifest kept on the laptop. The NTFS stream cases run in
      # windows-smoke.
      - name: Run tools/make_usb_stick.ps1 -SelfTest
        run: pwsh -NoProfile -File tools/make_usb_stick.ps1 -SelfTest
      # A run that ends after INIT 8 created the RunOnce resume entry must
      # remove it. :end_script does; an early `goto :final_exit` skips that, so
      # each one needs its own delete. The VirusTotal self-check abort (exit 7)
      # had none until 2026-10-09.
      - name: Every early exit after INIT 8 removes the RunOnce resume entry
        shell: pwsh
        run: |
          function Get-Defects([string[]]$lines, [string]$name) {
            $init8 = [array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -match '\[INIT 8/14\] RunOnce' })
            $end = [array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -match '^:end_script\b' })
            if ($init8 -lt 0 -or $end -lt 0) { return @("${name}: INIT 8 or :end_script not found -- this check is broken, not the code") }
            $bad = @()
            for ($i = $init8; $i -lt $end; $i++) {
              if ($lines[$i] -notmatch 'goto\s+:final_exit\b') { continue }
              $win = $lines[[Math]::Max(0, $i - 6)..($i - 1)] -join "`n"
              if ($win -notmatch 'reg delete "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce" /v "\*%SCRIPT_NAME%_resume"') { $bad += ("{0}:{1}: goto :final_exit after INIT 8 without removing the RunOnce resume entry" -f $name, ($i + 1)) }
            }
            return $bad
          }
          $all = @()
          $seen = 0
          foreach ($b in 'doze_sec.bat', 'doze_sec_noAdmin.bat') {
            $lines = [IO.File]::ReadAllLines($b)
            $seen += @($lines | Where-Object { $_ -match 'goto\s+:final_exit\b' }).Count
            $all += Get-Defects $lines $b
          }
          if ($seen -lt 2) { throw "found only $seen goto :final_exit -- this check is not looking at the code it was written for" }
          # Mutation: the same check must fail with the delete removed.
          $mut = [IO.File]::ReadAllLines('doze_sec.bat') | Where-Object { $_ -notmatch 'reg delete "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce" /v "\*%SCRIPT_NAME%_resume" /f >nul 2>&1$' -or $_ -notmatch '^\s{12}' }
          if (-not @(Get-Defects ([string[]]$mut) 'mutated').Count) { throw 'the check did not fail on a copy with the exit-7 delete removed -- it cannot catch the defect' }
          if ($all.Count) { $all | ForEach-Object { Write-Host "[FAIL] $_" }; exit 1 }
          Write-Host "[OK] every goto :final_exit after INIT 8 removes the RunOnce resume entry (both bats); the mutation fails as it should"

  bits-history-grade:
    name: "BITS history: the schema comes from the machine, not from a write-up"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Section 5's live check reads the jobs BITS has QUEUED; a transfer that
      # finished is gone from it. This check reads what Windows recorded, and
      # every third-party account of those events disagrees with the others --
      # so the rule resolves field names from the machine's own provider schema
      # and decides what each value IS from its shape. The whole of that is
      # pure, so it runs here.
      - name: Grade recorded transfers (bare address, autostart write, staging program, recorded upload)
        run: pwsh -NoProfile -File tools/bits_history.ps1 -SelfTest
      # By NAME, so a case cannot be deleted and still satisfy a count.
      - name: The judgements stay pinned by name
        run: |
          out=$(pwsh -NoProfile -File tools/bits_history.ps1 -SelfTest)
          echo "$out"
          echo "$out" | grep -q 'a localized field name still yields the remote, because the shape decides' \
            || { echo 'the roles could go back to being keyed on field names a write-up supplied'; exit 1; }
          echo "$out" | grep -q 'a record with nothing identifiable resolves nothing, rather than guessing' \
            || { echo 'an unidentifiable record could be graded as something'; exit 1; }
          echo "$out" | grep -q 'records whose fields cannot be named are a declared gap, not an all-clear' \
            || { echo 'a channel whose schema is unreadable could read as clean'; exit 1; }
          echo "$out" | grep -q 'a disabled channel is SKIPPED, raising nothing' \
            || { echo 'a channel that records nothing could read as an all-clear'; exit 1; }
          echo "$out" | grep -q 'a standard-user token gets a declared DEFERRAL, never a row' \
            || { echo 'a token-caused gap could become a ledger row again'; exit 1; }
          echo "$out" | grep -q 'a part-way read still reports the records it had' \
            || { echo 'a failed read could throw away what it already found'; exit 1; }
          echo "$out" | grep -q 'a recorded upload raises its own T1048 row' \
            || { echo 'a file that already left could be booked against Persistence'; exit 1; }
          echo "$out" | grep -q 'a directory merely named public is not the shared Public folder' \
            || { echo 'the Public-folder regex could go back to matching any directory named public'; exit 1; }
          echo "$out" | grep -q "the real Edge updater's own transfer" \
            || { echo 'the benign twin at the heart of this rule is untested'; exit 1; }
          echo "$out" | grep -q 'the all-clear names its coverage span' \
            || { echo 'the all-clear could stop saying what it covered -- these logs roll over'; exit 1; }
          echo "$out" | grep -q 'a crafted URL cannot forge a line of its own' \
            || { echo 'a URL could inject its own severity tag into the report'; exit 1; }
          echo "$out" | grep -q 'and names the newest transfer, so an all-clear can be checked by hand' \
            || { echo 'the all-clear could stop naming what it read, leaving only a count to trust'; exit 1; }
          echo "$out" | grep -q 'the newest-transfer line takes the newest record that DESCRIBES a transfer' \
            || { echo 'the hand-checkable line could vanish again whenever the newest record is a job-created event'; exit 1; }
          echo "$out" | grep -q "and the schema line is the union across records" \
            || { echo 'the schema line could go back to reporting one record as if it were the schema'; exit 1; }
          echo "$out" | grep -q 'an installer stub whose signature could not be checked is NOT a finding' \
            || { echo 'every browser installer stub could start reading as a staging-folder program'; exit 1; }
          echo "$out" | grep -q 'a truncated read says so AND still reports what it graded' \
            || { echo 'a channel bigger than the cap could read clean having declared nothing'; exit 1; }
          echo "$out" | grep -q 'with no direction recorded, the limitation is stated as context and raises nothing' \
            || { echo 'a completed upload could be graded clean with no word about direction'; exit 1; }
          echo "$out" | grep -q 'the same record in a different insertion order resolves identically' \
            || { echo 'which value gets graded could go back to depending on hashtable order'; exit 1; }
          echo "$out" | grep -q "records naming this audit's own test plants are not findings" \
            || { echo 'this audit could report its own CI plants as findings for ever, as the 7045 records once were'; exit 1; }
          echo "$out" | grep -q 'and the exclusion is declared, counted and NAMES what it dropped' \
            || { echo 'the plant exclusion could become silent -- it must print what it dropped'; exit 1; }
          echo "$out" | grep -q 'a real bare-address transfer beside our plants still raises' \
            || { echo 'the exclusion could swallow a real finding sitting beside a plant'; exit 1; }
          echo "$out" | grep -q 'a path in a client-named field is still the local file' \
            || { echo 'a client-named field could take the local path place and lose the autostart rule'; exit 1; }
          n=$(echo "$out" | grep -c '^\[OK\]')
          [ "$n" -ge 72 ] || { echo "self-test ran only $n case(s) -- it is not exercising the rule"; exit 1; }

  archive-staging-grade:
    name: "Archive staging: a password or a volume set made here raises; a download or a plain local zip never does"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Section 14's T1560 check parses ZIP, RAR 4.x/5.0, 7z and CAB headers
      # from the format owners' published layouts and grades on the Mark of
      # the Web. Every parser and every verdict row is pure and runs on
      # synthetic archives built byte by byte, so the whole rule runs here.
      - name: Grade archives in staging folders (headers parsed, the mark decides, the twins stay quiet)
        run: pwsh -NoProfile -File tools/archive_staging.ps1 -SelfTest
      # By NAME, so a case cannot be deleted and still satisfy a count.
      - name: The judgements stay pinned by name
        run: |
          out=$(pwsh -NoProfile -File tools/archive_staging.ps1 -SelfTest)
          echo "$out"
          echo "$out" | grep -q 'a DOWNLOADED archive is context whatever it holds -- it came in, it was not packed here' \
            || { echo 'a browser download could be reported as data packed to leave'; exit 1; }
          echo "$out" | grep -q 'a plain single-volume local archive is context, never a row' \
            || { echo 'every zip Explorer makes could become a finding'; exit 1; }
          echo "$out" | grep -q 'password-protected AND split, made here, is CRITICAL -- the shape every cited intrusion used' \
            || { echo 'the shape the intrusion reports describe could stop being CRITICAL'; exit 1; }
          echo "$out" | grep -q "a PLAIN local archive that packs credential files is WARNING, not CRITICAL -- a person's own backup is the twin" \
            || { echo 'a backup zip holding a .pst could become an incident-response trigger'; exit 1; }
          echo "$out" | grep -q 'a 7z compressed header that will not decompress is NOT DETERMINABLE, neither clean nor password-protected' \
            || { echo 'a 7z whose password cannot be read could read as clean'; exit 1; }
          echo "$out" | grep -q 'a 7z made with -p but WITHOUT -mhe: its compressed header is decompressed, 7zAES is found, the names are read' \
            || { echo "7-Zip's default password shape could go back to not determinable"; exit 1; }
          echo "$out" | grep -q 'a plain 7z as 7-Zip makes it by default (compressed header, no password) is now read as NOT password-protected' \
            || { echo 'every plain 7z in Public could read as maybe password-protected again'; exit 1; }
          echo "$out" | grep -q 'LZMA: a stream another encoder made decodes byte for byte to the 7z header it was made from' \
            || { echo 'the LZMA decoder could stop being checked against an independent encoder'; exit 1; }
          echo "$out" | grep -q 'LZMA: an end marker before the declared size stops the decode and says so, never complete' \
            || { echo 'the distance decode could overflow 32 bits unnoticed'; exit 1; }
          echo "$out" | grep -q 'a compressed header that fails its CRC once decompressed is not determinable, never clean' \
            || { echo 'a corrupt decode could be read as a plain archive'; exit 1; }
          echo "$out" | grep -q 'a header decoded only in part is trusted for what it shows: a 7zAES coder in the part is certain, its absence is not' \
            || { echo 'a header too large to decode could be cleared from its first bytes'; exit 1; }
          echo "$out" | grep -q 'LZMA: forty streams of random bytes each end at once' \
            || { echo 'a crafted compressed header could hang or crash the audit'; exit 1; }
          echo "$out" | grep -q 'LZMA: a declared size of 2^40 is capped' \
            || { echo 'a header claiming a huge size could allocate it'; exit 1; }
          echo "$out" | grep -q 'twenty CRC records in a PackInfo are walked to their end' \
            || { echo 'a fixed-count loop could hide the 7zAES coder again'; exit 1; }
          echo "$out" | grep -q 'a 7zAES id written with a leading zero byte (00 06 F1 07 01) is still 7zAES' \
            || { echo 'a zero-padded coder id could read as no password again'; exit 1; }
          echo "$out" | grep -q 'a coder id this audit cannot place is named and NOT read as "no password"' \
            || { echo 'an unknown coder could be cleared'; exit 1; }
          echo "$out" | grep -q 'a file name after seventy other file properties is still read' \
            || { echo 'a credential file could be hidden behind dummy properties'; exit 1; }
          echo "$out" | grep -q 'more than 64 folders (a non-solid 7z): the 7zAES coder in folder 101 is found' \
            || { echo 'a non-solid 7z could go back to not determinable'; exit 1; }
          echo "$out" | grep -q 'with the decode allowance spent, each compressed header is named as not decompressed' \
            || { echo 'decoys could exhaust the decode time silently'; exit 1; }
          echo "$out" | grep -q 'a set part whose header cannot be read is NOT cleared by a sibling' \
            || { echo 'a decoy volume could clear a set'; exit 1; }
          echo "$out" | grep -q 'a 7z EncodedHeader coded with 7zAES (-mhe) is password-protected with names hidden' \
            || { echo 'the 7z header-encryption shape could go unrecognised'; exit 1; }
          echo "$out" | grep -q 'a 7z volume set read across its volumes yields the header from the last one' \
            || { echo 'a real 7-Zip volume set could lose its password verdict to the first volume alone'; exit 1; }
          echo "$out" | grep -q 'RAR 4.x MHD_PASSWORD (headers encrypted, -hp) is password-protected with names hidden, and MHD_VOLUME a volume' \
            || { echo 'the RAR 4.x -hp shape could go unrecognised'; exit 1; }
          echo "$out" | grep -q 'a RAR 5.0 archive-encryption header (type 4, -hp) is password-protected with names hidden' \
            || { echo 'the RAR 5.0 -hp shape could go unrecognised'; exit 1; }
          echo "$out" | grep -q 'a ZipCrypto entry (general-purpose bit 0) is password-protected, names still visible' \
            || { echo 'a password-protected zip could read as plain'; exit 1; }
          echo "$out" | grep -q 'an Office/MSIX package is recognised by its \[Content_Types\].xml entry' \
            || { echo 'every Word document could be graded as an archive'; exit 1; }
          echo "$out" | grep -q 'a fake end signature inside the comment does not fool the tail scan' \
            || { echo 'a crafted zip comment could redirect the parser'; exit 1; }
          echo "$out" | grep -q 'a RAR renamed .dat is still a RAR by signature, headers encrypted' \
            || { echo 'the renamed-archiver shape (NICKEL) could be missed by name'; exit 1; }
          echo "$out" | grep -q 'a folder an administrator cannot list is a raised gap, and the all-clear is withheld' \
            || { echo 'an unlistable staging folder could read as clean'; exit 1; }
          echo "$out" | grep -q 'the same folder on a standard-user token is a counted DEFERRAL, never a row, and no all-clear' \
            || { echo 'a token-caused gap could become a ledger row again'; exit 1; }
          echo "$out" | grep -q 'and what WAS read is still stated, scoped, so a partial run never goes quiet' \
            || { echo 'a partial run could stop saying what it covered'; exit 1; }
          echo "$out" | grep -q 'the volumes of one set are ONE finding, the first part speaking for the rest' \
            || { echo 'a fifty-part set could become fifty rows'; exit 1; }
          echo "$out" | grep -q 'a crafted file or entry name cannot forge a line of its own' \
            || { echo 'a file name could inject its own severity tag into the report'; exit 1; }
          echo "$out" | grep -q 'the same archives in a different order produce the same report, CRITICAL first' \
            || { echo 'the report could depend on enumeration order'; exit 1; }
          echo "$out" | grep -q 'caps and exclusions are printed as context, and the coverage line is then scoped, never an all-clear' \
            || { echo 'a capped run could read clean having declared nothing'; exit 1; }
          echo "$out" | grep -q 'finishes at once and is not read as clean' \
            || { echo 'a crafted 7z header could hang the whole audit again'; exit 1; }
          echo "$out" | grep -q 'a FORGED mark does not clear the strongest shape where no browser saves (Public): WARNING' \
            || { echo 'one Set-Content -Stream could clear a password-protected volume set'; exit 1; }
          echo "$out" | grep -q 'live: an archive renamed .tmp, .partial or .crdownload is found by its signature' \
            || { echo 'renaming an archive to .tmp could hide it again'; exit 1; }
          echo "$out" | grep -q 'enumeration: the file cap is PER FOLDER, so a full folder cannot starve the next one' \
            || { echo 'a temp folder full of junk could blind every folder after it'; exit 1; }
          echo "$out" | grep -q 'a password-protected ZIP with one byte appended is still password-protected' \
            || { echo 'one appended byte could turn a protected zip into a plain one'; exit 1; }
          echo "$out" | grep -q 'live: a ZIP whose end record cannot be found is NOT graded "no password"' \
            || { echo 'an unparseable zip could be cleared as having no password'; exit 1; }
          echo "$out" | grep -q 'live: a file an administrator cannot open is counted into the gap, not silently dropped' \
            || { echo 'a DENY ACL on the archive could make it vanish from the report'; exit 1; }
          echo "$out" | grep -q 'a folder the time budget never reached is declared as that -- not as a permissions failure' \
            || { echo 'a slow laptop could get a false gap row worded as an ACL failure'; exit 1; }
          echo "$out" | grep -q 'live: a real-shaped 7-Zip set (.001 signed, .002/.003 raw) is read across its volumes' \
            || { echo 'a real 7-Zip set could lose its part count, and the CI plant would fail on every image with 7-Zip'; exit 1; }
          echo "$out" | grep -q 'a split set with no password in Downloads is named context' \
            || { echo 'every scene-release RAR set in Downloads could become a WARNING'; exit 1; }
          echo "$out" | grep -q "a Keynote presentation (talk.key) and a project's nginx/server.key are NOT the credential class" \
            || { echo 'a Keynote file in Downloads could be called a private key'; exit 1; }
          echo "$out" | grep -q 'a single-disk ZIP64 with 0xFFFF sentinels in its end record is NOT a split set' \
            || { echo 'every large zip could read as a volume set'; exit 1; }
          echo "$out" | grep -q "one folder is one folder: %TEMP% in 8.3 form beside the profile's own Temp is listed ONCE" \
            || { echo 'a short %TEMP% could make one folder read as two again'; exit 1; }
          n=$(echo "$out" | grep -c '^\[OK\]')
          [ "$n" -ge 157 ] || { echo "self-test ran only $n case(s) -- it is not exercising the rule"; exit 1; }

  run-lock:
    name: "One audit at a time: a second invocation stands down, a stale lock never blocks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tools/run_lock.ps1 -SelfTest
        run: pwsh -NoProfile -File tools/run_lock.ps1 -SelfTest
      - name: The judgements stay pinned by name
        run: |
          out=$(pwsh -NoProfile -File tools/run_lock.ps1 -SelfTest)
          echo "$out"
          echo "$out" | grep -q 'a live holder with the same creation time and name: BUSY, the locks untouched' \
            || { echo 'a second audit could run beside a live one again'; exit 1; }
          echo "$out" | grep -q 'the PID reused by a later process: STALE, replaced' \
            || { echo 'a reused PID could keep a dead lock alive and block every audit'; exit 1; }
          echo "$out" | grep -q 'the holder is gone (a reboot or a crash mid-run): STALE, replaced' \
            || { echo 'a lock left by a crash could block the resume it exists for'; exit 1; }
          echo "$out" | grep -q 'a probe that cannot answer is UNKNOWN: the audit runs' \
            || { echo 'a probe failure could refuse an audit on a guess'; exit 1; }
          echo "$out" | grep -q 'a crafted lock cannot forge a line of the busy message' \
            || { echo 'a planted lock could write its own line to the console'; exit 1; }
          echo "$out" | grep -q 'busy when only the OUTPUT-folder lock is held' \
            || { echo 'a second run with another TEMP (the CI full-run job) could run beside the first'; exit 1; }
          echo "$out" | grep -q 'a lock held by the open prompt ABOVE this run' \
            || { echo 're-running through the console-log pipe after an interrupted -noConsoleLog run could read busy against itself'; exit 1; }
          echo "$out" | grep -q "a lock naming THIS run's own window" \
            || { echo 'an audit interrupted in an open Command Prompt could block every later audit'; exit 1; }
          echo "$out" | grep -q 'and the busy message says how to clear an interrupted lock, naming the file' \
            || { echo 'the busy message could go back to saying there is nothing to do'; exit 1; }
          n=$(echo "$out" | grep -c '^\[OK\]')
          [ "$n" -ge 21 ] || { echo "self-test ran only $n case(s)"; exit 1; }
      # Where the lock is taken and released decides whether it works at all:
      # before the first shared %TEMP% write, the ChangeLog/Undo files and the
      # admin check; released at BOTH exit labels every path after it reaches;
      # and identical in both bats.
      - name: The lock is taken before anything shared is written, and released at every exit
        shell: pwsh
        run: |
          $blocks = @{}
          foreach ($b in 'doze_sec.bat', 'doze_sec_noAdmin.bat') {
            $l = [IO.File]::ReadAllLines($b)
            $startAt = [array]::FindIndex($l, [Predicate[string]]{ param($x) $x -match '^:: ---- One audit at a time' })
            $lockAt = [array]::FindIndex($l, [Predicate[string]]{ param($x) $x -match 'tools\\run_lock\.ps1" -LockFiles "%DZ_LOCK%\|%DZ_LOCK2%"' })
            $doneAt = [array]::FindIndex($l, [Predicate[string]]{ param($x) $x -match '^:run_lock_done' })
            if ($startAt -lt 0 -or $lockAt -lt 0 -or $doneAt -lt 0) { throw "${b}: the run lock block is missing" }
            # A duplicated label is not a syntax error in cmd: goto takes the
            # first one. A leftover busy tail with its own :run_lock_done (it
            # happened while this block was being rewritten) would make EVERY
            # audit exit 1 at startup.
            foreach ($lab in '^:run_lock_done\b', '^:run_lock_noted\b') {
              $nl = @($l | Where-Object { $_ -match $lab }).Count
              if ($nl -ne 1) { throw ("{0}: label {1} is defined {2} times -- goto would take the first" -f $b, $lab, $nl) }
            }
            if ($doneAt -lt $lockAt) { throw "${b}: :run_lock_done comes before the lock is taken" }
            $before = @(
              @('the threat-list seed (the first %TEMP% write)', 'tools\\threat_list_seed\.ps1" -ShippedDir .* > "%TEMP%\\dz_seed\.txt"'),
              @('the -resetTTP handler (it deletes the runtime threat lists)', '^if "%RESET_TTP%"=="0" goto :skip_reset_ttp'),
              @('the -updateTTP handler', '^if "%UPDATE_TTP%"=="0" goto :skip_ttp_update'),
              @('the ChangeLog creation', 'set "CHANGELOG='),
              @('the admin check', '^net session')
            )
            foreach ($pair in $before) {
              $at = [array]::FindIndex($l, [Predicate[string]]{ param($x) $x -match $pair[1] })
              if ($at -ge 0 -and $lockAt -gt $at) { throw ("{0}: the run lock is taken AFTER {1}" -f $b, $pair[0]) }
            }
            $text = [IO.File]::ReadAllText($b)
            foreach ($lab in ':final_exit', ':fatal_preinit_exit') {
              $m = [regex]::Match($text, '(?m)^' + [regex]::Escape($lab) + '\r?\n((?:.*\r?\n){0,10})')
              $win = $m.Groups[1].Value
              foreach ($need in 'findstr /c:"token=%DZ_LOCK_ID%;" "%DZ_LOCK%" >nul 2>&1 && del "%DZ_LOCK%"', 'findstr /c:"token=%DZ_LOCK_ID%;" "%DZ_LOCK2%" >nul 2>&1 && del "%DZ_LOCK2%"') {
                if (-not $m.Success -or -not $win.Contains($need)) { throw ("{0}: {1} does not release a run lock by its token ({2})" -f $b, $lab, $need) }
              }
            }
            $blocks[$b] = ($l[$startAt..$doneAt] -join "`n")
            # OUTDIR is decided once, before the first line that reads it, and
            # the output-folder lock is that folder. An "if not defined OUTDIR"
            # fallback let an OUTDIR inherited from the environment reach the
            # -resetTTP/-updateTTP handlers, which then deleted and wrote threat
            # lists in that folder, outside the one the lock guards.
            if (@($l | Where-Object { $_ -notmatch '^\s*(::|rem\b)' -and $_ -match '(?i)\bif\s+(not\s+)?defined\s+OUTDIR\b' }).Count) { throw "${b}: OUTDIR is still tested with 'if defined' -- an inherited OUTDIR would be used" }
            $setAt = [array]::FindIndex($l, [Predicate[string]]{ param($x) $x -match '^\s*set "OUTDIR=' -and $x -notmatch '%OUTDIR%' })
            $readAt = [array]::FindIndex($l, [Predicate[string]]{ param($x) $x -notmatch '^\s*(::|rem\b)' -and ($x -match '(%|!)OUTDIR(%|!|:)' -or $x -match '(?i)\$env:OUTDIR\b') -and $x -notmatch '^\s*(if\s.*)?set "OUTDIR=' })
            if ($setAt -lt 0) { throw "${b}: OUTDIR is never set" }
            if ($readAt -lt 0 -or $readAt -lt $setAt) { throw ("{0}: OUTDIR is read (line {1}) before it is set (line {2})" -f $b, ($readAt + 1), ($setAt + 1)) }
            if ($b -eq 'doze_sec.bat' -and $l[$setAt] -notmatch '^set "OUTDIR=C:\\SecurityAudit"$') { throw "${b}: the first OUTDIR set is not the unconditional one" }
            if (@($l | Where-Object { $_ -match '^set "DZ_LOCKDIR=%OUTDIR%"$' }).Count -ne 1 -or @($l | Where-Object { $_ -match 'set "DZ_LOCKDIR=' }).Count -ne 1) { throw "${b}: the output-folder lock is not derived from OUTDIR, once" }
            # The -updateTTP handler's other "if not defined" fallbacks name files
            # it writes and deletes; they are cleared before the handler decides them.
            if ($b -eq 'doze_sec.bat') {
              $hAt = [array]::FindIndex($l, [Predicate[string]]{ param($x) $x -match '^if "%UPDATE_TTP%"=="0" goto :skip_ttp_update' })
              foreach ($v in 'IOC_GUID', 'TTP_TODAY') {
                $clrAt = [array]::FindIndex($l, [Predicate[string]]{ param($x) $x -eq ('set "' + $v + '="') })
                $useAt = [array]::FindIndex($l, [Predicate[string]]{ param($x) $x -match ('if not defined ' + $v + '\b') })
                if ($clrAt -lt $hAt -or $useAt -lt $clrAt) { throw "${b}: $v is not cleared at the top of the -updateTTP handler -- an inherited value would name the file it writes and deletes" }
              }
            }
          }
          if ($blocks['doze_sec.bat'] -ne $blocks['doze_sec_noAdmin.bat']) { throw 'the run lock block differs between the two bats' }
          Write-Host '[OK] both bats take both run locks before the first shared write (the threat-list handlers and seed, the ChangeLog, the admin check), release each only by its token at both exit labels, and carry the same block'

  coverage-matrix-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both completeness gates -- "every technique the code references is
      # mapped" and "every core detection has a plant" -- lived only in
      # windows-smoke. So an escaped technique id in a self-test regex, which a
      # scanner that does not drop backslashes reads as the PARENT technique
      # that no manifest line maps, failed three Windows jobs and skipped 26
      # steps before anything said so. They run on Linux too now, where a push
      # costs seconds.
      - name: attack_matrix.ps1 -Strict + emulation_coverage.ps1 -Strict (the matrix cannot drift from the code)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $am = (./tools/attack_matrix.ps1 -SourceDir . -Strict) -join "`n"
          Write-Host $am
          if ($LASTEXITCODE -ne 0) { throw 'attack_matrix -Strict found technique ids referenced by the audit but not mapped in ttp_manifest.txt (see the WARNING line above)' }
          if ($am -notmatch 'coverage matrix is complete') { throw 'completeness line missing -- unexpected unmapped techniques' }
          if ($am -notmatch '(?m)^Persistence\s+\(\d+\)') { throw 'Persistence tactic group missing -- the source scan found nothing' }
          # Prove the gate is not vacuous: an empty reference set satisfies
          # "every referenced technique is mapped" trivially, so a scan that
          # finds nothing must FAIL under -Strict.
          $empty = Join-Path ([IO.Path]::GetTempPath()) ("dz_empty_src_{0}" -f $PID)
          New-Item -ItemType Directory -Path $empty -Force | Out-Null
          Copy-Item ThreatLists/ttp_manifest.txt (Join-Path $empty 'ttp_manifest.txt') -Force
          $vac = (./tools/attack_matrix.ps1 -SourceDir $empty -Manifest (Join-Path $empty 'ttp_manifest.txt') -Strict) -join "`n"
          if ($LASTEXITCODE -eq 0) { Write-Host $vac; throw 'attack_matrix -Strict PASSED on a source tree with no techniques -- the gate can pass vacuously' }
          # The mutation, against the real tree: with the backslash strip
          # removed, the escaped ids this repo's self-tests really do write must
          # make the gate fail. If they do not, the strip is no longer what
          # keeps the matrix complete and this guard proves nothing.
          $needle = '((Get-Content -LiteralPath $f -Raw -EA Stop) -replace ''\\'', '''')'
          $orig = [IO.File]::ReadAllText('tools/attack_matrix.ps1')
          if (-not $orig.Contains($needle)) { throw 'the mutation needle no longer matches attack_matrix.ps1 -- this guard cannot prove anything' }
          $mutPath = Join-Path $empty 'mut_attack_matrix.ps1'
          [IO.File]::WriteAllText($mutPath, $orig.Replace($needle, '(Get-Content -LiteralPath $f -Raw -EA Stop)'))
          $mut = (& $mutPath -SourceDir . -Manifest ThreatLists/ttp_manifest.txt -Strict) -join "`n"
          if ($LASTEXITCODE -eq 0 -or $mut -notmatch 'NOT mapped in ttp_manifest') { Write-Host $mut; throw 'attack_matrix without the backslash strip still reported a complete matrix -- the strip is not what this depends on, or no escaped id is left in the tree' }
          Remove-Item $empty -Recurse -Force -EA SilentlyContinue
          $ec = (./tools/emulation_coverage.ps1 -SourceDir . -Strict) -join "`n"
          Write-Host $ec
          if ($LASTEXITCODE -ne 0) { throw 'emulation_coverage -Strict failed -- a core detection lost its plant, or a corpus tag names a technique the audit no longer detects' }
          if ($ec -notmatch 'Emulation corpus is consistent') { throw 'consistency line missing from emulation_coverage' }
          # A real instance, pinned: tools/asr_lsass_events.ps1 and
          # tools/lsass_dump_config.ps1 each assert on a printed line whose
          # technique id is escaped inside a regex. Read without the strip, that
          # is T1003 -- which would arrive here as a detection with no plant,
          # sending the next person to write a test for a technique no check
          # references.
          if ($ec -match '(?m)^\s+T1003\s*$') { throw 'the emulation backlog lists T1003, which no check references -- an escaped sub-technique id was read as its parent' }
          Write-Host "[OK] coverage matrix complete and emulation corpus consistent; both gates fail on a tree that would drift, and the mutation fails as it should"
