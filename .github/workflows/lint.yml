      - name: reg_policy_check -- Winlogon/AppInit, Script Block Logging and UAC; a key that could not be read is a raised gap, never an all-clear
        run: |
          out=$(pwsh -NoProfile -File tools/reg_policy_check.ps1 -SelfTest); echo "$out"
          for n in 'a second program appended to Userinit: the CRITICAL wording the bats always printed, with the value' \
                   'the default is judged against THIS Windows directory, not a hardcoded C:\Windows' \
                   'the Winlogon key could not be read: two raised gaps, never [SKIPPED] and never "is the default"' \
                   'a line break inside a Userinit value cannot forge an [OK] line' \
                   'AppInit_DLLs set only under Wow6432Node, with loading switched off: still CRITICAL -- context never downgrades' \
                   'the native AppInit key could not be read: a raised gap, never "[OK] AppInit_DLLs empty."' \
                   'the Script Block Logging key could not be read: a raised gap, not "NOT enabled" (the tool did not observe that)' \
                   'UAC on with the Windows default prompt (5): [OK], nothing raised' \
                   'EnableLUA 0: the CRITICAL wording the bats always printed, and one finding, not two' \
                   'Policies\System could not be read: a raised gap, never "[OK] UAC enabled" and never "value MISSING"'; do
            echo "$out" | grep -qF "$n" || { echo "case gone: $n"; exit 1; }
          done
          n=$(echo "$out" | grep -c '^\[OK\]   '); [ "$n" -ge 58 ] || { echo "only $n case(s)"; exit 1; }
          for b in doze_sec.bat doze_sec_noAdmin.bat; do
            for v in Userinit Shell AppInit_DLLs EnableLUA EnableScriptBlockLogging; do
              # A fix's own command may read the old value for its undo; that is not a check.
              grep -vF 'addfix ' "$b" | grep -qE -- "-Name $v -EA SilentlyContinue" && { echo "$b: a silenced read of $v is back (in a section or a re-measuring tile)"; exit 1; }
            done
            grep -qF 'if errorlevel 1 (echo [OK] LocalAccountTokenFilterPolicy' "$b" && { echo "$b: the raw reg query prints [OK] on any failure again"; exit 1; }
            grep -qF '_LUA_MISSING' "$b" && { echo "$b: a failed reg.exe is raised as a MISSING value again"; exit 1; }
            for w in 'Winlogon and AppInit_DLLs checks produced no verdict' 'Script Block Logging check produced no verdict' 'UAC check produced no verdict'; do
              grep -qF "$w" "$b" || { echo "$b: lost its no-verdict backstop: $w"; exit 1; }
            done
            for t in "echo \$us='%UAC_STATE%'" "echo \$ss2='%SBL_STATE%'" "echo \$ws2='%WINLOGON_STATE%'"; do
              grep -qF "$t" "$b" || { echo "$b: a tile no longer reads its section's verdict: $t"; exit 1; }
            done
            for f in "led 'CRITICAL' '13' 'T1548.002' 'UAC disabled'" "led 'WARNING' '13' 'T1548.002' 'UAC elevates without prompting'" "led 'WARNING' '11' 'T1562.002' 'Script Block Logging not enabled'" "led 'CRITICAL' '5' 'T1546.010' 'AppInit_DLLs set'"; do
              grep -qF "$f" "$b" || { echo "$b: a fix no longer triggers off the ledger: $f"; exit 1; }
            done
            grep -qF 'UAC not fully hardened' "$b" && { echo "$b: a prompting UAC setting is graded WARN again, against Section 13"; exit 1; }
          done
          # A standard user skips the BitLocker PSRUN: the run line must sit
          # inside the skipped stretch, or a stale script would be executed.
          awk '/^if "%IS_ADMIN%"=="0" goto :sec13_bl_eval_done/{f=1} /^:sec13_bl_eval_done/{f=0} f' doze_sec_noAdmin.bat | grep -qF -- '-File "%PSRUN%"' || { echo 'doze_sec_noAdmin.bat: the Section 13 PSRUN run is outside the standard-user skip -- it would run a stale script'; exit 1; }
          # GitHub will not run a workflow file over its size limit, and says
          # so nowhere on the pull request: the six Windows jobs simply never
          # appear, and the 28 lint checks alone read as a green PR. Measured:
          # 510,010 bytes ran; 518,967 did not. New CI step bodies go in
          # .github/ci/*.ps1 and are called from the step.
          for w in .github/workflows/*.yml; do
            sz=$(wc -c < "$w")
            [ "$sz" -le 505000 ] || { echo "$w is $sz bytes -- over 505,000, too close to the size at which GitHub silently refuses to run it (a 510,010-byte file ran, a 518,967-byte one did not). Move a step's body into .github/ci/ and call it from the step."; exit 1; }
          done
          # windows-smoke.yml was brought down to about 284,000 bytes by moving
          # its large step bodies out. Fail well before the limit, so the room
          # cannot be spent without anyone noticing a second time.
          sz=$(wc -c < .github/workflows/windows-smoke.yml)
          [ "$sz" -le 400000 ] || { echo "windows-smoke.yml is $sz bytes -- over 400,000. Move a step's body into .github/ci/ and call it from the step."; exit 1; }
          # Every script a step calls must exist, and every script in
          # .github/ci/ must be called by exactly one step: a missing file
          # runs nothing, an orphan is a test nobody runs, and a body called
          # twice plants twice.
          # Only call lines count ("& .\..." or ". .\..."), never a comment that names a script.
          called=$(grep -E '^ +[&.] \.\\\.github\\ci\\[a-z0-9_]+\.ps1$' .github/workflows/windows-smoke.yml | sed 's/.*\\//' | sort)
          [ -n "$called" ] || { echo 'no .github/ci call parsed from windows-smoke.yml -- this check is broken, not the code'; exit 1; }
          dup=$(echo "$called" | uniq -d); [ -z "$dup" ] || { echo "called by more than one step: $dup"; exit 1; }
          for f in $called; do [ -s ".github/ci/$f" ] || { echo ".github/ci/$f is missing or empty -- its step would run nothing"; exit 1; }; done
          for f in .github/ci/*.ps1; do echo "$called" | grep -qxF "$(basename "$f")" || { echo "$f is called by no step in windows-smoke.yml"; exit 1; }; done
          n=$(echo "$called" | wc -l); [ "$n" -ge 25 ] || { echo "only $n step(s) call a .github/ci script; 25 are expected"; exit 1; }
          # cmd reads a bare < or > in an echo as a file redirection, quoted or
          # not by PowerShell's single quotes: 'Expected: <Windows>\system32...'
          # in a tile's help text made the whole line vanish from the dashboard
          # script. No echo that writes to %PSRUN% may carry one outside
          # double quotes unless it is caret-escaped.
          python3 - <<'PY'
          import re, sys
          bad = []
          for b in ('doze_sec.bat', 'doze_sec_noAdmin.bat'):
              for n, l in enumerate(open(b, encoding='latin-1', newline='').read().replace('\r\n', '\n').split('\n'), 1):
                  m = re.match(r'^echo (.*?)\s*>>?\s*"%PSRUN%"\s*$', l)
                  if not m:
                      continue
                  body, q, i = m.group(1), False, 0
                  while i < len(body):
                      c = body[i]
                      if c == '"':
                          q = not q
                      elif c == '^' and not q:
                          i += 1
                      elif c in '<>' and not q:
                          bad.append('%s:%d: %s' % (b, n, body[max(0, i - 40):i + 20]))
                          break
                      i += 1
          if bad:
              print('a bare < or > in an echo written to %PSRUN% -- cmd treats it as a redirection and the line never reaches the script:')
              print('\n'.join(bad))
              sys.exit(1)
          print('no bare redirection character in any echo written to %PSRUN%')
          PY
          echo 'Winlogon/AppInit, Script Block Logging and UAC: unreadable is a gap; the tiles and fixes read the sections and the ledger'
